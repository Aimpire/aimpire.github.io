  font:650 .88rem/1.45 var(--face);color:color-mix(in srgb,var(--chalk) 78%,var(--chalk-dim))}
.pgrid-corridor.pshelf .pfacts .pf + .pf::before{content:"·";margin-inline:8px;opacity:.5;font-weight:500}
/* Jet primary CTA — solid control, not underlined orphan link. */
.pgrid-corridor.pshelf .pcta{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  margin-top:4px;min-height:44px;padding:11px 16px;width:100%;max-width:22rem;
  border:0;border-radius:var(--r-tool);cursor:pointer;pointer-events:none;
  background:var(--cta-primary-bg);
  color:var(--cta-primary-fg);
  font:800 .98rem/1.15 var(--display);letter-spacing:-.01em;
  box-shadow:var(--cta-shadow);position:relative;text-decoration:none !important}
.pgrid-corridor.pshelf .pcta::after{
  content:"";position:absolute;inset-inline:14px;bottom:7px;height:2px;border-radius:2px;
  background:var(--teal-live,#15D8C4);opacity:.95} /* AIM-290b: solid teal tick — not --grad-ink rainbow */
html[dir="rtl"] .pgrid-corridor.pshelf .pcta{font-family:var(--face)}
/* Risk beside / under CTA — same viewport weight as the action (B-030). */
.pgrid-corridor.pshelf .prisk{
  margin:2px 0 0;max-width:42ch;
  font:600 .86rem/1.45 var(--face);color:#A8420C}
:root[data-theme="dark"] .pgrid-corridor.pshelf .prisk{color:#F08A4B}
.pgrid-corridor.pshelf .pcard .pm{display:none}
.pgrid-corridor.pshelf .pcard .ptop{justify-content:flex-start;gap:10px;align-items:baseline}
/* Later products (non-featured): quieter shelf row — ready without a rename. */
.pgrid-corridor.pshelf > .pcard.pstep:not(.pfeat){
  padding:16px 14px}
.pgrid-corridor.pshelf > .pcard.pstep:not(.pfeat) .pt{font-size:1.15rem;font-weight:800}
.pgrid-corridor.pshelf > .pcard.pstep:not(.pfeat) .pd{font-size:.95rem}
.pgrid-corridor > .pcard.pstep > .spark{display:none}
.pcard .pnum{display:inline-grid;place-items:center;min-width:1.6rem;height:1.6rem;border-radius:8px;font:700 .78rem/1 var(--display);background:var(--rule);color:var(--chalk)}
.pgrid-corridor .pcard .pnum{width:1.7rem;height:1.7rem;min-width:1.7rem;margin-top:2px;font:700 .72rem/1 var(--display)}
.pgrid-corridor > .pcard.pmore{grid-template-columns:1.7rem minmax(0,1fr);align-items:start;padding:14px 2px 12px}
.pgrid-corridor > .pcard.pmore .pnum{background:transparent;color:var(--chalk-dim);font-weight:600}
.pgrid-corridor > .pcard.pmore .pt{font-size:1.02rem}
.pgrid-corridor > .pcard.pmore .pd{font-size:.9rem;max-width:42ch}
.pcard.pmore{cursor:pointer;background:none;border-style:dashed}
/* Legacy .pone alias → shelf featured (older tours / selectors). */
.pgrid-corridor.pone{margin:0 0 16px;border:0;gap:0}
.pgrid-corridor.pone > .pcard.pstep{grid-template-columns:minmax(0,1fr)}
.pgrid-corridor.pone > .pcard.pstep > .pnum{display:none}
/* Tools door — quieter than Sonic, but clearly a door (not another product). */
.prodview .ptools-door{
  display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:12px;
  width:100%;text-align:start;margin:10px 0 12px;padding:13px 12px 13px 14px;
  border:1px dashed color-mix(in srgb,var(--rule) 70%,transparent);border-radius:14px;
  background:transparent;color:inherit;cursor:pointer;
  scroll-margin-bottom:calc(88px + env(safe-area-inset-bottom, 0px));
  transition:border-color .15s ease,background .15s ease}
.prodview .ptools-door:active{transform:scale(.992)}
.prodview .ptools-door .pdoor-body{display:grid;gap:3px;min-width:0}
.prodview .ptools-door .pt{display:block;font:700 1rem/1.25 var(--display);color:var(--chalk);letter-spacing:-.01em}
.prodview .ptools-door .pd{
  display:block;font:500 .88rem/1.4 var(--face);max-width:36ch}
:root[data-theme="dark"] .prodview .ptools-door .pd{color:#D2CDDA}
:root:not([data-theme="dark"]) .prodview .ptools-door .pd{color:#3A3E48}
.prodview .ptools-door .pdoor-go{
  flex:0 0 auto;width:1.75rem;height:1.75rem;border-radius:50%;
  display:grid;place-items:center;font:800 1.05rem/1 var(--display);
  color:var(--gold-soft,var(--teal-live));
  background:color-mix(in srgb,var(--teal-live) 14%,transparent);
  border:1px solid color-mix(in srgb,var(--teal-live) 35%,var(--rule))}
html[dir="rtl"] .prodview .ptools-door .pdoor-go{transform:scaleX(-1)}
:root:not([data-theme="dark"]) .prodview .ptools-door{
  background:color-mix(in srgb,#fff 70%,transparent);
  border-color:color-mix(in srgb,var(--rule) 85%,var(--brand-blue))}
:root[data-theme="dark"] .prodview .ptools-door{
  background:color-mix(in srgb,var(--ink-deep) 55%,transparent);
  border-color:color-mix(in srgb,var(--rule) 75%,var(--brand-blue))}
.prodview .ptool .pm{display:block;margin-top:4px;font-size:.86rem;color:var(--gold-soft,var(--teal-live))}
@media (prefers-reduced-motion:no-preference){
  .pgrid-corridor.pshelf > .pcard.pstep{transition:border-color .2s ease,box-shadow .2s ease}
  .pgrid-corridor.pshelf > .pcard.pfeat{animation:hairlineIn .45s cubic-bezier(.2,.7,.3,1) both}
  .pgrid-corridor.pshelf .pcta{transition:transform .15s ease,box-shadow .15s ease}
  .prodview .ptools-door .pdoor-go{transition:transform .15s ease,background .15s ease}
  .prodview .ptools-door:active .pdoor-go{transform:translateX(2px)}
  html[dir="rtl"] .prodview .ptools-door:active .pdoor-go{transform:scaleX(-1) translateX(2px)}
}
@media (prefers-reduced-motion:reduce){
  .pgrid-corridor.pshelf > .pcard.pfeat{animation:none !important}
}
/* AIM-123 owns tabbar invert (#146). Do not reassert .tabbar background here —
   AIM-115 `.tabbar{background:var(--ink-deep)!important}` currently flattens the invert. */
.tbb.tbhome svg{display:none}
.tbring{display:grid;place-items:center;width:var(--tab-ring,46px);height:var(--tab-ring,46px);margin-top:calc(var(--tab-ring,46px) * -.42);border-radius:50%;
  background:var(--ink-raise);box-shadow:0 0 0 1.5px color-mix(in srgb,var(--teal-live) 55%,transparent),0 6px 18px -6px rgba(11,35,65,.55);transition:box-shadow .2s}
.tbring img{width:26px;height:26px}
/* Shared home ring = teal metal only (no purple multi-glow). Home craft #434 may refine further. */
.tbb.tbhome[aria-current="page"] .tbring{box-shadow:0 0 0 2px var(--teal-live),0 0 14px color-mix(in srgb,var(--teal-live) 40%,transparent)}
.tbb.tbhome[aria-current="page"]::before{display:none}
.tbb.tbhome:active .tbring{transform:scale(.94)}
/* Fanelinja har Hjem alltid synlig -> «Alle deler» oeverst er samme knapp to ganger og tok
   halve fanerekka (kundegjennomgang 17.10 23:30). Skjules naar fanelinja finnes. */
body.has-tabbar #back{display:none}
/* #146 (founder 18.10): opposite-theme meny was the design. Craft later forced
   .tabbar{background:var(--ink-deep)!important} (solid same-theme pill).
   LIGHT only: ink must be dark chalk vs that white/marine pill (live white-on-white).
   DARK: leave #146 ink untouched here — Products strength = AIM-124. */
:root[data-theme="dark"] .tabbar{background:#F3F5FA;border-top:0;box-shadow:0 -6px 24px rgba(0,0,0,.45)}
:root[data-theme="dark"] .tbb{color:#4B5270}
:root[data-theme="dark"] .tbb[aria-current="page"]{color:#0B1020}
:root[data-theme="dark"] .tbring{background:#0B1020}
:root[data-theme="dark"] .tbb .dot{box-shadow:0 0 0 2px #F3F5FA}
:root:not([data-theme="dark"]) .tabbar{background:var(--ink-deep);border-top:0;box-shadow:0 -4px 18px rgba(26,34,48,.14)}
:root:not([data-theme="dark"]) .tbb{color:#556172}
:root:not([data-theme="dark"]) .tbb[aria-current="page"]{color:#1F2A3C}
:root:not([data-theme="dark"]) .tbring{background:#1F2A3C}
:root:not([data-theme="dark"]) .tbb .dot{box-shadow:0 0 0 2px var(--ink-deep)}
html[data-font="nastaliq"] .tbb span,html[data-font="naskh"] .tbb span{line-height:1.3;overflow:visible;font-size:var(--tbfs,var(--fs-nav));margin-top:0;padding-block:1px 2px}
html[data-font="nastaliq"] .tbb,html[data-font="naskh"] .tbb{padding-bottom:4px}
body.has-tabbar{padding-bottom:var(--tab-clear)}
body.has-tabbar #pille{bottom:calc(var(--tab-clear) + 6px)}
/* #178 was a floating inset pill (bottom:max(8px,safe-area)) — content leaked under it.
   AIM-235: keep opposite-theme invert + upward shadow, but bar stays edge-sealed (see AIM-235). */
:root[data-theme="dark"] .tabbar{box-shadow:0 -8px 28px rgba(0,0,0,.4)}
:root:not([data-theme="dark"]) .tabbar{box-shadow:0 -6px 22px rgba(26,34,48,.2)}
.tbb{min-height:var(--tab-min-h);padding:6px 1px 5px;gap:2px}
.tbb[aria-current="page"]::before{display:none}
.tbb:not(.tbhome)::after{content:"";position:absolute;top:5px;left:50%;width:42px;height:26px;margin-left:-21px;border-radius:13px;
  background:transparent;transition:background .2s;z-index:-1}
.tbb{isolation:isolate}
/* AIM-188: active tab wash = teal brand (not purple-blue Claude pill). */
:root[data-theme="dark"] .tbb[aria-current="page"]:not(.tbhome)::after{background:var(--nav-wash)}
:root:not([data-theme="dark"]) .tbb[aria-current="page"]:not(.tbhome)::after{background:var(--nav-wash-light)}
.tbb[aria-current="page"] span{font-weight:800}
.tbring{margin-top:calc(var(--tab-ring) * -.38);width:var(--tab-ring);height:var(--tab-ring)}
/* AIM-235: keep progress on the TOP edge of the sealed bar — bottom:3px sat in
   the iOS/Android safe-area padding and looked like a rainbow leak under the menu. */
.tabbar .tbprog{top:0;bottom:auto;inset-inline:0;height:2px;border-radius:0;overflow:hidden}
@media (prefers-reduced-motion:no-preference){.tbb svg{transition:transform .15s ease}}
#pille{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));z-index:99;pointer-events:none;
  transform:translate(-50%,24px);opacity:0;padding:10px 18px;border-radius:999px;
  background:var(--jet);color:var(--jet-on);font:700 1rem/1 var(--face, "Montserrat", sans-serif);letter-spacing:.02em;
  box-shadow:0 10px 30px -8px rgba(20,16,28,.45),0 2px 6px rgba(20,16,28,.18);
  transition:transform .35s cubic-bezier(.2,.8,.3,1.2),opacity .25s ease}
#pille.vis{transform:translate(-50%,0);opacity:1}
@media (prefers-reduced-motion:reduce){
  .out .apply,.nextb,.joinbtn,.back,.menu .share,#notice-none .dlink,#spon .dlink,.plate{transition:none}
  .out .apply:active,.nextb:active,.joinbtn:active{transform:none}}

/* ===== #150 Anti-mal (founder 18.10 15:57/16:07 «man ser at Claude har laget dette … step opp»).
   Malsporene som går igjen er fjernet her, samlet, så de ikke sniker seg inn igjen:
   gradientstrek under hver overskrift · overskrift i boks med ikon-firkant · tall i like bokser
   med gradienttekst · emoji i rammede firkanter · gradientstripe øverst på kort.
   Prinsipp: typografi og luft bærer hierarkiet; gradienten brukes bare der noe er i bevegelse
   (neonlinja, framdrift, valgt fane). ===== */
.sec > h2 b,.short > h2 b{display:none}
.sec > h2,.short > h2{font-family:"Archivo",var(--display);font-stretch:90%;font-weight:800;font-size:1.6rem;line-height:1.28;letter-spacing:-.012em;word-spacing:.08em}
html:is([data-font="deva"],[data-font="nastaliq"],[data-font="naskh"]) .sec > h2,html:is([data-font="deva"],[data-font="nastaliq"],[data-font="naskh"]) .short > h2{font-family:var(--face);font-stretch:normal}
.vhead{background:none;border:0;border-radius:0;padding:4px 0 2px;margin:18px 0 6px;gap:0;overflow:visible}
.vhead::after{display:none}
.vhead .vic{display:none}
.vhead .vtx b{font-family:"Archivo",var(--display);font-stretch:88%;font-weight:900;font-size:2.15rem;line-height:1.22;letter-spacing:-.018em;word-spacing:.08em}
html[data-font="deva"] .vhead .vtx b{font-family:var(--face);font-stretch:normal;font-size:1.7rem;line-height:1.4}
/* AIM-239: script folder titles stay denser than Hindi display (no 1.7rem wall). */
html[data-font="nastaliq"] .vhead .vtx b{font-family:var(--face);font-stretch:normal;font-size:clamp(1.08rem,3.6vw,1.28rem);line-height:1.4}
html[data-font="naskh"] .vhead .vtx b{font-family:var(--face);font-stretch:normal;font-size:clamp(1.22rem,4.3vw,1.5rem);line-height:1.35}
.vhead .vtx span{font-size:.95rem;max-width:34ch}
.vhead .spark{display:none}
.shchips{gap:0;border-block:1px solid var(--rule)}
.shchip{border:0;border-radius:0;padding:14px 8px;align-items:flex-start;text-align:start;animation:none}
.shchip + .shchip{border-inline-start:1px solid var(--rule)}
.shchip b{background:none;-webkit-background-clip:border-box;background-clip:border-box;color:var(--chalk);font-family:"Archivo",var(--display);font-stretch:85%;font-size:1.7rem}
.sncalc .row.big b{background:none;-webkit-background-clip:border-box;background-clip:border-box;color:var(--gold-soft)}
.sncalc.snkept .kept-val{color:var(--gold-soft)}
.sncalc.snkept .cseg{margin-bottom:6px}
.short .iqic.emo{background:none;border:0}
.snspark{border:0;padding:10px 0;border-radius:0}
.iqtree,.iqtrack{border:0;padding:6px 0;border-radius:0}
.mfeat .plate > .stripe{display:none}
.mfeat .plate .mic{background:none !important;border:0 !important;box-shadow:none !important;width:auto;height:auto;font-size:1.9rem;justify-content:start}
#academy .lic{background:var(--rule);border:0;font-size:.72rem}
#academy .lic b{background:none;color:inherit}
/* Flyt (iqflow) er en ekte rekkefølge: loddrett linje med punkter, ikke tre like kort side om side. */
.iqflow{flex-direction:column;gap:0;margin:16px 0 0;margin-inline-start:9px;border-inline-start:2px solid var(--rule)}
.iqflow > .iqarr{display:none}
.iqflow > .iqnode{display:grid;grid-template-columns:30px 1fr;column-gap:12px;align-items:center;text-align:start;
  padding:12px 0;padding-inline-start:18px;border:0;border-radius:0;background:none;box-shadow:none;position:relative;animation:none}
.iqflow > .iqnode::before{content:"";position:absolute;inset-inline-start:-7px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;
  background:var(--ink);border:2px solid #15D8C4}
.iqflow > .iqnode:last-child::before{background:#15D8C4}
.iqflow > .iqnode > :first-child{grid-row:1 / span 2;font-size:1.4rem;background:none;border:0;width:auto;height:auto}
.iqflow > .iqnode strong{font-size:1.02rem}
.iqflow > .iqnode span:last-child{font-size:.86rem}
/* Gradientkant er reservert for NESTE STEG (fortsett-kortet, installer-knappen, stegrekka).
   Alt annet får en rolig kant - da betyr gradienten noe igjen. */
#learn-list > details{background:transparent !important;border:1px solid color-mix(in srgb,var(--chalk) 22%,transparent) !important}
#learn-list > details[open]{border-color:var(--gold-soft) !important}
.slab.own{background:transparent !important;border:1.5px solid color-mix(in srgb,var(--chalk) 38%,transparent) !important}
.slab.own .t{text-transform:none !important;letter-spacing:0 !important}
.vpnb,#spon .sharepill,.out .shareb,.iqbtn.ghost{background:transparent !important;border:1px solid color-mix(in srgb,var(--chalk) 28%,transparent) !important}
/* #247: kit tiles keep solid flate (not ghost/transparent Claude-pill look) */
html[data-page="leaders"] .ldkit .kt{background:transparent !important;border:0 !important;border-bottom:1px solid var(--rule) !important}
.llive{background:none;border:0;border-top:1px solid var(--rule);border-radius:0;padding:16px 0 4px;margin-top:18px}
/* FAQ: en liste med hårfine skiller, ikke en stabel bokser. Spørsmålet bærer, ikonet er stille. */
.qa{border:0;border-radius:0;background:none;margin:0;border-bottom:1px solid var(--rule)}
.faql{border-top:1px solid var(--rule)}
.qa summary{padding:17px 36px 17px 0;font:700 1.02rem/1.35 var(--face)}
[dir=rtl] .qa summary{padding:17px 0 17px 36px}
#faq-list .qa .qi{flex:0 0 auto;width:auto;height:auto;background:none;border:0;border-radius:0;font-size:1.1rem;opacity:.9}
.qa summary::after{content:"";top:50%;inset-inline-end:6px;width:9px;height:9px;margin-top:-7px;border:solid var(--chalk-dim);
  border-width:0 2px 2px 0;transform:rotate(45deg);transition:transform .2s}
.qa[open] summary::after{content:"";transform:rotate(-135deg);margin-top:-2px}
.qa p{padding:0 0 18px;max-width:60ch}
.qa[open]{background:none}
/* Produkter: lenketekst uten påhengt pil (malspor); «Mer på vei» er en stille linje, ikke et stiplet kort. */
.pcard .pm,.wotd .wm{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1.5px}
.pcard.pmore{border:0;padding:6px 2px;grid-template-columns:auto 1fr;align-items:center;column-gap:12px}
.pcard.pmore .mic{grid-row:1 / span 2}.pcard.pmore .pt{font-size:1.05rem}.pcard.pmore .pd{font-size:.9rem}
.pcard.pmore::before,.pcard.pmore::after{display:none}
.plate.feat::before,button.pcard::after{display:none}
/* Products corridor wins over anti-mal card leftovers. */
.pgrid-corridor > .pcard.pmore{padding:14px 2px 12px;grid-template-columns:1.7rem minmax(0,1fr);align-items:start;column-gap:12px}
.pgrid-corridor > .pcard.pmore .pt{font-size:1.02rem}
.pgrid-corridor > .pcard.pmore .pd{font-size:.9rem;max-width:42ch}
.pgrid-corridor > button.pcard::after{display:none}

/* Ingen farget sidekant på lister og tips (malspor): hårfin skillelinje i stedet. */
.places > li{border-inline-start:0 !important;background:none !important;padding:14px 0;border-top:1px solid var(--rule)}
.places > li:first-child{border-top:0}
.iqtip{border-inline-start:0;border-top:1px solid var(--rule);border-radius:0;background:none;padding:12px 0 0}
/* Confirmation craft lives with .chk / .chk-* above — no green leftover override. */
.learn dt{text-transform:none !important;letter-spacing:0 !important;font-weight:700}
.qzt{text-transform:none !important;letter-spacing:0 !important;font-size:.84rem !important}
/* #147 kontrast: valutakoden i markedskortet var 4,0:1 (mørk) og 2,8:1 (lys) - nå >= 4,5:1 */
.mknow .mknews .cc{color:#FF8FA2 !important}
:root:not([data-theme="dark"]) .mknow .mknews .cc{color:#B0182F !important;background:rgba(176,24,47,.10)}
/* Kalkulatorens svar: tall uten bokser, hårfin skille - samme språk som tallene på Sonic. */
.psout{gap:0;border-block:1px solid var(--rule)}
.psout .k,:root[data-theme="dark"] .psout .k{background:none !important;border:0 !important;border-radius:0;padding:14px 4px}
.psout .k + .k{border-inline-start:1px solid var(--rule) !important;padding-inline-start:14px}
.psout .k strong{font-family:"Archivo",var(--display);font-stretch:85%;font-weight:800;font-size:1.8rem}
.psout .warn2{margin:10px 0}
/* #152 Ledersiden etter søknad: skjemaet borte, status med grønn hake øverst. */
.tool.ldsendt > :is(#ld-body,#ld-portal,input,label,#ld-hint,#ld-why,#ld-btn){display:none !important}
/* #233 (founder 19.10 «ledersiden er ikke optimal og rart satt opp»): feltene som kom til senere (advarsel, lenkenavn,
   lederliste, sosiale medier) ble staaende igjen etter innsending - saa en godkjent leder saa et halvt skjema med
   roed advarsel over sin egen lenke. Etter innsending er skjemaet borte; det som teller staar oeverst. */
.tool.ldsendt > :is(#ld-src,#ld-srcok,#ld-navn,#ld-list,#ld-sos){display:none !important}
/* Godkjent: stegstripen er ferdig og trengs ikke. Venter: stripen vises med tre haker og siste steg som venter
   (maalgradient-effekten: tre av fire gjort foeles naert, og man skjoenner hva som gjenstaar). */
html.ldok #sh-s-leaders,html.ldok .sec#s-leaders .shpath{display:none !important}
html.ldvent #sh-s-leaders .shpath li.naa .e{border-color:#F5A524;animation:ldpuls 1.8s ease-in-out infinite}
html.ldvent #sh-s-leaders .shpath li.naa .t{color:var(--chalk)}
@keyframes ldpuls{0%,100%{box-shadow:0 0 0 0 rgba(245,165,36,.45)}50%{box-shadow:0 0 0 7px rgba(245,165,36,0)}}
@media (prefers-reduced-motion:reduce){html.ldvent #sh-s-leaders .shpath li.naa .e{animation:none}}
/* «Søke med en annen Partner-lenke?» brukes nesten aldri - liten tekstlenke, ikke sidens mest fargerike knapp */
.tool .ldagain.ldagain{width:auto;max-width:none;display:inline-block;min-height:0;background:none;color:var(--chalk-dim);box-shadow:none;
  padding:10px 0;margin:18px 0 0;font:600 .86rem/1.3 var(--face);text-decoration:underline;text-underline-offset:3px;border-radius:0;filter:none}
.tool .ldagain.ldagain::after{display:none}
.tool .ldagain.ldagain:hover{color:var(--chalk)}
/* Forhaandsvisning av lenken mens man skriver: slik ser de man inviterer den */
.ldprev{display:grid;gap:4px;margin:10px 0 2px;padding:12px 14px;border-radius:14px;border:1px dashed color-mix(in srgb,#15D8C4 55%,transparent);
  background:color-mix(in srgb,#15D8C4 6%,transparent)}
.ldprev[hidden]{display:none}
.ldprev .lpw{display:flex;align-items:center;gap:8px;font:800 1rem/1.25 var(--face)}
.ldprev .lpw i{font-style:normal;display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#12A594;color:#fff;font-size:.75rem;flex:0 0 22px}

/* #247: toolbox first (full width), Min side / form below — not side-by-side with form as hero */

  html[data-page="leaders"] #s-leaders{display:grid;grid-template-columns:1fr;column-gap:0;align-items:start;max-width:720px}
  html[data-page="leaders"] #s-leaders > :not(.tool):not(.ldkit){grid-column:1}
  html[data-page="leaders"] #s-leaders > .ldkit{grid-column:1;position:static;margin-top:0}
  html[data-page="leaders"] #s-leaders > .tool{grid-column:1}
  html[data-page="leaders"] #s-leaders .ldkit .kg{display:flex;flex-direction:column}
}
.ldstatus{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:16px;margin:4px 0 14px;
  background:color-mix(in srgb,#16C784 10%,transparent)}
.ldstatus .ldv{flex:0 0 40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#16C784;color:#06120C;font:900 1.2rem/1 var(--display)}
.ldstatus b{display:block;font:800 1.1rem/1.3 var(--display);color:var(--chalk)}
.ldstatus p{margin:4px 0 0;font-size:.92rem;color:var(--chalk-dim)}
.ldagain{margin:14px 0 0;padding:8px 0;border:0;background:none;color:var(--chalk-dim);font:600 .86rem/1.3 var(--face);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.tool:not(.ldsendt) .ldagain{display:none}
/* Delseksjonstitler (h3 rett under en seksjon, f.eks. «Aimpire Academy») i samme skrift som overskriftene. */
.sec > h3{font-family:"Archivo",var(--display);font-stretch:90%;font-weight:800;font-size:1.32rem;line-height:1.28;letter-spacing:-.01em;word-spacing:.08em}
html:is([data-font="deva"],[data-font="nastaliq"],[data-font="naskh"]) .sec > h3{font-family:var(--face);font-stretch:normal;letter-spacing:0;line-height:1.5}
/* Merknad/advarsel: ikke farget sidekant (malspor), men et lite tegn foran - ⓘ for merknad, ! for advarsel. */
.vnote,.warn{position:relative;border-inline-start:0 !important;padding-inline-start:44px !important}
.vnote::before,.warn::before{position:absolute;inset-inline-start:14px;top:13px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;
  font:800 .74rem/1 var(--display)}
.vnote::before{content:"i";background:color-mix(in srgb,var(--chalk) 14%,transparent);color:var(--chalk);font-style:italic;font-family:Georgia,serif}
.warn::before{content:"!";background:var(--ember,#E8590C);color:#fff}
.goals .gt{font-family:"Archivo",var(--display);font-stretch:90%;font-weight:800;font-size:1.35rem;letter-spacing:-.01em;word-spacing:.08em}
html:is([data-font="deva"],[data-font="nastaliq"],[data-font="naskh"]) .goals .gt{font-family:var(--face);font-stretch:normal;letter-spacing:0}
html[data-font="nastaliq"] .goals .gl{line-height:1.85;font-size:.8rem}
html[data-font="naskh"] .goals .gl{line-height:1.6}
html[data-font="nastaliq"] .goals .goal{min-height:0}


/* #236 Sveipepil (moenster fra Androids tilbake-gest): kommer inn fra kanten og foelger fingeren, fylles ved grensen. */
.svpil{position:fixed;top:50%;z-index:58;display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:999px;pointer-events:none;
  background:var(--ink-raise,var(--ink));color:var(--chalk);border:1px solid var(--rule);box-shadow:0 8px 24px -8px rgba(0,0,0,.45);
  opacity:calc(.35 + var(--f,0) * .65);transition:background .15s,color .15s,border-color .15s}
.svpil[hidden]{display:none}
.svpil[data-side="h"]{right:0;transform:translate(calc(100% - var(--f,0) * (100% + 12px)),-50%)}
.svpil[data-side="v"]{left:0;transform:translate(calc(-100% + var(--f,0) * (100% + 12px)),-50%);flex-direction:row-reverse}
.svpil .svr{width:10px;height:10px;border-top:2.5px solid currentColor;border-right:2.5px solid currentColor;transform:rotate(45deg)}
.svpil[data-side="v"] .svr{transform:rotate(-135deg)}
.svpil .svn{font:800 .9rem/1 var(--face);white-space:nowrap}
.svpil.tilb .svn{display:none}
.svpil.klar{background:var(--grad);color:#08080B;border-color:transparent}
@media (prefers-reduced-motion:reduce){.svpil{transition:none}}
/* ===== #232 PC og Mac (founder 19.10 23:59 «gjør den også pc og Mac vennlig … best for forbrukeren»).
   Maalt 1440x900: 736 px mobilkolonne midt paa skjermen, flytende mobilmeny nederst over innholdet.
   Fra 1024 px blir SAMME meny en fast sidemeny til venstre (moenster folk kjenner fra nettbank/Discord/Notion):
   alltid synlig, dekker ingenting, og innholdet faar plass. Ingen ny logikk - knappene og rekkefoelgen er de samme,
   saa mobil og guiden (som peker paa menyen) er uendret. RTL: sidemenyen staar til hoeyre (logiske egenskaper). */
@media (min-width:1024px){
  body.has-tabbar{padding-bottom:0;padding-inline-start:236px}
  body.has-tabbar #pille{bottom:28px}
  .tabbar{inset-inline-start:0 !important;inset-inline-end:auto !important;top:0;bottom:0 !important;width:236px !important;max-width:none;
    margin:0 !important;border-radius:0;padding:22px 14px 18px;border-top:0;border-inline-end:1px solid var(--rule);
    display:flex;flex-direction:column;box-shadow:none !important}
  .tabbar .tbprog{display:none}
  .tbrow{display:flex !important;flex-direction:column;gap:3px;max-width:none;margin:0;flex:1;min-height:0}
  .tbrow .tbb{flex-direction:row;justify-content:flex-start;align-items:center;gap:13px;width:100%;min-height:46px;
    padding:10px 14px !important;border-radius:12px;text-align:start;transition:background .15s,color .15s}
  html .tabbar .tbrow .tbb span{font-size:.95rem;letter-spacing:0;font-weight:650}
  .tbb span{overflow:visible}
  .tbb svg{flex:0 0 22px;width:22px;height:22px}
  .tbb:not(.tbhome)::after{display:none}
  .tbb.tbhome{order:-1;margin-bottom:14px;padding-inline:10px !important}
  .tbb.tbhome span{font:800 1.05rem/1 var(--display) !important;letter-spacing:.06em !important}
  .tbring{margin-top:0;width:40px;height:40px;flex:0 0 40px}
  #tb-more{margin-top:auto}
  .tbb .dot{top:12px;inset-inline-start:30px}
  /* Paa mobil er menyen bevisst i MOTSATT farge (#146) for aa skille seg fra innholdet. En sidemeny skal derimot
     hvile i samme flate som siden - ellers blir den en lysende vegg ved siden av moerkt innhold.
     !important beats the mobile dark light-pill reassert after AIM-115 solid. */
  :root[data-theme="dark"] .tabbar.tabbar,:root:not([data-theme="dark"]) .tabbar.tabbar{background:var(--ink-deep) !important;border-inline-end:1px solid var(--rule)}
  :root[data-theme="dark"] .tbrow .tbb.tbb,:root:not([data-theme="dark"]) .tbrow .tbb.tbb{color:var(--chalk-dim)}
  :root[data-theme="dark"] .tbrow .tbb.tbb[aria-current="page"],:root:not([data-theme="dark"]) .tbrow .tbb.tbb[aria-current="page"]{color:var(--chalk)}
  /* AIM-212: desktop active wash = teal brand (same as mobile --nav-wash), not purple-blue. */
  :root[data-theme="dark"] .tbrow .tbb[aria-current="page"]:not(.tbhome){background:var(--nav-wash)}
  :root:not([data-theme="dark"]) .tbrow .tbb[aria-current="page"]:not(.tbhome){background:var(--nav-wash-light)}
  :root[data-theme="dark"] .tbb .dot,:root:not([data-theme="dark"]) .tbb .dot{box-shadow:0 0 0 2px var(--ink-deep)}
  /* Mer-arket aapnes ved siden av knappen, ikke midt nederst */
  .mspanel{inset-inline-start:248px;inset-inline-end:auto;bottom:18px;width:400px;max-width:calc(100vw - 280px);margin:0}
  .msbg{background:rgba(6,10,24,.25)}
  /* Innholdet: bredere kolonne, men brødtekst holder lesbar linjelengde (--measure) */
  .shell{max-width:62rem}
  .goals .ggrid{grid-template-columns:repeat(6,1fr)}
  .mlist.mgrid{grid-template-columns:repeat(3,1fr)}
  .vhead{margin-top:6px}
}
.sbtn .sbl{display:none}
.sbtn .kbd{display:none}
@media (min-width:1024px){
  .sbtn{width:auto !important;min-width:260px;justify-content:flex-start;gap:10px;padding:0 10px 0 14px !important;border-radius:999px !important}
  .sbtn .sbl{display:inline;flex:1;text-align:start;font:600 .88rem/1 var(--face);color:var(--chalk-dim);white-space:nowrap}
  .sbtn svg{flex:0 0 18px;width:18px;height:18px}
}
@media (min-width:1024px) and (hover:hover) and (pointer:fine){
  .sbtn .kbd{display:inline-block}
  .tbrow .tbb.tbb:not([aria-current="page"]):hover{background:color-mix(in srgb,var(--chalk) 6%,transparent);color:var(--chalk)}
  .tbb.tbhome:hover .tbring{box-shadow:0 0 0 2px color-mix(in srgb,var(--teal-live) 60%,transparent)}
}
/* Mus og styreflate (alle bredder): tydelig hover og fokus. Paa touch skjer ingenting (hover:hover). */
@media (hover:hover) and (pointer:fine){
  .mlist.mgrid > li > a,.mlist.mgrid > li > button,.goals .ggrid > *,.places > li > a,.mkrow,.mkk,.okchip,.oekt{transition:transform .15s ease,border-color .15s ease,background .15s ease}
  .mlist.mgrid > li > a:hover,.mlist.mgrid > li > button:hover,.goals .ggrid > *:hover{transform:translateY(-2px)}
  .mkrow:hover,.places > li > a:hover{background:color-mix(in srgb,var(--chalk) 5%,transparent)}
  .oekt:hover{border-color:color-mix(in srgb,var(--chalk) 22%,transparent)}
}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
.kbd{display:inline-block;min-width:1.5em;padding:1px 6px;border:1px solid var(--rule);border-bottom-width:2px;border-radius:6px;font:700 .72rem/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--chalk-dim);text-align:center}
@media not all and (hover:hover) and (pointer:fine){.kbd{display:none}}

/* =============================================================================
   #323 hub craft follow-up — MERGE AFTER #271 (+ after #308 if both land)
   Founder gate: #271 Trust foyer + #308 leder-toolbox still draft / founder preview.
   CSS-only within B-049. Do NOT dual-edit foyer HTML (#271) or toolbox markup (#308).
   Ban-list fail: glass · purple wash · pill clusters · card grids · radial glow blobs ·
   Inter/system hero · multi soft-shadow «premium» · dashboard-in-hero.

/* AIM-115 atmosphere — Nesté marine vignette both themes (all folders inherit).
   Steal grammar from craft-pivot/#379; do NOT merge #379; do NOT change IA (AIM-112). */
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background:
  radial-gradient(90% 55% at 50% -8%,rgba(21,120,180,.16),transparent 58%),
  radial-gradient(70% 40% at 100% 0%,rgba(21,216,196,.06),transparent 55%),
  radial-gradient(120% 80% at 50% 110%,rgba(0,0,0,.48),transparent 55%),
  linear-gradient(180deg,#0A1424 0%,#070B14 42%,#05080F 100%)}
body::after{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;opacity:.028;background:
  repeating-linear-gradient(-12deg,transparent 0 2px,rgba(255,255,255,.5) 2px 3px);mix-blend-mode:overlay}
:root:not([data-theme="dark"]) body::before{background:
  radial-gradient(90% 50% at 50% -10%,rgba(27,79,216,.06),transparent 55%),
  radial-gradient(65% 38% at 100% 8%,rgba(14,143,134,.05),transparent 52%),
  radial-gradient(100% 70% at 50% 100%,rgba(11,35,65,.07),transparent 52%),
  linear-gradient(180deg,#C5D2E2 0%,#D0DAE6 42%,#C2CFDF 100%)}
:root:not([data-theme="dark"]) body::after{opacity:.018;mix-blend-mode:multiply}
body{background:transparent}

   Own surfaces + tokens only; Nastaliq/naskh font craft stays AIM-239. */
:root:not([data-theme="dark"]) .switch .langbtn,
:root:not([data-theme="dark"]) .switch button,
:root:not([data-theme="dark"]) .switch .thm,
:root:not([data-theme="dark"]) .jump button,

  border-color:color-mix(in srgb,var(--rule) 72%,var(--chalk) 18%);
  box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 4px 10px -8px rgba(31,42,60,.22)}
:root:not([data-theme="dark"]) .switch button[aria-pressed="true"],
:root:not([data-theme="dark"]) .jump button[aria-selected="true"],
:root:not([data-theme="dark"]) .cper button[aria-pressed="true"],

.tabbar{inset-inline:0;width:100%;max-width:none;padding-inline:4px;border-radius:0}

  /* Tablet: still full-bleed sealed bar (no floating 720 pill — AIM-235). */
  .tabbar .tbrow .tbb span{font-size:max(var(--tbfs),.78rem)}
}
/* AIM-235: opaque seal to screen bottom on every phone + tablet width.
   Covers iOS home indicator + Android nav/gesture bar via safe-area
   (viewport-fit=cover). constant() = iOS 11.0–11.2. Desktop ≥1024 sidemenu
   keeps its own rules. 320×568 → large modern phones all use the same pin. */
@media (max-width:1023px){
  .tabbar{
    position:fixed;
    inset-inline:0 !important;
    bottom:0 !important;
    left:0; right:0;
    width:100% !important;
    max-width:none !important;
    margin:0 !important;
    border-radius:0 !important;
    /* Paint iOS home indicator + Android nav/gesture inset with opaque fill.
       constant() first (iOS 11.0–11.2), then env() (modern). */
    padding:0 4px 0 !important;
    padding-bottom:constant(safe-area-inset-bottom) !important;
    padding-bottom:env(safe-area-inset-bottom,0px) !important;
    -webkit-backdrop-filter:none !important;
    backdrop-filter:none !important;
    overflow:visible;
  }
  @media (max-width:340px){
    .tabbar{
      padding-inline:2px !important;
      padding-bottom:constant(safe-area-inset-bottom) !important;
      padding-bottom:env(safe-area-inset-bottom,0px) !important;
    }
  }
  /* Scrub layer: opaque plate behind icons, extends through padding/safe-area. */
  .tabbar::before{
    content:"";
    position:absolute;
    inset:0;
    z-index:-1;
    pointer-events:none;
    border-radius:inherit;
    background:inherit;
  }
  :root[data-theme="dark"] .tabbar{
    background:#F3F5FA !important;
    border-top:0;
    box-shadow:0 -8px 28px rgba(0,0,0,.4);
  }
  :root:not([data-theme="dark"]) .tabbar{
    background:var(--ink-deep) !important;
    border-top:0;
    box-shadow:0 -6px 22px rgba(26,34,48,.2);
  }
  .mspanel{
    bottom:calc(var(--tab-min-h) + env(safe-area-inset-bottom,0px) + 10px);
    max-height:min(72dvh, calc(100dvh - var(--tab-clear) - 16px));
  }
  .hspanel{
    bottom:calc(var(--tab-min-h) + env(safe-area-inset-bottom,0px) + 12px);
  }
}
/* Desktop/Mac (≥1024): side menu already bottom:0; keep opaque, no content under rail. */
@media (min-width:1024px){
  .tabbar{
    -webkit-backdrop-filter:none !important;
    backdrop-filter:none !important;
  }
}

/* =============================================================================
   #323 craft elevate v2 — CSS-only after #271/#308 (no foyer/toolbox HTML dual-edit)
   Kill remaining Claude-tells: 2-col emoji feature cards, violet preview ink,
   card-lift hover, WOTD/goals as equal SaaS tiles.
   ============================================================================= */

/* .mfeat → single-column hairline corridor (not 2-col emoji feature grid). */
.mfeat{
  display:flex !important;flex-direction:column;gap:0 !important;
  border:0;border-block:1px solid var(--rule);border-radius:0 !important;
  background:transparent !important;padding:0;margin:10px 0 14px}
.mfeat .plate,
.mfeat .plate.feat{
  display:grid !important;
  grid-template-columns:1fr auto !important;
  grid-template-areas:"bd go" !important;
  align-items:center;gap:8px 12px;
  min-height:0 !important;
  padding:14px 2px !important;
  border:0 !important;border-bottom:1px solid var(--rule) !important;
  border-radius:0 !important;background:transparent !important;
  box-shadow:none !important;overflow:visible}
.mfeat .plate:last-child{border-bottom:0 !important}
.mfeat .plate > .stripe,
.mfeat .plate > .mic{display:none !important}   /* emoji plate = Claude-tell */
.mfeat .plate > .bd{grid-area:bd;padding:0 !important}
.mfeat .plate > .go{grid-area:go;position:static !important;inset:auto !important}
.mfeat .plate .t{font-size:1.05rem !important;margin:0 0 2px}
.mfeat .plate .d{font-size:.86rem;line-height:1.4}
.mneste{margin-bottom:10px !important;border-color:color-mix(in srgb,#15D8C4 35%,var(--rule))}
.mneste .plate{border-color:transparent !important}

/* Shortcut grid → one-column hairline (fail equal card tiles). */
.mlist.mgrid{
  display:flex !important;flex-direction:column;gap:0 !important;
  border-block:1px solid var(--rule);padding:0;margin:8px 0 12px}
.mlist.mgrid .plate{
  display:grid !important;grid-template-columns:1fr auto !important;
  grid-template-rows:auto !important;gap:6px 10px;
  padding:12px 2px !important;border:0 !important;border-bottom:1px solid var(--rule) !important;
  border-radius:0 !important;background:transparent !important;box-shadow:none !important}
.mlist.mgrid .plate:last-child{border-bottom:0 !important}
.mlist.mgrid .plate > .mic{display:none !important}
.mlist.mgrid .plate > .bd{padding:0 !important}
.mlist.mgrid .plate:last-child:nth-child(odd){grid-column:auto}
@media (min-width:1024px){
  .mlist.mgrid{grid-template-columns:none}
  .goals .ggrid{grid-template-columns:1fr !important}
}

/* Goals: verb list, not 3/6 emoji tile strip. */
.goals .ggrid{
  display:flex !important;flex-direction:column;gap:0 !important;
  border-block:1px solid var(--rule);margin-top:6px}
.goals .ggrid > *{
  display:flex;align-items:center;gap:10px;
  min-height:44px;padding:10px 2px;
  border:0 !important;border-bottom:1px solid var(--rule) !important;
  border-radius:0 !important;background:transparent !important;box-shadow:none !important}
.goals .ggrid > *:last-child{border-bottom:0 !important}
.goals .gi{font-size:1rem;opacity:.85}

/* Word of the day: hairline panel, not rounded promo card. */
.wotd{
  border:0 !important;border-block:1px solid var(--rule) !important;
  border-radius:0 !important;background:transparent !important;
  padding:12px 2px !important;margin:8px 0 12px !important}
.wotd .we{display:none}   /* book emoji tell */

/* Remaining violet preview ink (#FBFAFD) → neutral studio paper. */
#port .pth.light{background:#F7F8FA !important;color:#12141A}
#tema .pv.l{background:#F7F8FA !important}
#tema .pv.l i{background:#12141A}

/* No card-lift hover (premium SaaS tell). */
@media (hover:hover) and (pointer:fine){
  .mlist.mgrid > li > a:hover,
  .mlist.mgrid > li > button:hover,
  .mlist.mgrid .plate:hover,
  .goals .ggrid > *:hover,
  .mfeat .plate:hover{transform:none !important}
}

/* Hero sub: calm measure — trust line, not marketing paragraph. */
.hero p#hsub{
  max-width:34rem;font-size:.98rem;line-height:1.45;
  color:var(--chalk-dim);letter-spacing:.005em}
html[data-font="nastaliq"] .hero p#hsub{font-size:1.02rem;line-height:1.7}

/* Intentional motion (2–3): presence, not noise. Respect reduced-motion. */
@keyframes hairlineIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.mfeat .plate,.mneste .plate{
  animation:hairlineIn .48s cubic-bezier(.2,.7,.3,1) both}
.mfeat .plate:nth-child(2){animation-delay:.07s}
.hero p#hsub{animation:hairlineIn .55s .1s cubic-bezier(.2,.7,.3,1) both}
.mast .wordmark{animation:hairlineIn .5s cubic-bezier(.2,.7,.3,1) both}
@media (prefers-reduced-motion:reduce){
  .mfeat .plate,.mneste .plate,.hero p#hsub,.mast .wordmark{animation:none !important}
}

/* =============================================================================
   Design architecture cascade — tokens → type → folder chrome → CTA roles → nav.
   Harden pass: one authority, no purple-glass AI atmosphere. Never #379.
   Home/Shuru/risk copy → AIM-193/194. This block is shared infrastructure only.

/* Intentional motion (2–3): mark presence, tick draw, portal rise. */
@keyframes apBreathe{
  0%,100%{transform:scale(1);opacity:.55}
  50%{transform:scale(1.04);opacity:.72}}
@keyframes brandTick{
  from{width:0;opacity:0}
  to{width:2.75rem;opacity:1}}
@keyframes portalRise{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:none}}
@media (prefers-reduced-motion:no-preference){
  .shell[data-view="menu"] .apstage::before{animation:apBreathe 5.5s ease-in-out infinite}
  .shell[data-view="menu"] .hero h1::after{animation:brandTick .7s .15s cubic-bezier(.2,.7,.3,1) both}
  .shell[data-view="menu"] .htree .hta{
    animation:portalRise .5s cubic-bezier(.2,.7,.3,1) both}
  .shell[data-view="menu"] .htree .hta:nth-of-type(2){animation-delay:.05s}
  .shell[data-view="menu"] .htree .hta:nth-of-type(3){animation-delay:.09s}
  .shell[data-view="menu"] .htree .hta:nth-of-type(4){animation-delay:.13s}
  .shell[data-view="menu"] .htree .hta:nth-of-type(5){animation-delay:.17s}
  .shell[data-view="menu"] .htree .hta:nth-of-type(6){animation-delay:.21s}
  .shell[data-view="menu"] .htree .hta:nth-of-type(7){animation-delay:.25s}
  .shell[data-view="menu"] #notice-none .slab.reg{
    animation:portalRise .48s .08s cubic-bezier(.2,.7,.3,1) both}
}
@media (prefers-reduced-motion:reduce){
  .shell[data-view="menu"] .apstage::before,
  .shell[data-view="menu"] .hero h1::after,
  .shell[data-view="menu"] .htree .hta,
  .shell[data-view="menu"] #notice-none .slab.reg{animation:none !important}
  .shell[data-view="menu"] .hero h1::after{width:2.75rem}
}

/* Intentional motion — brand tick + corridor rise. */

/* Portals (#home-tree) are Home-only. Measured on Start @320: tree stayed

.shell:not([data-view="menu"]) #home-tree,
.shell:not([data-view="menu"]) .htree{display:none !important}

   PR2 (AIM-290b) extends chips to Invite/ibq/earn + Academy lessons.

/* Shared chip geometry for disclosure glyphs (::after). */

  width:28px !important;
  height:28px !important;
  min-width:28px !important;
  flex:0 0 28px !important;
  margin:0 0 0 auto !important;
  margin-inline-start:auto !important;
  margin-inline-end:0 !important;
  padding:0 !important;
  border:2px solid color-mix(in srgb,var(--teal-live,#15D8C4) 55%,var(--rule)) !important;
  border-radius:8px !important;
  background:color-mix(in srgb,var(--teal-live,#15D8C4) 11%,transparent) !important;
