l","mail_hint":"We email you when your link goes live. Nothing else.","spons_ph":"Who invited you? (first name)","spons_hint":"Write who invited you to Aimpire — your sponsor's first name."}},"risk":{"en":"Trading involves risk and you can lose the money you put in. Nothing here is financial advice, and no income is promised. Use only money you can afford to lose, and check the rules that apply where you live."},"legal":{"en":"Aimpire is a learning community. We are not a broker, we do not take deposits, we do not manage anyone's money, and we do not give financial advice.\n\nThe rules for trading with a broker in another country are not the same everywhere, and in some countries they are restricted. Find out what applies where you live before you put money in — that decision, and what follows from it, is yours. Leaders here share what they have learned; they do not advise, and they do not handle anyone's money. Everything shared in the community — charts, examples, signals — is for learning, so you can judge for yourself; it is never a recommendation to buy or sell."},"links":{"main":[{"url":"__REF__","primary":true,"en":["Open your account","Through your sponsor's link"]},{"url":"https://instagram.com/aim.pire","en":["Instagram","@aim.pire — what we are up to"],"icon":"assets/logo-ig.png"}],"platform":[{"url":"https://aitech.ibportal.io/profile","en":["IB Portal","Your team, your commissions, your real numbers"],"icon":"assets/logo-aitech.png"},{"url":"https://www.copyxapp.com","en":["CopyX","The copy-trading platform"]},{"url":"https://portal.tagmarkets.com/login?brd=1&wp=4","en":["Broker portal","Deposits, withdrawals, KYC"],"icon":"assets/logo-tag.png"}],"video":[{"url":"","en":["Signing up","Three minutes, start to finish"]},{"url":"","en":["Finishing KYC","Which documents, and why they ask"]},{"url":"","en":["Making a deposit","Getting money onto the account"]},{"url":"","en":["Connecting CopyX","Linking your broker account"]},{"url":"","en":["Taking money out","Do this early, with a small amount"]}],"docs":[{"url":"https://intercom.help/tag-markets/en/articles/10088332-how-to-change-your-account-password","en":["Changing your password","The broker's own guide, with pictures"]},{"url":"","en":["Start here guide","PDF, English"]},{"url":"","en":["Start here guide","PDF, Urdu"]},{"url":"#learn","en":["Pips and lot size","How much one move actually costs you"]},{"url":"#learn","en":["Trading psychology","The part nobody wants to read"]}],"help":[{"url":"","en":["Ask your sponsor","The person who invited you"]},{"url":"#faq","en":["Common questions","Answered once, properly"]}],"tools":[{"url":"https://www.myfxbook.com/members/SonicExperts/sonic-ai/12076857","en":["Myfxbook results","Month by month, with the drawdown next to it"],"icon":"assets/logo-mfx.png"},{"url":"https://www.myfxbook.com/forex-calculators/position-size","en":["Position size calculator","How many lots fit your stop and the risk you chose"],"icon":"assets/logo-mfx.png"},{"url":"https://www.myfxbook.com/forex-calculators/pip-calculator","en":["Pip calculator","What one pip is worth in dollars at your lot size"],"icon":"assets/logo-mfx.png"},{"url":"https://www.forexfactory.com/calendar","en":["Economic calendar","When the market is about to move, and why"],"icon":"assets/logo-ff.png"},{"url":"https://matrix.to/#/%23aimpire:matrix.org","en":["Aimpire group","Questions and news — opens in Element X"],"icon":"assets/app-element.jpg"},{"url":"https://instagram.com/aim.pire","en":["Instagram","@aim.pire — what we are up to"],"icon":"assets/logo-ig.png"}]},"guide":{"en":{"lede":"Steps 1–4 take about fifteen minutes. Have your ID card or passport ready.\nThen you wait for approval. The rest you do when it suits you — the page remembers where you stopped.","steps":[["Use your sponsor's link","Open the link your sponsor sent you — their own link, not one from a group.\nAt the top of this page you should see a line naming them, ending in a six-character code.\nNo such line? Ask your sponsor to send you their link before you go on.",{"check":"A name, or a domain and six characters, shows at the top. No line means no sponsor is attached."}],["Create your account","Scroll up and tap the big button to open your account. CopyX opens in a new tab.\nUse your real name — it must match your ID. Pick a password you use nowhere else.\nChange the country from Albania to where you live; the phone code follows it.\nTick both boxes, wait for «Verifying…» to finish, then press Sign Up.",{"img":"assets/shot-register.jpg","alt":"The CopyX sign-up form","marks":[{"n":1,"x":24,"y":32,"t":"Your real name. It must match the ID you upload later, or verification fails."},{"n":2,"x":24,"y":45,"t":"A password you use nowhere else. Not your email password."},{"n":3,"x":9,"y":66,"t":"Tick both. Read them first — they say you can lose money."},{"n":4,"x":50,"y":87,"t":"If you see this yellow box, your link was missing the invite code. Go back and open your sponsor's link instead."},{"n":5,"x":24,"y":56,"t":"This starts on Albania for everyone. Change it — the phone code follows it."}],"check":"You land inside the portal and see your own name."}],["Link your broker account — this step matters","Inside the portal, use the Login to CopyX button to create your Tag Markets account.\nDo not create it anywhere else — an account made elsewhere is not linked, and nothing tracks correctly.",{"video":{"url":"https://drive.google.com/file/d/1KrEU9XkoVflSNhCXUtmHzx-wY0q_RBB1/view","label":"Watch this step"},"note":"The portal says it too: use only that button.","img":"assets/shot-copyx-register.jpg","alt":"The CopyX Registration panel in the IB Portal","marks":[{"n":1,"x":34,"y":37,"t":"Read this line. It tells you to create the broker account from here, not anywhere else."},{"n":2,"x":13,"y":71,"t":"This is the button. It says Login to CopyX — use it even the first time."},{"n":3,"x":50,"y":90,"t":"The warning in yellow: a Tag Markets account made directly on CopyX will not be linked."}],"check":"The Tag Markets account shows inside the portal. If you had to log in somewhere else to find it, it is not linked."}],["Verify your identity","You need your ID card or passport, plus a face scan.\nPhotograph the document in good light with all four corners visible — a blurry photo is the usual reason for rejection.",{"img":"assets/shot-kyc.jpg","alt":"The Upload Documents panel","marks":[{"n":1,"x":50,"y":44,"t":"Pick the document type here first. Nothing uploads until you do."},{"n":2,"x":50,"y":75,"t":"This yellow line is normal before you upload. It is not an error."},{"n":3,"x":90,"y":5,"t":"Validate means the broker has not checked your documents yet."}],"check":"The yellow «upload» line is gone and your document shows as submitted. «Validate» only means the broker has not looked yet."}],["Wait for approval","Approval usually takes a short while.\nUntil then you cannot deposit — the notice on the wallet page is normal, not an error.",{"img":"assets/shot-wallet-kyc.jpg","alt":"The wallet page showing that KYC must be completed first","marks":[{"n":1,"x":50,"y":30,"t":"This pink line means verification is still pending. It disappears once your documents are approved."}],"check":"The pink line on the wallet page is gone and Deposit can be pressed."}],["While you wait: install the two apps","Use the wait to install two apps, from the official stores only — the buttons below go straight there.\nMetaTrader 5, to see your account (step 9).\nElement X, for the Aimpire group (step 10).\nTag Markets, CopyX and the IB Portal run in your browser. Never install a «Tag Markets app» someone sends you.",{"appcards":true,"check":"Both apps open on your phone. You do not need to log in yet."}],["Put money in","In the portal press Deposit, choose the amount (minimum $10) and the crypto you hold.\nYou get an address, a QR code, a network and a countdown of about fifteen minutes.\nSend from your own wallet — Binance, RedotPay or similar. It may ask for Face ID or a code; that is your wallet's own check.\nCountdown ran out? Get a new address; never reuse the old one.",{"note":"Send on exactly the network the payment page names. Your wallet itself warns that a mismatch can mean «permanent loss of funds».\nAccepted: Ethereum (ERC20), Polygon, Tron (TRC20), BNB (BEP20), Bitcoin, Polkadot and Solana. Not Arbitrum.\nFees differ: 25 USDC over Ethereum cost 1.00 USDC, four percent.","check":"The amount shows on the portal's wallet page. Your wallet may show «Pending» for a while — up to 24 hours by its own estimate. Still missing after that? Check the transaction in your own wallet first.","clip":{"src":"assets/video/steg6-innskudd.mp4","poster":"assets/video/steg6-innskudd.jpg","secs":71},"p2p":true}],["Connect to Sonic copy trading","This step starts the copying — until then, nothing trades.\nIn Tag Markets open CopyX, find SONIC and press Details. The card shows the terms: 30 % performance fee, one month minimum, no management fee and no joining fee.\nPress Connect, enter your amount (minimum $10) and choose Amplify.\nUnder Community Token type #Aitech, press Verify, enter 000000 in Hash and press Submit.\nTick both boxes and press Copy Now.",{"note":"With the token the account trades at 24× — our $109 became $2,616 — and it closes at a 5 % loss instead of 10 %. Put in only what you could lose completely.","codes":[{"label":"Community token","value":"#Aitech"},{"label":"Hash","value":"000000"}],"check":"«CopyX Account Created» appears — press Continue, and SONIC shows on your dashboard. Amount $0? Submit did not go through.","clip":{"src":"assets/video/steg7-sonic.mp4","poster":"assets/video/steg7-sonic.jpg","secs":65},"quiz":{"q":"Your deposit trades at 24×. The trading balance falls 4.2 %. How much of your deposit is left?","a":["Almost all of it","None of it"],"right":1,"why":"None of it. At 24×, a 4.2 % fall in the balance is your whole deposit — our $109 traded as $2,616. The account closes by itself at 5 %. The amount you put in is the part you control."}}],["See your account in MetaTrader 5","In the portal open MT5 Credentials: account number, Master Password, Investor Password.\nIn MetaTrader 5 add an existing account, search T.M. Financials Ltd and choose TMFinancials-Server.\nYour login is the account number. Then you see Balance, Equity and Free Margin.",{"note":"The Master Password can trade; the Investor Password can only look. Never give anyone your Master Password. If someone should check your results, give them the Investor Password.","apps":{"lede":"Install MetaTrader 5 for your phone:","items":[{"os":"Android","url":"https://play.google.com/store/apps/details?id=net.metaquotes.metatrader5"},{"os":"iPhone","url":"https://apps.apple.com/app/metatrader-5/id413251709"}]},"check":"Balance matches the portal and is 24 times your deposit — our $109 showed as $2,616. Not 24 times? Stop and ask your sponsor.","clip":{"src":"assets/video/steg8-mt5.mp4","poster":"assets/video/steg8-mt5.jpg","secs":51}}],["Join the group","Questions get answered in the group — nobody there started out knowing anything.\nAdding more money later? Add a little at a time.",{"apps":{"lede":"Install Element X — that exact app, not Element Classic and not another chat app. Make an account, any username. Then come back here and tap Join the Aimpire group.","items":[{"os":"Android","url":"https://play.google.com/store/apps/details?id=io.element.android.x"},{"os":"iPhone","url":"https://apps.apple.com/app/element-x/id1631335820"}]},"join":{"url":"https://matrix.to/#/%23aimpire:matrix.org","label":"Join the Aimpire group"},"check":"You can read the messages, not just see the group's name."}]],"quiz_t":"Quick check","quiz_again":"Have another look —","phases":[["Set up",0,3],["Waiting",4,5],["Running",6,9]]}},"langs":[{"code":"en","label":"English","dir":"ltr","font":"latin"},{"code":"no","label":"Norsk","dir":"ltr","font":"latin"},{"code":"hi","label":"हिन्दी","dir":"ltr","font":"deva"},{"code":"ar","label":"العربية","dir":"rtl","font":"naskh"},{"code":"ur","label":"اردو","dir":"rtl","font":"nastaliq"},{"code":"ar_rm","label":"Roman Arabic","dir":"ltr","font":"latin","bcp":"ar-Latn","roman_of":"ar"},{"code":"ur_rm","label":"Roman Urdu","dir":"ltr","font":"latin","bcp":"ur-Latn","roman_of":"ur"}],"earn_shot":{"img":"assets/shot-commission.jpg","alt":{"en":"The commissions overview in the IB Portal"},"marks":{"en":[{"n":1,"x":22,"y":55,"t":"This is where your real numbers live. If a figure in a chat message does not match this screen, this screen is right."}]}},"places":{"title":{"en":"Three places, three names"},"lede":{"en":"You will end up with two logins. Knowing which is which saves most of the confusion."},"items":{"en":[["CopyX","The platform that copies the traders. You create this first, in step 2."],["IB Portal","Where your team and your numbers live. Same login as CopyX."],["Tag Markets","The broker — the company that actually holds your money. You create this from inside the portal, in step 3."]]}},"guide_ui":{"en":{"copy":"Copy","copied":"Copied","progress":"{done} of {total} steps done","reset":"Clear","check":"You know it worked when","mark":"Mark this step done","marked":"Done — tap to undo","left":"{n} left","next":"Next: {t}","all_done":"All {total} steps done. You are set up.","all_done_go":"Next: how Sonic works","watch":"See it on screen — {s} seconds","stuck":"Stuck on this step? Ask in ❓ Questions — any language."},"_stuck_url":"https://matrix.to/#/%23aimpire-questions:matrix.org"},"learn":{"intro":{"en":"You do not need any of this to let Sonic run. It is here for when you want to understand what you are looking at. Tap any word to open it."},"labels":{"en":["Example","Why it matters","Formula"]},"terms":{"en":[["Pip","The unit a price moves in — the fourth decimal on most pairs.","On EUR/USD, 1.0850 → 1.0851 is one pip. At 0.01 lots that is $0.10.","Every target and result you hear is quoted in pips, and a number of pips means nothing until you know the lot size behind it.","pip value = lots × $10   (USD-quoted pair)","pip"],["Point","A tenth of a pip. Some platforms quote points instead.","«+500 points» on EUR/USD is 50 pips. At 0.01 lots that is $5, not $500.","This is the mix-up that makes a modest result look ten times bigger. Check the unit before you compare your numbers to anyone's.","pips = points ÷ 10",""],["Spread","The gap between the buy price and the sell price. You pay it the moment you enter.","Buy 1.08515, sell 1.08500 is 1.5 pips. At 0.01 lots, $0.15 per trade.","Every trade starts behind by the spread, win or lose. Ten trades a day on a small account is a real cost.","spread cost = spread in pips × pip value","spread"],["Lot size","How much you trade. This decides what one move is worth — and it is not the same number on every instrument.","EUR/USD: 1.00 lot ≈ $10 per pip, 0.01 ≈ $0.10. Gold (XAUUSD): 1.00 lot = 100 oz, so a $1 move is $100.","This is the one number that decides whether an ordinary move is an irritation or the end of the account — and the figure differs per instrument. Sonic's own record shows it trades gold, not a currency pair. Before you size anything, check the real value: in MT5, open the symbol's Specification (on a computer, right-click the symbol).","pip/point value = lots × contract size × tick     EURUSD → $10 · XAUUSD → $100","lot"],["Leverage and margin","Leverage is how big a position you may hold. Margin is the part of your money locked while it is open.","A 0.01 lot EUR/USD position is about $1,085 of currency. At 1:300 that ties up roughly $3.60 of yours.","Higher leverage does not reduce risk. It only frees margin so you are allowed to open more.","margin = lots × 100,000 × price ÷ leverage",""],["Balance and equity","Balance is money from trades already closed. Equity is that plus or minus everything still open.","Balance $100, one trade 40 pips against you at 0.01 lots (−$4) → equity $96.","Balance is history. Equity is where you actually stand. A floating loss is a real loss not yet written down.","equity = balance + open profit − open loss",""],["Margin call and stop out","When equity falls far enough against the margin your trades need, the broker closes them for you.","$100 account carrying a $60 floating loss has $40 of equity left.","At a stop out you do not choose the exit. The loss is locked in at that moment, often at the worst point.","margin level = (equity ÷ used margin) × 100 %",""],["Stop-loss","A standing instruction to close at a price you picked in advance, so the loss stops growing.","Buy at 1.0850 with a stop at 1.0830 is 20 pips. At 0.01 lots, $2 at risk — decided before you entered.","Without one, the size of your loss is set by how long you can stand to look at it.","risk = stop in pips × pip value",""],["Limit and stop orders","A limit waits for a better price. A stop only triggers once price pushes through a level.","Price 1.0850. Buy Limit 1.0830 fills if price falls. Buy Stop 1.0870 fills if price rises.","Signals are posted in this shorthand: Buy Limit, Buy Stop, Sell Limit, Sell Stop. Pick the wrong one of the four and it either never triggers, or opens your trade at the wrong moment."],["Risk per trade","The money — not the pips — you accept losing on one trade.","$100 account, 0.01 lots, 20-pip stop = $2 at risk. That is 2 percent.","On a $100 account the smallest tradable size already risks several percent per trade. The «risk 1 percent» advice does not fit yet.","lots = risk in $ ÷ (stop in pips × $10)","size"],["Drawdown","How far equity has fallen from its highest point, in percent.","$100 down to $60 is 40 percent down. Getting back to $100 needs a 67 percent gain, not 40.","Losses and recoveries are not symmetrical. A run of small losses can leave you needing a return you have never produced.","gain needed = loss ÷ (1 − loss)   →   40 % lost needs 67 % back","dd"],["Compounding","Leaving gains in, so position size grows with the balance instead of staying fixed.","$100 at 5 percent a month, profit left in, is about $180 after a year rather than $160.","It is the honest argument for patience on a small account — and the engine of every unrealistic plan you will be shown.","final = start × (1 + rate)^periods",""]]}},"academy":{"title":{"en":"Aimpire Academy"},"lead":{"en":"Longer lessons, one honest topic at a time. Everything here is for learning — nothing is advice."},"lessons":[{"id":"size","title":{"en":"Pips and lot size"},"sub":{"en":"How much one move actually costs you"},"blocks":{"en":[["What a pip is worth","On EUR/USD a pip is the fourth decimal: 1.0850 → 1.0851. With 1.00 lot a pip is about $10; with 0.01 lot, about $0.10. Gold is quoted differently: with 1.00 lot, a $1 move in the gold price is about $100 — so think in dollars, not pips, for gold and oil."],["The formula","Two lines, and they decide the size — not your mood. Always round down to the smallest lot step, usually 0.01.","Risk in $ = account × risk % / 100\nLots = risk in $ / (stop distance in pips × pip value per lot)"],["A real sum with small money","Account $100, risk 2 % = $2. Stop 20 pips away on EUR/USD. That is 0.01 lots — the smallest size there is. This is why small accounts have no room for wider stops or bigger sizes: the sum sets the size, not courage.","$2 / (20 × $10) = 0.01 lots"],["The 0.01 floor","If the formula gives less than 0.01 — say account $50 and a 40 pip stop → 0.0025 lots — then even the smallest size risks more than you chose. The honest options: a closer stop with a reason, or letting that trade go. Forcing 0.01 anyway makes your risk % a wish, not a setting."],["Points are not pips","Some platforms count in points: 10 points = 1 pip. A «100 points» move is 10 pips. Mixing them up makes every sum wrong by a factor of ten — check which one your platform shows."],["Check your platform","Contract sizes differ between brokers, especially for oil and indices. In MT5: right-click the symbol → Specification. Two minutes that protect every sum you will ever make."]]}},{"id":"mind","title":{"en":"Trading psychology"},"sub":{"en":"The part nobody wants to read"},"blocks":{"en":[["Losing and recovering are not symmetric","Lose 10 % and you need 11 % to get back. Lose 50 % and you need 100 %. This is why the first job is never «win more» — it is «lose small». Every rule in this community about small risk comes from this one sum."],["How to recognise an income claim","Posts that show a bot, a balance and a dream have a pattern: a best month, but no test period, no largest loss, no result on data the system never saw. One question punctures most of them: «where is the test?» When one widely shared «AI bot» was rebuilt exactly as described and run on three years of real data, it lost 82 %."],["Ask for the test, not the screenshot","A screenshot shows a moment. A test has a period, a largest drawdown, and results on data the system never saw. Fewer than 20 trades is not a record, it is a tendency. These questions are not rude — anyone with something real answers them gladly."],["News windows","Around big scheduled news (rate decisions, jobs numbers) the price can jump and the spread widen. A calm habit: know this week's «High» events from the calendar, and expect the 15 minutes before and after to be wild. Not a rule we enforce — a habit that saves beginners from their worst prices."],["The tool is not the decision","Copy trading and AI tools can watch, read and suggest — but the account, the risk and the decision stay yours. Use the tool to understand more, never to look away. If you cannot explain why a position is open, that is the signal to learn — not to add money."],["When it hurts","After a loss the strongest urge is to win it back at once — same day, bigger size. That urge has emptied more accounts than any bad strategy. The habit that works: write the loss down, close the platform, and come back tomorrow with the same small risk as always."]]}}]},"amplify":{"items":{"en":[["What Sonic is, and the choice that is yours","Sonic is the strategy your account copies: its trades run in your account by themselves. It only runs amplified, on Amplify — there is no smaller version to start with. So the choice that protects you is the amount.\n\nPut in less if any of these is true: losing all of it would change your month; you have never watched a trade go against you; this is your first trading account.\n\nStart with an amount you could lose completely, and watch it for a few weeks. If you add money later, know that an upgrade restarts the 30-day clock on your deposit."],["Amplify: you trade a multiple of your deposit","Amplify is a funded account: you trade a multiple of what you put in, and it is real money. The broker's standard multiple is 12×; with the Aimpire token it is 24×.\n\nIn our own test, $109 became a trading balance of $2,616. The multiple works on losses exactly as it does on gains."],["When the account closes, in the platform's own words","«If the manager loses more than 10% of starting balance, your account will be liquidated.»\n\nWith the token, the form adds: «By using a token code, your Amplify account draw down limit will change to 5% of your starting balance.»\n\nIn money: your $109 trades as $2,616. A fall of 1 ÷ 24 = 4.2 % in that balance equals your whole $109 — before the 5 % line is even reached. The line is a hard trigger: the account closes by itself, with no waiting for prices to come back. That is why the amount matters most."],["The Aimpire token: #Aitech, then 000000","The community token field is where Aimpire's token goes. Type #Aitech, press Verify, then enter 000000 in the Hash field that appears. Without a valid token the account opens at 12× with the 10 % line, instead of 24× with the 5 % line. Check that the tick shows before you press Copy Now."],["What the platform says about who is responsible","Before you can submit, you tick a box that says trades on CopyX are provided by traders unaffiliated with Tag Markets, and that Tag Markets bears no responsibility or liability for the trades or their outcomes. Read it before you tick it. It means the broker holding your money is not answerable for what the strategy does with it."],["What you keep when it makes money","The presentation gives the split as 70 / 5 / 25, marked «per trade»: 70 % of the profit to you, 5 % to the developers who run the system, 25 % to what it calls «the team» — «How the bonus model is drawn» shows that part. On the Sonic card it shows as a 30 % performance fee, with no management fee and no joining fee.\n\nSo $100 of profit is about $70 to you — less if the fee is taken on each winning trade rather than on the net result. The card says «Schedule 1 Week» and does not say which. Ask your sponsor.\n\nPublished results, Myfxbook included, show the strategy's own account. The 30 % fee is charged to followers, so it is not taken out of those curves."],["The rules, from the broker's own help centre","You can withdraw profits at any time, any hour, any day; the broker says the payout then takes 1–3 working days.\n\nYour original deposit can only be taken out 30 days after your first trade — not 30 days after you paid in — and taking it out closes the account immediately. Upgrading the account starts that 30-day clock again.\n\nThere is no daily loss limit, only the 10 % line (5 % with the community token), and you may hold as many of these accounts as you want."],["Commission and leverage, measured on your own money","Commission on an amplified account is $10 per lot on forex and metals, charged when the trade closes. The broker's own articles disagree about indices and crypto.\n\nThe form shows leverage 1:30, but it applies to the multiplied balance. Measured against your own deposit, 24 × 30 = 720:1 — more than the 1:500 of a standard account, not less. At 12× it is 360:1."]]},"compare":{"cols":["12×","24×"],"en":{"title":"12× or 24× — the same $100","rows":[["Trades as","$1,200","$2,400"],["The account closes after a loss of","10 %","5 %"],["A fall that takes your whole $100","8.3 %","4.2 %"],["Leverage on forex and metals, measured on your own money","360:1","720:1"],["Token","None","#Aitech + 000000"]],"note":"Gains are 12 or 24 times larger too. The record's deepest dip, 0.86 %, would have been about 10 % or 21 % of your deposit."}}},"ib":{"en":{"lede":"This part is optional. You can open an account, let Sonic run, and never introduce a single person. Nothing on the platform requires it. It is here because people ask how it works, and because half-explained money is how communities go wrong.","blocks":[["What an IB actually is","The broker already charges a spread and a commission on every trade, whether you introduced anyone or not. An Introducing Broker gets a share of what the broker earns. That is the usual mechanism across the industry, and it is not a separate fee on the person you introduced. On Sonic there is one more thing to know: part of what the people above you earn comes from the member's own 30 % performance fee. The fee is the same either way, but it is the member who pays it."],["The lock nobody explains","The plan has ten generations. They start locked. Your IB Portal shows two lines that decide everything: «# of Directs with active Trading account» and «Generations unlocked». Generations open only when your directs — the people you introduced yourself — have active trading accounts. Until then, the level-based streams pay nothing on the locked levels. How they open, according to the Tag Markets presentation other teams use: you need at least $250 in trading yourself, which opens the first three levels. Levels four to ten open as up to ten people you introduced directly each have $250 in trading. The portal does not show the rate per level.","lock"],["What that looks like in real numbers","Figures from the founder's own portal on 13 October 2026: five people introduced, $43 deposited across all of them, nine income streams listed by name — and $0.00 earned. Not because anything was broken: mainly because 0 of 10 generations were unlocked. This is the single most useful thing to understand before you start. With $43 between five people, none of them came near the $250 the presentation names."],["Two programmes: international and Europe","AiTech's own presentation of 3 October 2026 shows two versions of the programme. The international one, for members outside Europe, pays on ten levels: 2.5 % of each trade's profit per level, and per lot $2.00, $1.50, $1.00, $1.00 and then $0.50 on levels five to ten — up to $8.50 per lot in all. The European one pays on one level only: 2.5 % that can rise to 22.5 % with volume, $2.00 per lot that can rise to $6.50, and a general bonus of $2.00 per lot plus a bonus payment. In the CopyX app that general bonus has steps at $10,000, $50,000, $200,000 and $500,000 of team volume.\n\nThe broker's own help centre documents a third table for its amplified accounts — $3.00, $1.20 and $0.60 on three levels. That table may belong to Tag Markets' own partner plan rather than AiTech's. The same help centre says a trade only counts for commission if it stays open for at least 3 minutes.","ladder"],["How the bonus model is drawn","The presentation draws it in five parts. First the split of every trade's profit: 70 % stays with the member, 5 % goes to the developers, and 25 % is shared ten levels down in the structure — the 2.5 % per level above. Then the per-lot commission, the leader pools with an ambassador rate of $2.00 per lot, «CPA» on the new money deposited in your network, and incentives.\n\nFor CPA and the pools the presentation and the portal show how much volume each step needs — see «The nine streams, by name». When each of the ten levels opens depends on your directs, as «The lock nobody explains» describes. Ask your sponsor to show you your own figures in the IB Portal before you count on any of it. The presentation marks the programme «subject to local restrictions» and «only available to professional Influencer»."],["A worked example with real sizes","Suppose twenty members each put in $100. At 24× each trades as $2,400. Copying the strategy's own volume — about 4.5 lots a month on about $130,000 — twenty such accounts trade about 1.7 lots a month between them. At $2.00 per lot on the first level, that is about $3.30 a month, and only once that level is open.\n\nThe volume comes from the strategy and from how much your members put in, not from anything you control. Run the number for your own team, not the one in someone's screenshot."],["The formula, so you can put your own numbers in","monthly rebate ≈ members × trades each × lots per trade × rate per lot. Every part after the ≈ sign is yours to check: the lot size depends on your leverage, and the rate depends on which programme your agreement is under. Put in your own numbers and the answer is yours, not someone else's claim."],["The nine streams, by name","So you recognise them in the portal rather than in a chat message: Lot Commissions, Profit Share, CPA Earnings, Leader Pool 1 and 2, Sonic Pool, Profit Pool, NeoFX Pool and Super Sonic Bonus. «CPA Earnings» is not paid per person. It is a monthly percentage of the new money your whole team deposits — from 1 % at $10,000 to 7.5 % at $100,000,000 — counted after a «50% rule», so no more than half may come from your strongest line, and paid as the difference to anyone below you who qualifies too. One overview slide in the presentation calls it a payment per qualified registration; the portal and the presentation's own table show it as a percentage of deposits. Leader Pool 1 starts at $500,000 of team volume, Leader Pool 2 at $1,000,000. Payouts are made in USDT."],["What is not promised","No income is guaranteed and it can be zero. Everything above depends on other people depositing and trading, which depends on them choosing to, which you do not control. Treat it as a share of activity that may happen, not as a plan."],["Your own link — before you register","Is this the right person? If you are the one inviting others, sign up from your own link instead — not from someone else's. Once your account is created, it cannot be moved.","ledere"]],"unverified":"These are the programme's published rates, not what you will be paid. What you actually earn shows in your own IB Portal — check it there before you repeat a number to anyone.","lock_cap":"Ten generations. Zero open until directs with active accounts unlock them.","ladder_cap":"AiTech, international: $2.00 · $1.50 · $1.00 · $1.00, then $0.50 on levels 5–10 — up to $8.50 per lot"}},"menu":{"en":{"lede":"Pick the part you need now — the rest stays here.","back":"All sections","items":[["earn","Sonic","What it is, its record, your amount and taking money out."],["start","Get set up","Ten steps from a link to an account that works."],["calc","Your amount","What the record would have meant for your money — after every cost."],["tools","Tools","Results, the news calendar, the chat — and the apps."],["learn","Learn the groundwork","Pips, lots and spreads — with the formulas."],["faq","Questions and answers","Short answers to what people usually ask."],["ib","IB and bonuses","Optional: what inviting others pays, and what each part asks of you."]]}},"share":{"label":{"en":"Share on WhatsApp"},"text":{"en":"Aimpire — start here. The guide in English, Urdu, Hindi, Arabic and Norwegian: {LINK}"}},"search":{"ph":{"en":"Search the whole guide…"},"none":{"en":"Nothing found — try another word, or ask in ❓ Questions."},"close":{"en":"Close"}},"install":{"title":{"en":"Keep Aimpire on your phone"},"body":{"en":"Add it to your home screen — then it opens with one tap, and you never need the link again."},"button":{"en":"Add to home screen"},"how":{"en":"How"},"ios":{"en":"iPhone: tap the share icon ⎙, then «Add to Home Screen»."},"android":{"en":"Chrome: tap ⋮ at the top, then «Add to Home screen»."},"inapp":{"en":"Opened inside WhatsApp or Element? Tap ⋮ and choose «Open in Chrome» (or Safari) first."},"open_chrome":{"en":"Open in Chrome"},"later":{"en":"Not now"}},"apps_page":{"list":[{"key":"mt5","name":"MetaTrader 5","android":"https://play.google.com/store/apps/details?id=net.metaquotes.metatrader5","ios":"https://apps.apple.com/app/metatrader-5/id413251709","icon":"assets/app-mt5.jpg"},{"key":"element","name":"Element X","android":"https://play.google.com/store/apps/details?id=io.element.android.x","ios":"https://apps.apple.com/app/element-x/id1631335820","join":"https://matrix.to/#/%23aimpire:matrix.org","icon":"assets/app-element.jpg"}],"en":{"lede":"Two apps, both free. You can install them now — the guide tells you when you need each one.","mt5":"Shows your account and every trade Sonic opens for you. You log in with the details from step 9.","element":"The chat app the Aimpire group uses. Install it before you press the join link in step 10 — the link opens inside the app.","browser":"Tag Markets, CopyX and the IB Portal run in your browser. There is no app to install for them.","warn":"Install only from Google Play or the App Store, through these links. If anyone sends you an app file or a «Tag Markets app», do not install it — fake apps are a common way people lose their login and their money.","join_note":"Installed it? Then join:","join":"Join the Aimpire group"}},"faq":{"en":{"lede":"Short answers to what people usually ask. Answers about rules come from the broker's or the platform's own words, which the other sections show in full.","search":"Search the questions","none":"No question matches that. Ask in the Aimpire group — someone has usually wondered the same.","items":[["Is this a scam?","It is a fair question, and you should ask it about anything involving money.\n\nWhat you can check yourself: your money sits with the broker, never with Aimpire or your sponsor; profit can be withdrawn whenever you ask; and the rules on this page are quoted from the broker's and the platform's own pages.\n\nSo put in only what you can afford to lose completely. Nobody can promise you that the strategy keeps making money."],["Who holds my money?","The broker, Tag Markets — not Aimpire and not your sponsor. Never send money to a person, and only deposit from inside your own portal."],["How much do I need to start?","The minimum is $10, both for the deposit and for connecting Sonic. Start with an amount you could lose completely, and watch it for a few weeks before you decide on more."],["Is this allowed in my country?","Rules differ between countries and change, so check your own before you deposit — we cannot give legal advice. Two separate things matter.\n\nThe broker's list: it publishes a list of countries it does not serve. Pakistan is not on that list. The United Arab Emirates is on it, so the broker does not serve people living there. Its website also says it is not intended for residents of the European Union.\n\nYour own country's rules: these are about you, not the broker. In Pakistan, the State Bank's EPD Circular Letter No. 08 of 2022 says sending money abroad to offshore forex, margin or CFD platforms is not permitted. The broker's list says nothing about that."],["Which apps do I need?","Two, both free: MetaTrader 5 to see your account, and Element X for the Aimpire group. Install them from the official stores only. Tag Markets, CopyX and the IB Portal run in your browser."],["How long does approval take?","The broker says verification «just takes a few minutes», with delays when demand is high or documents are incomplete. You need an ID document and a face scan. If it is rejected, the reason comes by email from SumSub. Use any waiting time for step 6, the apps."],["What does 24× mean for me?","With the Aimpire token your money trades 24 times larger: in our own test, $109 became a trading balance of $2,616. Gains and losses are both 24 times larger. A fall of 4.2 % in that balance is your whole deposit, and the account closes at 5 %."],["What does it cost?","The Sonic strategy takes a 30 % performance fee on profit, so you keep about 70 % of the profit — the Amplify section explains why it can be less. There is no management fee and no joining fee. On Amplify accounts the broker also charges $10 per lot in commission on forex and metals. Then there are the costs any trade has: the spread, swap on positions held overnight, and network fees when you deposit or withdraw crypto."],["Can I withdraw my money?","Profits: yes, you can withdraw them at any time, any day. Your deposit: only 30 days after your first trade, and taking it out closes the account immediately. An upgrade starts those 30 days again. The broker says payouts take 1–3 working days. The steps are under «Sonic» → «Withdrawals»."],["Can I reinvest my profit?","Yes. In CopyX open Follower Hub, then Strategies, press Reinvest on the strategy, enter the amount and press Upgrade. Know this first: the broker says an upgrade restarts the 30 days before your deposit can be taken out."],["Is there a daily loss limit?","No daily limit. There is one total limit: 10 % of the starting balance, or 5 % with the Aimpire token. Reach it and the account is closed automatically."],["Is the profit guaranteed?","No. Nothing here is guaranteed. Published results — Myfxbook included — are past results from the strategy's own account, without the fee you pay — not a forecast."],["How do I know the token worked?","Look at the balance in MetaTrader 5: with the token it is 24 times what you put in. If it is not, stop and ask your sponsor before you do anything else."],["Someone says I need eCredits, or must send crypto, to get 24×.","Not through Aimpire. Our token is #Aitech with the code 000000, and you send nothing for it. The platform also has an «#eCredits» route: there you send as many eCredits as you invest to a wallet address, so $100 means 100 eCredits on top of your deposit.\n\nIf anyone asks you to send money or crypto anywhere other than your own deposit page, stop and ask your sponsor."],["Can I have more than one account?","Yes. The broker says you may hold as many as you want, as long as each one follows the rules."],["My deposit has not arrived.","Check the transaction in your own wallet first — the portal cannot show money that never reached it. Your wallet's own estimate can say up to 24 hours. After that, send your sponsor the transaction ID, never a screenshot of your login."],["I chose the wrong network.","A wrong network can mean the money never arrives — wallets warn of «permanent loss of funds». Contact your wallet's own support with the transaction ID straight away. Nobody in Aimpire can reverse a crypto transfer."],["Someone says they are support and asks for my password.","Do not give it — not to support, not to a leader, not to anyone. Aimpire will never ask for it. If someone needs to see your results, give them the Investor Password: it can only look, not trade."],["I forgot my password.","The broker has its own guide for changing it, under «Get set up» → «Guides that already exist». Never ask anyone in a chat to reset it for you."],["Do I have to invite other people?","No. You can open an account, let Sonic run and never introduce anyone. Earning as an introducing broker is optional, and nothing on the platform requires it."],["How do I get a statement for my taxes?","The MetaTrader 5 terminal on a Windows computer can export it: open the History tab at the bottom, right-click, choose Export and save it as HTML, then print that to PDF. Keep the receipts for every deposit and withdrawal too. The rules depend on your country, and we cannot give tax advice."],["Where do I get help?","First this page. Then your sponsor — the person who invited you — for anything about your account. If money does not arrive or something seems wrong, your sponsor takes it further. And ask in the Aimpire group: someone has usually had the same question."],["When does the market move the most?","Around scheduled news. The economic calendar marks each release with an expected impact, and the strongest — like interest-rate decisions — are marked High. The minutes around a High release can move prices fast, in both directions, and spreads often widen. Many wait out about 15 minutes on each side of a High release before judging anything. Note: the calendar feed shows New York time, so convert it to your own clock. You find the calendar under Tools."]]}},"withdraw":{"en":{"lede":"Profit can come out any time; the deposit only 30 days after your first trade, and taking it out closes the account. The path has three parts, and the middle one is only needed the first time. Do it once early, with a small amount, so you know it works before you rely on it.","parts":[["From Amplify to your Tag wallet","On the Dashboard, open AMPLIFY. Profit you can take out is shown under AVAILABLE. Press WITHDRAW, enter the amount, press WITHDRAW again, then CONTINUE. The back office reviews it, so it can take a while to appear in your Tag Markets Wallet — refresh the page."],["First time only: add your own wallet","Open TAG WALLET → YOUR CRYPTO WALLETS → ADD A CRYPTO WALLET. Fill in the owner's name, choose CRYPTO, add your billing details and the address of your own wallet, enter your dashboard password and press SUBMIT CRYPTO WALLET. It shows PENDING VALIDATION — usually 5 to 45 minutes, up to 24 hours."],["From your Tag wallet to your own wallet","TAG WALLET → WITHDRAWALS. Enter the amount and press SUBMIT REQUEST, tick the box, press «Your attention is required. Please click here», enter the wallet you verified, and choose CRYPTOCHILL — without it the withdrawal is not processed and you have to start again. Check the details and press WITHDRAW."]],"facts":"The broker's minimum withdrawal is $10 on Ethereum (ETH), BNB (BSC) and Bitcoin (BTC), and $50 on Tron (TRX). A network fee is deducted, and it depends on the network — so what arrives is roughly the amount minus the network fee. The broker says Amplify payouts take 1–3 working days, and crypto withdrawals 2–24 hours up to $999, up to 48 hours up to $4,999, and up to 72 hours above that. Profit in CopyX can also be taken out from Follower Hub, Strategies, Withdraw; it then lands in your Tag Markets wallet."}},"results":{"source":"https://www.myfxbook.com/members/SonicExperts/sonic-ai/12076857","months":[["2024-11",1.12,0.13],["2024-12",1.18,0.15],["2025-01",1.23,0.17],["2025-02",1.25,0.1],["2025-03",1.06,0.21],["2025-04",1.26,0.81],["2025-05",1.78,0.6],["2025-06",1.18,0.71],["2025-07",1.45,0.5],["2025-08",1.61,0.42],["2025-09",1.63,0.15],["2025-10",1.17,0.0],["2025-11",0.91,0.03],["2025-12",1.16,0.0],["2026-01",0.61,0.0],["2026-02",0.55,0.03],["2026-03",0.8,0.0],["2026-04",1.26,0.0],["2026-05",1.09,0.0],["2026-06",1.06,0.01],["2026-07",1.17,0.02],["2026-08",0.88,0.0],["2026-09",1.04,0.0],["2026-10",0.42,0.01]],"stats":["+30.58 %","+1.13 %","−0.86 %","634","82–83 %"],"en":{"lede":"From the strategy's own Myfxbook record — a standard Tag Markets account at 1:500 — from 3 November 2024 to 14 October 2026. Each bar is one month's gain; the mark below it is that month's largest dip. The 30 % fee you pay is not taken out of these figures. Past results, not a forecast.","stats":["In total","Average month","Largest dip","Trades","Win rate"],"legend":["gain","largest dip"],"notes":["No losing month in 24 — which also means this record has not yet been tested by one.","Losing days happen: 49 of the 427 daily readings. The worst, −0.64 % on 3 June 2025, is about −15 % of your deposit in one day at 24×; the deepest dip, −0.86 %, about −21 %.","The average loss ($134.97) is bigger than the average win ($93.37). The high win rate carries the result, so a run of losses costs more than a run of wins earns.","The account closes at 5 %. The record's deepest dip, 0.86 %, is about a sixth of that distance.","Dips here are measured on each day's closing balance; inside a day they can go deeper. The record has gaps — the longest is 20 August to 12 September 2025 — and each counts as a single reading.","The strategy card inside CopyX labels 0.26 % as «Max DD». A slide in AiTech's presentation calls 0.26 % the average drawdown and 0.86 % the deepest. Myfxbook's deepest is 0.86 %, and that is the one we use."],"formula":"Effect on your deposit = the account's fall in % × 24.","link":"Check it yourself on Myfxbook","read":"Figures read on 15 October 2026.","table":"Show the numbers"}},"calculator":{"live":true,"multiple":24,"wipe":4.2,"worst_day":0.64,"periods":[6,12,23],"en":{"lede":"Enter an amount. This shows what the record would have left you, after all costs — the past applied to your money, not a forecast.","amount":"Amount you put in ($)","period":"Period","periods":["Last 6 months","Last 12 months","All 23 months"],"total":"What you would have kept, over the period","months":"Your best and worst month","risk":"The same 24× on the way down","risks":["A fall of 4.2 % in the trading balance takes all {A}; the account closes at 5 %.","The record's worst day (−0.64 %) would have cost {D} of your {A} in one day.","The record has no losing month, so this calculator cannot show you one. That is exactly why it is not a forecast."],"method":"Method: each month = amount × 24 × (that month's gain − commission − fee). The commission is estimated from the lots Myfxbook shows, on a $130,000 account; if the strategy account already pays the same commission, the real cost is lower. Small amounts cannot copy exactly: at about 0.17 lot per trade on $130,000, a deposit below roughly $330 at 24× would need trades smaller than 0.01 lot, the usual minimum. How CopyX handles that is not published.","disclaimer":"Past results applied to your amount — not a guarantee, not advice. Only put in what you could lose completely.","rows":["Before costs","Commission, $10 per lot","Performance fee, 30 %","What you keep"],"range":"Two numbers, because nobody publishes how the 30 % is settled. Taken weekly on the net result, you keep the higher one. Taken on every   const kode = String(q.get("l") || "").toLowerCase().replace(/[^a-z0-9]/g, "");

  const egenApp = q.get("src") === "pwa" || (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
  const fraUrl = leaderById(kode) || (egenApp && !kode ? husket : null);

     Unntak: lederen aapner sin EGEN lenke (e-posten ber om det) - da er det ikke en
     invitasjon, og selvvarselet under sponsoren sier fra (gjennomgang 17.10, funn 3). */
  const egen = !!(fraUrl && load("aimpire.me") && fraUrl.id === load("aimpire.me"));
  pendingConflict = (fraUrl && husket && husket.id !== fraUrl.id && !egen) ? { a: husket, b: fraUrl } : null;

  if(lr){

  } else {
    sponsorUrl = null; sponsorName = ""; sponsorVerified = false;
    if(REG_FRESH && !husket) store("aimpire.leader", null);

  const id = sponsorVerified ? lr.id : "";

function gnist(x, y, antall){
  try{
    if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    if(!document.body || !document.body.animate && !Element.prototype.animate) return;
    const farger = ["#15D8C4", "#C21FBF", "#FBE16B", "#1B4FD8", "#E04DDE"];
    for(let j = 0; j < antall; j++){
      const d = document.createElement("i");
      d.style.cssText = "position:fixed;left:" + x + "px;top:" + y + "px;width:7px;height:7px;border-radius:2px;" +
        "background:" + farger[j % farger.length] + ";z-index:98;pointer-events:none";
      document.body.appendChild(d);
      const v = (j / antall) * 6.283 + Math.random() * 0.9;
      const r = 36 + Math.random() * 54;
      if(!d.animate){ d.remove(); return; }
      d.animate([
        { transform: "translate(0,0) scale(1) rotate(0)", opacity: 1 },
        { transform: "translate(" + Math.cos(v) * r + "px," + (Math.sin(v) * r - 26) + "px) scale(.2) rotate(200deg)", opacity: 0 }
      ], { duration: 650 + Math.random() * 350, easing: "cubic-bezier(.16,.8,.3,1)" }).onfinish = function(){ d.remove(); };
    }
  }catch(e){}
}

      t.style.position = "fixed"; t.style.opacity = "0";
      document.body.appendChild(t); t.select();
      const ok = document.execCommand("copy"); document.body.removeChild(t);
      if(ok) done();   /* funn A10: ingen «Copied» uten kopi */
    }catch(e2){}
  }
}

function markerFeil(id){
  const inp = $(id); if(!inp) return;
  inp.classList.add("felt-feil");

function makeLinkNow(){
  const u = validRef($("ld-in").value), out = $("ld-out"), L = C.leaders[lang] || C.leaders.en;
  out.hidden = false; out.textContent = "";
  const b = document.createElement("b");
  if(!u){ out.className = "out bad"; b.textContent = L.bad; out.appendChild(b); markerFeil("ld-in"); return; }
  /* Lenken skal alltid baere Aimpire-adressen. Lages den fra den gamle
     adressen, ville den ellers ha baaret founders brukernavn videre til alle
     han inviterer. Lokalt beholder vi local host, ellers kunne ingen teste. */
  function hubBase(){
    const h = location.hostname;
    const lokal = !h || h === "localhost" || h === "127.0.0.1"
      || /\.local$/.test(h) || /^\d+\.\d+\.\d+\.\d+$/.test(h);
    const kanon = C.canonical || "";
    if(!lokal && kanon) return kanon.replace(/\/+$/, "") + "/";
    return location.origin + location.pathname.replace(/(ledere|index)\.html$/, "");
  }
  const lr = leaderById(codeOf(u));
  let text;
  if(lr){
    text = hubBase() + "?l=" + lr.id;
    store("aimpire.me", lr.id);
    out.className = "out"; b.textContent = L.ok;
  } else {
    const nm = cleanName($("ld-name").value);
    if(!nm){ out.className = "out bad"; b.textContent = L.name_hint; out.appendChild(b); markerFeil("ld-name"); return; }
    /* E-posten brukes bare til én beskjed: at lenka er godkjent og virker. */
    const mail = String($("ld-mail").value || "").trim();
    const F = C.leader_signup || {};
    if(F.mail_field && !/^[^@\s]+@[^@\s.]+\.[^@\s]+$/.test(mail)){
      out.className = "out bad"; b.textContent = L.mail_hint; out.appendChild(b); markerFeil("ld-mail"); return;
    }
    /* Skjemaet krever «hvem inviterte deg» (founder 16.10). Mangler det, avviser
       Google innsendingen stille - derfor stoppes det her, med beskjed. */
    const spons = cleanName($("ld-spons").value);
    if(F.sponsor_field && !spons){ out.className = "out bad"; b.textContent = L.spons_hint || L.name_hint; out.appendChild(b); markerFeil("ld-spons"); return; }
    if(F.form && F.name_field && F.link_field){
      /* Ikke godkjent: soeknaden gaar rett til founders Google-skjema med ett
         trykk. Lederen ser aldri skjemaet. */
      out.className = "out wait"; b.textContent = L.pending; out.appendChild(b);
      const go = el("button", "apply", L.apply); go.type = "button";
      go.onclick = function(){
        go.disabled = true;
        const body = new URLSearchParams(); body.set(F.name_field, nm); body.set(F.link_field, u.href);
        if(F.mail_field && mail) body.set(F.mail_field, mail);
        if(F.sponsor_field && spons) body.set(F.sponsor_field, spons);
        /* Spraaket lederen leser siden paa foelger med, saa e-posten kommer paa
           det samme spraaket. Romanisert urdu/arabisk regnes som urdu/arabisk. */
        if(F.lang_field) body.set(F.lang_field, baseOf(lang));
        window.__ldSending = true;
        fetch(F.form, { method: "POST", mode: "no-cors", body: body })
          .then(function(){
            window.__ldSending = false;
            /* Lenken finnes allerede: koden regnes ut av partnerlenka. Lederen
               faar den med én gang og trenger ingen e-post - den begynner aa
               virke i det founder huker av. */
            out.textContent = ""; out.className = "out";
            out.appendChild(el("b", null, L.applied));
            visLenke(out, hubBase() + "?l=" + codeOf(u));
            out.appendChild(el("p", "vnote", L.applied_wait || ""));
            store("aimpire.me", codeOf(u));
            try{ navigator.clipboard.writeText(hubBase() + "?l=" + codeOf(u)); }catch(e){}
          })
          .catch(function(){ go.disabled = false; go.textContent = L.apply_fail; });
      };
      out.appendChild(go);
      return;
    }
    /* Uten skjema: linja founder limer inn i ledere.txt, ferdig kopiert. */
    text = nm + " | " + u.href;
    out.className = "out wait"; b.textContent = L.pending_line || L.pending;
  }
  out.appendChild(b);
  visLenke(out, text);
  try{ navigator.clipboard.writeText(text); }catch(e){}
}

function el(tag, cls, text){
  const n = document.createElement(tag);
  if(cls) n.className = cls;
  if(text !== undefined) n.textContent = text;
  return n;
}

function rowsFor(items, dest){
  const frag = document.createDocumentFragment();
  const list = el("div","rows");
  let any = false;
  items.forEach(function(i){
    const href = i.url === "__REF__" ? dest.url : i.url;
    if(!href || !safeUrl(href)) return;
    const pair = i[lang] || i.en;
    any = true;
    const a = el("a", i.primary ? "slab" : "row");
    a.href = href;
    /* En intern lenke (#faq) bytter visning paa samme side - ny fane ville
       gitt to kopier av siden og mistet spraaket i localStorage-hoppet. */
    if(href.charAt(0) !== "#"){ a.target = "_blank"; a.rel = "noopener noreferrer"; }
    /* Tjenestens eget ikon, saa man kjenner igjen hvor man havner. */
    if(i.icon && sameOrigin(i.icon) && !i.primary){
      const im = el("img","ri"); im.loading = "lazy"; im.decoding = "async";
      im.src = i.icon; im.alt = ""; im.width = 30; im.height = 30; a.appendChild(im); a.classList.add("ico");
    }
    a.appendChild(el("span","t",pair[0]));
    /* Hovedknappen sier hvem sin lenke den aapner («Through Najma's link»),
       ikke bare «your sponsor's» - founder 16.10, tydelighet om hvem som verver. */
    const SV = C.sponsor && (C.sponsor[lang] || C.sponsor.en);
    const sub = (i.primary && sponsorName && SV && SV.via) ? SV.via.replace("{N}", sponsorName) : pair[1];
    a.appendChild(el("span","s",sub));
    if(i.primary){ frag.appendChild(a); }
    else { a.appendChild(el("span","go","›")); list.appendChild(a); }
  });
  if(list.children.length) frag.appendChild(list);
  return any ? frag : null;
}

  let topp = U.progress.replace("{done}", nDone).replace("{total}", total) +

/* Tall med tegn i hoeyre-til-venstre-tekst. $, x, % og : er «svake» tegn i
   Unicode-bidi og havner paa feil side av tallet: $109 ble vist som 109$, 12x
   som x12 - og 1:30 kan bli 30:1, som snur betydningen. Hver slik bit pakkes
   i usynlige isolater (LRI ... PDI) saa den alltid leses venstre-til-hoeyre.
   Kjoeres paa hver render, saa nytt innhold dekkes uten at noen husker det. */
const FIGURE_RX = new RegExp([
  "\\d[\\d,.]*(?::\\d+)?(?:\\s?[\\u00f7\\u00d7=]\\s?\\d[\\d,.]*(?::\\d+)?)+(?:\\s?%)?",  // 1 / 24 = 4.2 %, 24 x 30 = 720:1 (hele formelen)
  "[+\\u2212]?\\$\\s?\\d[\\d,.]*",       // $109  $2,616  $0.60  \u2212$5
  "\\d[\\d,.]*\\s?\\u00d7",              // 12x  24x
  "\\u00d7\\s?\\d[\\d,.]*",              // x 0.70
  "[+\\u2212]?\\d[\\d,.]*\\s?%",          // 10%  5 %  +30.6 %  \u22120.86 %
  "\\d+(?:\\s?/\\s?\\d+)+",              // 70 / 5 / 25
  "\\d+:\\d+",                           // 1:30  1:500
  "#[A-Za-z][A-Za-z0-9]*",                 // #Aitech
  "@[A-Za-z0-9_][A-Za-z0-9_.]*[A-Za-z0-9_]"  // @aim.pire
].join("|"), "g");
/* Slideren fyrer mange ganger per sekund; én gjennomgang per bilde holder (funn A13). */
let isoPlanlagt = false;
function planleggIsolering(){
  if(isoPlanlagt) return; isoPlanlagt = true;
  (window.requestAnimationFrame || function(f){ setTimeout(f, 16); })(function(){ isoPlanlagt = false; isolateFigures(); });
}
function isolateFigures(){
  if(document.documentElement.dir !== "rtl") return;
  const root = document.querySelector(".shell");
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: function(n){
      const p = n.parentNode;
      if(!p || p.closest("svg, script, style, [dir=ltr]")) return NodeFilter.FILTER_REJECT;
      if(n.data.indexOf("\u2066") !== -1) return NodeFilter.FILTER_REJECT;
      FIGURE_RX.lastIndex = 0;
      return FIGURE_RX.test(n.data) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
    }
  });
  const nodes = [];
  while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(function(n){
    n.data = n.data.replace(FIGURE_RX, function(m){ return "\u2066" + m + "\u2069"; });
  });
}

/* Knapper og felt slik de STAAR paa skjermen hos megleren og i appene - paa
   engelsk, fordi det er det medlemmet ser. Founder 15.10: ingen skal sitte og
   gjette om «Next» er «aage». Hver knapp blir en liten knapp i teksten, og paa
   hindi/urdu/arabisk faar den foerste forekomsten i hvert avsnitt en kort
   forklaring i parentes. Selve oversettelsene endres ikke. */
const UI_ROOTS = "#s-guide, #s-withdraw, #s-amplify, #s-faq";
/* Fagordene staar paa engelsk i alle spraak (sidens egen regel), saa de kan
   finnes likt overalt. Foerste gang et ord dukker opp i et avsnitt, blir det
   trykkbart og aapner forklaringen i Laer. Ingen nye tekster: forklaringene
   finnes allerede paa fem spraak. */
const ORD = { pip: 0, pips: 0, point: 1, points: 1, spread: 2, lot: 3, lots: 3,
  leverage: 4, margin: 4, balance: 5, equity: 5, "stop-loss": 7, drawdown: 10 };
function markTerms(){
  const L = C.learn && (C.learn.terms[lang] || C.learn.terms.en); if(!L) return;
  const rx = new RegExp("(^|[^A-Za-z0-9-])(" + Object.keys(ORD).sort(function(a, b){ return b.length - a.length; }).join("|") + ")(?![A-Za-z0-9-])", "gi");
  document.querySelectorAll("#s-guide, #s-amplify, #s-withdraw").forEach(function(root){
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: function(n){
        const p = n.parentNode;
        if(!p || p.closest("h2, h3, summary, button, a, .ui, .gl, .codes, .qz, svg")) return NodeFilter.FILTER_REJECT;
        rx.lastIndex = 0;
        return rx.test(n.data) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
      }
    });
    const nodes = []; while(w.nextNode()) nodes.push(w.currentNode);
    nodes.forEach(function(n){
      const blokk = n.parentNode.closest("li, p, dd, div") || n.parentNode;
      const sett = blokk.__ord || (blokk.__ord = new Set());
      const frag = document.createDocumentFragment(); let sist = 0, m;
      rx.lastIndex = 0;
      while((m = rx.exec(n.data))){
        const at = m.index + m[1].length, ord = m[2], nokkel = ord.toLowerCase();
        if(sett.has(nokkel)){ continue; }
        sett.add(nokkel);
        frag.appendChild(document.createTextNode(n.data.slice(sist, at)));
        const b = el("button", "ordb", ord); b.type = "button";
        b.onclick = function(){ apneOrd(ORD[nokkel]); };
        frag.appendChild(b);
        sist = at + ord.length;
      }
      if(!sist) return;
      frag.appendChild(document.createTextNode(n.data.slice(sist)));
      n.parentNode.replaceChild(frag, n);
    });
  });
}
function apneOrd(i){
  setView("learn");
  setTimeout(function(){
    const d = $("ord-" + i); if(!d) return;
    d.open = true;
    d.scrollIntoView({ block: "center" });
  }, 60);
}
function markUiLabels(){
  const U = C.ui_labels; if(!U || !U.labels || !U.labels.length) return;
  const G = (U.gloss && U.gloss[lang]) || {};
  const esc = function(t){ return t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); };
  const rx = new RegExp("(^|[^A-Za-z0-9])(" + U.labels.slice().sort(function(a, b){ return b.length - a.length; }).map(esc).join("|") + ")(?![A-Za-z0-9])", "g");
  document.querySelectorAll(UI_ROOTS).forEach(function(root){
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: function(n){
        const p = n.parentNode;
        if(!p || p.closest("h2, h3, summary, button, a, .ui, .codes, svg")) return NodeFilter.FILTER_REJECT;
        rx.lastIndex = 0;
        return rx.test(n.data) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
      }
    });
    const nodes = []; while(w.nextNode()) nodes.push(w.currentNode);
    nodes.forEach(function(n){
      const block = n.parentNode.closest("li, p, dd, div") || n.parentNode;
      const seen = block.__ui || (block.__ui = new Set());
      const frag = document.createDocumentFragment(); let last = 0, m;
      rx.lastIndex = 0;
      while((m = rx.exec(n.data))){
        const at = m.index + m[1].length, lab = m[2];
        frag.appendChild(document.createTextNode(n.data.slice(last, at)));
        const chip = el("span", "ui", lab); chip.dir = "ltr"; frag.appendChild(chip);
        if(G[lab] && !seen.has(lab)){ seen.add(lab); frag.appendChild(el("span", "gl", " (" + G[lab] + ")")); }
        last = at + lab.length;
      }
      frag.appendChild(document.createTextNode(n.data.slice(last)));
      n.parentNode.replaceChild(frag, n);
    });
  });
}

/* Kalkulatoren legger historikkens EKTE maaneder paa medlemmets beloep:
   beholdt = beloep x 24 x maanedens gevinst x 0,70, profitten tatt ut hver
   maaned (ingen renters rente). Nedsiden staar like stort ved siden av, og
   den sier selv hvorfor den ikke er en prognose. Vises bare naar founder
   har slaatt den paa (calculator.live) - compliance-porten i CLAUDE.md. */
let calcPeriod = 12;
function renderCalc(){
  const K = C.calculator, sec = $("s-calc");
  if(!K || !sec || !C.results) return;
  sec.hidden = !K.live;
  if(!K.live) return;
  const T = K[lang] || K.en;
  $("cc-lede").textContent = T.lede;
  { const hw = $("cc-how"); if(hw){ const K = C.calculator[lang] || C.calculator.en; hw.textContent = K.how || "How this is worked out"; } }
  $("cc-amount-l").textContent = T.amount;
  $("cc-total-l").textContent = T.total;
  $("cc-risk-t").textContent = T.risk;
  $("cc-method").textContent = T.method;
  $("cc-disc").textContent = T.disclaimer;
  const usd = function(n){ return "$" + n.toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2}); };
  const per = $("cc-per"); per.textContent = "";
  K.periods.forEach(function(n, i){
    const b = el("button", null, T.periods[i]); b.type = "button";
    b.setAttribute("aria-pressed", String(n === calcPeriod));
    b.onclick = function(){ calcPeriod = n; renderCalc(); };
    per.appendChild(b);
  });
  const inp = $("cc-amount"), sl = $("cc-slide");
  $("cc-range").textContent = T.range || K.en.range;
  const pre = $("cc-pre"); pre.textContent = "";
  [50, 100, 250, 500, 1000].forEach(function(v){
    const b = el("button", null, "$" + v.toLocaleString("en-US")); b.type = "button"; b.dir = "ltr";
    b.onclick = function(){ inp.value = v; sl.value = v; calc(); };
    pre.appendChild(b);
  });
  sl.oninput = function(){ inp.value = sl.value; calc(); };
  /* Hver maaned: [maaned, brutto %, kurtasje %, fee ukentlig netto %, fee per vinnerdag %]
     paa strategikontoen. Ganges med 24 og beloepet. Ingen rentes rente: gevinsten tas ut. */
  function calc(){
    const A = Math.max(0, parseFloat(inp.value) || 0), f = A * K.multiple / 100;
    const ms = K.costs.slice(-calcPeriod);
    const sum = function(i){ return ms.reduce(function(s, m){ return s + m[i]; }, 0) * f; };
    const G = sum(1), Cm = sum(2), Fw = sum(3), Fd = sum(4);
    const hi = G - Cm - Fw, lo = G - Cm - Fd;
    if(String(sl.value) !== String(Math.min(2000, Math.max(10, A)))) sl.value = Math.min(2000, Math.max(10, A));
    /* Stolpen: hvor bruttoen blir av. Beholdt (lav) + det ekstra du kan beholde
       ved ukentlig oppgjoer + avgift + kurtasje = brutto. */
    const pct = function(x){ return G > 0 ? Math.max(0, x / G * 100).toFixed(2) + "%" : "0%"; };
    const bar = $("cc-bar").children;
    bar[0].style.width = pct(lo); bar[1].style.width = pct(hi - lo); bar[2].style.width = pct(Fw); bar[3].style.width = pct(Cm);
    $("cc-total").textContent = usd(lo) + " \u2013 " + usd(hi);
    const kept = ms.map(function(m){ return [m[0], (m[1] - m[2] - m[3]) * f]; });
    const best = kept.reduce(function(a, b){ return b[1] > a[1] ? b : a; });
    const worst = kept.reduce(function(a, b){ return b[1] < a[1] ? b : a; });
    $("cc-months").textContent = T.months + ": " + best[0] + " " + usd(best[1]) + " \u00b7 " + worst[0] + " " + usd(worst[1]);
    const R = T.rows || K.en.rows, tab = $("cc-tab"); tab.textContent = "";
    [[R[0], usd(G)], [R[1], "\u2212" + usd(Cm)], [R[2], "\u2212" + usd(Fw) + " \u2013 \u2212" + usd(Fd)], [R[3], usd(lo) + " \u2013 " + usd(hi)]]
      .forEach(function(r){ tab.appendChild(el("dt", null, r[0])); const dd = el("dd", null, r[1]); dd.dir = "ltr"; tab.appendChild(dd); });
    const ul = $("cc-risks"); ul.textContent = "";
    T.risks.forEach(function(r){
      ul.appendChild(el("li", null, r.replace(/\{A\}/g, usd(A)).replace(/\{D\}/g, usd(A * K.multiple * K.worst_day / 100))));
    });
    planleggIsolering();
  }
  inp.oninput = calc; calc();
}

   visning/fane/element og aapner det om det er foldet. */
let SIDX = [];
function norm(s){ return String(s || "").normalize("NFKD").replace(/[\u0300-\u036f\u064b-\u0652\u0670]/g, "").toLowerCase(); }
function buildIndex(){
  SIDX = [];

  ((M && M.items) || []).forEach(function(it){ where[it[0]] = it[1]; });
  const add = function(title, text, cat, tb, id){ if(!title) return; const x = String(text || ""); SIDX.push({ t: title, x: x, n: norm(title + " " + x), nt: norm(title), cat: cat, tab: tb, id: id, w: where[cat] || "" }); };
  const G = C.guide[lang] || C.guide.en;

  const I = C.ib && (C.ib[lang] || C.ib.en); if(I && I.blocks) I.blocks.forEach(function(b){ add(b[0], b[1], "ib", null, "s-ib"); });
  const W = C.withdraw && (C.withdraw[lang] || C.withdraw.en); if(W && W.parts) W.parts.forEach(function(p){ add(p[0], p[1], "earn", "withdraw", "s-withdraw"); });
  const AM = C.amplify && C.amplify.items && (C.amplify.items[lang] || C.amplify.items.en); if(AM) AM.forEach(function(it){ add(it[0], Array.isArray(it[1]) ? it[1].join(" ") : it[1], "earn", "sonic", "s-amplify"); });

/* Spraakpakker (#37): siden har bare engelsk. Et annet spraak hentes én gang
   fra lang/<kode>.json og lagres paa telefonen, saa neste besoek aapner rett
   paa urdu uten ventetid. Pakken byttes bare naar innholdet faktisk endres
   (hashen i C.packs). Feiler hentingen, vises engelsk - aldri en tom side. */
const HAVE = { en: true };
function mergePack(L, entries){
  entries.forEach(function(e){
    let o = C;
    for(let i = 0; i < e[0].length && o; i++) o = o[e[0][i]];
    if(o && typeof o === "object") o[L] = e[1];
  });
  HAVE[L] = true;
}
function cachedPack(L){
  try{
    const p = JSON.parse(localStorage.getItem("aimpire.pack." + L) || "null");
    return p && C.packs && p.v === C.packs[L] ? p.d : null;
  }catch(e){ return null; }
}
function ensurePack(L){
  if(HAVE[L] || !C.packs || !C.packs[L]) return Promise.resolve(true);
  const c = cachedPack(L);
  if(c){ mergePack(L, c); return Promise.resolve(true); }
  const timeout = new Promise(function(res){ setTimeout(function(){ res(null); }, 8000); });
  /* Hashen ligger i filnavnet, ikke i ?v=: GitHub Pages' kant ignorerer spoerrestrengen,
     saa ?v= kunne gi en gammel pakke under ny hash (gjennomgang 17.10, funn C2). */
  const get = fetch("lang/" + L + "." + C.packs[L] + ".json")
    .then(function(r){ return r.ok ? r.json() : null; })
    .catch(function(){ return null; });
  return Promise.race([get, timeout]).then(function(d){
    if(!Array.isArray(d)) return false;
    mergePack(L, d);
    try{ localStorage.setItem("aimpire.pack." + L, JSON.stringify({ v: C.packs[L], d: d })); }catch(e){}
    return true;
  });
}
function setLang(code){
  const L = conf(code).code;
  if(HAVE[L] || cachedPack(L)){ ensurePack(L); applyLang(L); return; }
  document.documentElement.setAttribute("aria-busy", "true");
  ensurePack(L).then(function(ok){
    document.documentElement.removeAttribute("aria-busy");
    applyLang(ok ? L : "en");
  });
}
function applyLang(code){
  const L = conf(code);
  lang = L.code;
  document.documentElement.lang = L.bcp || L.code;
  document.documentElement.dir = L.dir;
  document.documentElement.setAttribute("data-font", L.font);
  C.langs.forEach(function(x){
    const b = $("L-" + x.code);
    if(b) b.setAttribute("aria-pressed", String(x.code === baseOf(lang)));
  });
  /* Skriftvalg: bare naar spraaket har en romanisert variant. */
  const sc = $("script"), base = baseOf(lang);
  const rom = C.langs.find(function(x){ return x.roman_of === base; });
  if(sc){
    sc.textContent = "";
    sc.hidden = !rom;
    if(rom){
      [conf(base), rom].forEach(function(x){
        const b = el("button", null, x.label);
        b.type = "button";
        b.setAttribute("aria-pressed", String(x.code === lang));
        if(x.dir === "rtl") b.dir = "rtl";
        b.onclick = function(){ store("aimpire.script." + base, x.code); setLang(x.code); };
        sc.appendChild(b);
      });
    }
  }
  store("aimpire.lang", lang);
  render();
}
function toggleTheme(){
  /* Moerk er standard (founder 15.10): foerste trykk gaar til lys. */
  const cur = document.documentElement.getAttribute("data-theme") || "dark";
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  store("aimpire.theme.v2", next);
}
(function(){
  const th = load("aimpire.theme.v2");
  if(th) document.documentElement.setAttribute("data-theme", th);
  let l = load("aimpire.lang");
  if(!C.langs.some(function(x){ return x.code === l; })){
    /* Telefonens egen rekkefoelge avgjoer: en urdu-telefon med engelsk som nr. 2 skal faa
       urdu, ikke engelsk (gjennomgang 17.10, funn A2). nb/nn = norsk. */
    const liste = ((navigator.languages && navigator.languages.length) ? Array.prototype.slice.call(navigator.languages) : [navigator.language || ""])
      .map(function(x){ return String(x || "").toLowerCase().replace(/^(nb|nn)(?=-|$)/, "no"); });
    let hit = null;
    for(let i = 0; i < liste.length && !hit; i++){
      hit = C.langs.find(function(x){ return liste[i] === x.code || liste[i].indexOf(x.code + "-") === 0; });
    }
    l = hit ? hit.code : C.langs[0].code;
  }
  let h0 = (location.hash || "").replace(/^#/, "");
  const raa0 = h0;
  h0 = ALIAS[h0] || h0;
  if(CATS.indexOf(h0) !== -1) view = h0;
  /* En delt lenke til en FANE (#calc) skal aapne fanen, ikke bare visningen. */
  if(TABS[h0] && TABS[h0].indexOf(raa0) !== -1) tab = raa0;
  const go = function(){ initSponsor(); buildSwitch(); setLang(l); };
  /* Har lenka eller telefonen en leder, ventes det paa den ferske lista (liten
     fil), saa en leder founder nettopp har lagt til eller fjernet gjelder straks. */
  /* Ytelsesmaaling 17.10 (Fast 3G, 4x CPU): aa holde hele siden skjult til lista kom,
     ga 3,5 s forsinket foerste visning. Naa tegnes siden straks; sponsorblokken viser
     «sjekker invitasjonen» til lista er der, og oppdaterer seg selv naar den kommer.
     Hurtigbufret liste fra sist gjoer uansett sponsoren riktig fra foerste bilde. */
  /* Hjemskjerm-ikonet: hvitt for universal, moerkt KUN naar siden aapnes fra en
     lederlenke (founder 17.10 04:07 + 04:12). Byttes foer noen rekker aa lagre. */
  try{
    if(new URLSearchParams(location.search).get("l")){
      const mfL = document.querySelector('link[rel="manifest"]');
      if(mfL) mfL.href = "manifest-leder.webmanifest";
      const atL = document.querySelector('link[rel="apple-touch-icon"]');
      if(atL) atL.href = "assets/apple-touch-icon-dark.png";
    }
  }catch(e){}
  go();
  loadReg().then(function(){ try{ initSponsor(); render(); }catch(e){} });
  /* Siden virker uten nett etter foerste besoek, og andre aapning er
     oeyeblikkelig. Registreres for alle, etter load, saa den aldri
     konkurrerer med foerste last. */
  /* Maaling (B-020): Cloudflare Web Analytics, uten cookies og uten lagret IP.
     Lastes bare naar founder har limt inn token, og foerst etter load. */
  const CF = C.analytics && C.analytics.cf_token;
  if(CF && /^[0-9a-f]{32}$/.test(CF) && location.protocol === "https:"){
    const lastBeacon = function(){
      const sc = document.createElement("script"); sc.defer = true;
      sc.src = "https://static.cloudflareinsights.com/beacon.min.js";
      sc.setAttribute("data-cf-beacon", JSON.stringify({ token: CF }));
      document.body.appendChild(sc);
    };
    if(document.readyState === "complete") lastBeacon(); else window.addEventListener("load", lastBeacon);
  }
  if("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")){
    /* Ledersiden: feltene overlever en omlasting (16.10: en leder satt paa en gammel
       versjon av siden i en halvtime og fikk soeknaden stille avvist av Google). */
    const LD_FELT = ["ld-in", "ld-name", "ld-mail", "ld-spons"], LD_KEY = "aimpire.ld.stash";
    const erLedere = PAGE === "leaders";   /* feltet ld-in finnes skjult paa medlemssiden ogsaa (gjennomgang 17.10, funn C1) */
    if(erLedere){
      try{
        const st = JSON.parse(sessionStorage.getItem(LD_KEY) || "null");
        if(st){ sessionStorage.removeItem(LD_KEY); LD_FELT.forEach(function(id){ const el = document.getElementById(id); if(el && st[id]) el.value = st[id]; }); }
      }catch(e){}
    }
    let haddeKontroll = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener("controllerchange", function(){
      if(!haddeKontroll){ haddeKontroll = true; return; }   /* foerste installasjon (ingen gammel SW): ikke last om */
      if(!erLedere) return;                                  /* medlemssiden: neste aapning er ny nok */
      if(window.__ldSending) return;                         /* midt i en innsending: aldri avbryt den */
      const harInnhold = LD_FELT.some(function(id){ const el = document.getElementById(id); return !!(el && el.value); });
      let lagret = false;
      try{
        const sist = Number(sessionStorage.getItem("aimpire.sw.reloadedAt") || 0);
        if(Date.now() - sist < 15000) return;                /* aldri omlastingsloekke */
        sessionStorage.setItem("aimpire.sw.reloadedAt", String(Date.now()));
        const st = {}; LD_FELT.forEach(function(id){ const el = document.getElementById(id); if(el && el.value) st[id] = el.value; });
        sessionStorage.setItem(LD_KEY, JSON.stringify(st));
        lagret = true;
      }catch(e){}
      if(harInnhold && !lagret) return;                      /* kunne ikke ta vare paa feltene (sessionStorage sperret): la lederen sende foerst */
      location.reload();
    });
    const regSw = function(){
      navigator.serviceWorker.register("sw.js").then(function(reg){
        /* Se etter ny versjon naar siden kommer i forgrunnen igjen, og hvert minutt mens den er aapen. */
        const sjekk = function(){ try{ reg.update().catch(function(){}); }catch(e){} };
        document.addEventListener("visibilitychange", function(){ if(document.visibilityState === "visible") sjekk(); });
        setInterval(sjekk, 60000);
      }).catch(function(){});
    };
    if(document.readyState === "complete") regSw(); else window.addEventListener("load", regSw);
  }
})();
</script>
