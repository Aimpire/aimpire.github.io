<style>
/* Samplet fra founders egne Canva-dokumenter 14.10.2026, ikke oppfunnet:
   kjerneblaa #006EFD, gradient som lysner mot hvitt, svart display-serif.
   Lys er standard - merkevaren er hvit-dominert (31-45 % av pikslene).
   Variabelnavnene er beholdt fra den moerke paletten, saa de ~90
   bruksstedene ikke maatte roeres. Kontrasttall i kommentar per linje. */
:root{
  /* Aimpires egne farger, fra logoen: svart + gradienten blaa -> turkis ->
     magenta -> gul. IKKE AiTech (marine + himmelblaa) og IKKE Tag (lime).
     Lys modus: hvit med farge, ikke graa. Kontrast maalt mot #FFFFFF. */
  --ink:#FBFAFD;            /* sideflate: nesten hvit, et snev fiolett     */
  --ink-deep:#FFFFFF;
  --ink-raise:#FFFFFF;
  --gold:#A3159F;           /* FLATE: knapp, aktiv fane, marg - magenta 10:1 med hvit tekst */
  --gold-soft:#0B7C72;      /* TEKSTaksent: dyp turkis, 5,1:1              */
  --gold-deep:#A3159F;
  --lime:#0F7A4A; --red:#C0392B;
  --chalk:#14101C;          /* broedtekst: 18:1                            */
  --chalk-dim:#4D4858;      /* guidetekst: 8,6:1                           */
  --rule:#E7E2EE;
  --edge-ui:#827C8E;
  --ember:#C24F15;
  --gold-metal:#FBE16B;     /* FLATE: markoerer og stegtall - merke-gult   */
  --on-gold:#14101C;        /* tekst PAA gult, samme i begge temaer: 15:1  */
  --gold-ink:#7A5410;
  --jet:#14101C;
  --jet-on:#FFFFFF;
  --v1:#1B4FD8; --v2:#0E8F86; --v3:#A3159F; --v4:#C99A00;
  --grad:linear-gradient(118deg,#1B4FD8 0%,#15D8C4 33%,#C21FBF 68%,#FBE16B 100%);
  /* Samme familie, men uten de to trinnene som forsvinner paa hvitt:
     #15D8C4 gir 1,9:1 og #FBE16B gir 1,3:1 mot hvit flate. */
  --grad-ink:linear-gradient(110deg,#1B4FD8 0%,#0E8F86 40%,#A3159F 100%);
  --measure:36rem;
  --face:"Montserrat",system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --display:"Archivo","Montserrat",system-ui,sans-serif;
}
:root[data-theme="dark"]{
  --ink:#08080B; --ink-deep:#121217; --ink-raise:#1A1A22;
  --gold:#C21FBF; --gold-soft:#5EE6D6; --gold-deep:#E04DDE;
  --chalk:#F4F2F7; --chalk-dim:#A9A4B5; --rule:#27242F;
  --edge-ui:#6F6A7C; --ember:#F08A4B;
  --v1:#5B8BFF; --v2:#2FE0CC; --v3:#E04DDE; --v4:#FBE16B;
  --gold-metal:#FBE16B; --gold-ink:#FBE16B; --jet:#F4F2F7; --jet-on:#08080B;
  --grad-ink:var(--grad);
}
html[data-font="deva"]{ --face:"Noto Sans Devanagari","Montserrat",sans-serif }
html[data-font="nastaliq"]{ --face:"Noto Nastaliq Urdu","Montserrat",serif }
html[data-font="naskh"]{ --face:"Noto Naskh Arabic","Montserrat",serif }

/* «Himmelen over bruksanvisningen». Merkevarens egen gradient som et fast
   lag bak innholdet, saa siden har noe aa staa under i stedet for et moerkt
   lokk over seg. Driver bare MENS du scroller: animation-timeline gjoer at
   den har posisjon, ikke tid, saa det tegnes ingen ramme naar siden ligger
   stille. Kun transform animeres - laget males én gang, GPU-en flytter
   teksturen. Ingen background-attachment:fixed (jank i Android Chrome) og
   ingen backdrop-filter (dyr paa Mali/Adreno). ~0,3 KB gzipet. */
.sky{position:fixed;inset-block-start:0;inset-inline:0;height:46vh;z-index:-1;
  pointer-events:none;transform:translate3d(0,0,0);
  background:
    radial-gradient(90% 60% at 12% -10%, rgba(21,216,196,.34) 0%, rgba(21,216,196,0) 62%),
    radial-gradient(80% 60% at 92% -12%, rgba(194,31,191,.26) 0%, rgba(194,31,191,0) 60%),
    radial-gradient(60% 40% at 50% -18%, rgba(251,225,107,.40) 0%, rgba(251,225,107,0) 60%)}
html[dir="rtl"] .sky{background:
    radial-gradient(90% 60% at 88% -10%, rgba(21,216,196,.34) 0%, rgba(21,216,196,0) 62%),
    radial-gradient(80% 60% at 8% -12%, rgba(194,31,191,.26) 0%, rgba(194,31,191,0) 60%),
    radial-gradient(60% 40% at 50% -18%, rgba(251,225,107,.40) 0%, rgba(251,225,107,0) 60%)}
:root[data-theme="dark"] .sky{background:
    radial-gradient(100% 70% at 14% -14%, rgba(27,79,216,.38) 0%, rgba(27,79,216,0) 62%),
    radial-gradient(80% 60% at 92% -16%, rgba(194,31,191,.24) 0%, rgba(194,31,191,0) 60%),
    linear-gradient(180deg, rgba(8,8,11,0) 0%, rgba(8,8,11,0) 100%)}
:root[data-theme="dark"][dir="rtl"] .sky{background:
    radial-gradient(100% 70% at 86% -14%, rgba(27,79,216,.38) 0%, rgba(27,79,216,0) 62%),
    radial-gradient(80% 60% at 8% -16%, rgba(194,31,191,.24) 0%, rgba(194,31,191,0) 60%),
    linear-gradient(180deg, rgba(8,8,11,0) 0%, rgba(8,8,11,0) 100%)}
@keyframes drift{
  from{transform:translate3d(-2%,0,0) scale(1.04)}
  to{transform:translate3d(2%,-1.5%,0) scale(1.12)}}
@keyframes skypulse{
  0%{filter:hue-rotate(0deg) saturate(1)}
  100%{filter:hue-rotate(18deg) saturate(1.18)}}
@media (prefers-reduced-motion:no-preference){
  /* Auraen puster ogsaa i ro - tech-folelsen founder etterlyste (17.10 04:01). */
  .sky{animation:skypulse 14s ease-in-out infinite alternate}
  @supports (animation-timeline:scroll()){
    .sky{animation:drift 1s linear both, skypulse 14s ease-in-out infinite alternate;
      animation-timeline:scroll(root block), auto}}}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ink);color:var(--chalk);font-family:var(--face);
  font-size:1.0625rem;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
/* Nastaliq stabler bokstavformer vertikalt INNE i linja, saa 14px nastaliq
   har omtrent samme detaljnivaa som 10px latinsk. Maalt foer endring:
   guidetekst 15,2px, markoerforklaringer 14,08px — saa vidt lesbart.
   Roten loeftes per skriftsystem, og alle rem-verdier foelger med. */
html[data-font="nastaliq"]{font-size:18px}
html[data-font="naskh"]{font-size:18px}
html[data-font="deva"]{font-size:17.5px}
html[data-font="nastaliq"] body{line-height:1.9}
html[data-font="naskh"] body{line-height:1.9}
html[data-font="deva"] body{line-height:1.8}
/* Noto Nastaliq Urdu finnes i 400 og 700. Ber vi om 800 eller 900, lager
   nettleseren syntetisk fet — og paa en skrift der strekene allerede
   overlapper, smoerer det teksten ut i stedet for aa framheve den. */
html[data-font="nastaliq"] h1,html[data-font="nastaliq"] h2,
html[data-font="nastaliq"] h3,html[data-font="nastaliq"] .t{font-weight:500}
html[data-font="nastaliq"] strong,html[data-font="nastaliq"] b,
html[data-font="nastaliq"] .wm{font-weight:700}
/* Overskriftene skal IKKE foelge den loeftede roten - da blir de vegger.
   Egne tak, i em av seg selv, saa brodteksten kan vaere lesbar uten at
   titlene roper. */
html[data-font="nastaliq"] .sec > h2{font-size:1.16rem;line-height:1.5}
html[data-font="nastaliq"] .plate .t{font-size:1.04rem;line-height:1.55}
html[data-font="nastaliq"] .plate[data-cat="start"] .t{font-size:1.12rem}
html[data-font="nastaliq"] .plate .d{font-size:.92rem;line-height:1.85}
.shell{max-width:46rem;margin:0 auto;padding:0 clamp(18px,5vw,40px) 72px}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold-soft);outline-offset:3px}
[hidden]{display:none !important}
/* Mens en spraakpakke hentes foerste gang: ingen engelsk som blinker forbi. */
html[aria-busy="true"] .shell{visibility:hidden}

/* masthead */
.mast{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  padding:26px 0 0;border-bottom:1px solid var(--rule)}
.wordmark{display:flex;align-items:center;gap:11px;padding-bottom:12px}
.mono{width:40px;height:40px;flex:0 0 auto;display:block}
.wordmark .wm{display:block;font-family:var(--display);font-weight:800;font-size:18px;
  font-variation-settings:"wdth" 94;letter-spacing:.11em;text-transform:uppercase;
  line-height:1;color:var(--chalk)}
/* «AIM» er fortsatt poenget i navnet, men det baeres av vekt, ikke av en
   andre farge. Ett ordmerke skal ha én farge naar det staar inntil en
   gradient - ellers konkurrerer de. */
.wordmark .wm em{font-style:normal;font-weight:500;color:inherit}
.wordmark .tag{display:block;margin-top:5px;font-size:10px;letter-spacing:.22em;
  color:var(--chalk-dim);font-weight:600;font-family:var(--display);text-transform:uppercase}
/* Alle fem skal paa én linje ogsaa paa 360px, ellers havner urdu til
   venstre paa linje to - stikk motsatt av hensikten med aa sette den sist. */
.switch{display:flex;gap:4px;padding-bottom:8px;align-items:center}
.switch button{background:var(--ink-deep);border:1px solid var(--rule);border-radius:999px;
  color:var(--chalk);font:inherit;font-size:13px;font-weight:700;
  padding:8px clamp(8px,2.6vw,14px);
  cursor:pointer;font-family:var(--display);min-height:40px;line-height:1;
  white-space:nowrap;transition:none}
.switch button:hover{border-color:var(--gold)}
/* Aktivt spraak: svart flate med gull understrek. Svart baerer kontrasten,
   gullet sier hvilken. Begge deler leses paa en billig skjerm i dagslys. */
.switch button[aria-pressed="true"]{background:var(--jet);border-color:var(--jet);
  color:var(--jet-on);box-shadow:inset 0 -3px 0 0 var(--gold-metal)}
/* Lys/moerk er en KONTROLL, ikke et spraak - den skilles ut. */
.switch .thm{font-size:15px;margin-inline-start:auto;padding:7px 11px;min-width:40px;
  border-style:dashed;color:var(--chalk-dim);flex:0 0 auto}
.switch .thm:hover{color:var(--chalk);border-color:var(--gold-metal)}

/* hero */
.hero{padding:52px 0 40px}
.hero h1{margin:0;font-family:var(--display);font-weight:800;
  font-variation-settings:"wdth" 88;
  font-size:clamp(2.5rem,10.5vw,4.6rem);line-height:.94;letter-spacing:-.028em;
  text-transform:none;text-wrap:balance}
html[data-font="deva"] .hero h1,html[data-font="nastaliq"] .hero h1,html[data-font="naskh"] .hero h1{
  font-family:var(--face);text-transform:none;letter-spacing:0;line-height:1.3;
  font-size:clamp(2rem,8vw,3.4rem)}
/* Maa staa ETTER den felles regelen over - samme spesifisitet, saa det er
   rekkefoelgen som avgjoer. Foerste forsoek laa foran og ble overstyrt:
   maalt 36px i stedet for 28,8. */
html[data-font="nastaliq"] .hero h1{font-size:clamp(1.6rem,6.4vw,2.5rem);line-height:1.42}
.hero h1 span{display:block}
/* Gradienten bor i logoen og i regelstreken under hver h2. Paa overskriften
   ble den dekorasjon — og halvt usynlig paa hvitt. Dyp blaa i stedet: 9,33:1,
   og to toner leser som ett utsagn i stedet for to. */
/* Andre linje i logoens egen gradient - lys modus uten den gule, som forsvinner paa hvitt. */
.hero h1 span:last-child{background:var(--grad-ink);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:26px 0 0;max-width:var(--measure);color:var(--chalk-dim);font-size:1.02rem}
@media (prefers-reduced-motion:no-preference){
  .hero h1 span{animation:rise .55s cubic-bezier(.2,.7,.3,1) backwards}
  .hero h1 span:nth-child(2){animation-delay:.07s}
}
@keyframes rise{from{opacity:0;transform:translateY(.35em)}to{opacity:1;transform:none}}

/* Paa korte skjermer (360x640 og mindre, de vanligste billige telefonene) tok
   logo, spraakvalg, overskrift og sponsorvarselet hele foerste skjerm, saa det
   foerste kortet - det som sier hva man skal gjoere - laa nedenfor kanten.
   Maalt 16.10: kort 1 begynte paa 644 px med 640 px skjerm. Overskriften er
   merkevaren, men den maa ikke staa i veien for handlingen. */
@media (max-height:700px){
  header{padding-top:12px}
  .wordmark{margin-bottom:2px}
  .hero{padding:26px 0 22px}
  .hero h1{font-size:clamp(2rem,8.4vw,3.2rem)}
  html[data-font="deva"] .hero h1,html[data-font="naskh"] .hero h1{font-size:clamp(1.7rem,6.6vw,2.6rem)}
  html[data-font="nastaliq"] .hero h1{font-size:clamp(1.45rem,5.6vw,2.1rem)}
  .hero p{margin-top:14px}
  .notice{margin-block:10px}
  .menu .mlede{margin-bottom:9px}
  /* Nastaliq og naskh bruker mer hoeyde per linje. Luften strammes, ikke
     teksten: founder 15.10 sa urdu var «stor og skremmende» da den var tett. */
  html[data-font="nastaliq"] .hero,html[data-font="naskh"] .hero,html[data-font="deva"] .hero{padding:16px 0 12px}
  html[data-font="nastaliq"] .hero p,html[data-font="naskh"] .hero p,html[data-font="deva"] .hero p{margin-top:10px}
  html[data-font="nastaliq"] .script,html[data-font="naskh"] .script{margin-top:4px}
  html[data-font="nastaliq"] .notice,html[data-font="naskh"] .notice{padding-block:11px}
}

/* sections */
.sec{padding:50px 0 0}
.sec > h2{margin:0 0 22px;font-size:1.42rem;font-weight:700;letter-spacing:-.015em;
  color:var(--chalk);font-family:var(--display);font-variation-settings:"wdth" 92}
html[data-font="deva"] .sec > h2,html[data-font="nastaliq"] .sec > h2,html[data-font="naskh"] .sec > h2{
  font-family:var(--face);letter-spacing:0}
.sec > h2 b{display:block;width:46px;height:3px;background:var(--grad);margin-top:11px}
.lede{max-width:var(--measure);color:var(--chalk-dim);margin:0 0 26px}

/* sponsor */
.spon{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;margin:30px 0 0;
  padding:12px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
  font-size:.86rem;color:var(--chalk-dim)}
.spon strong{color:var(--chalk);font-weight:700}
.spon .fp{font-family:var(--mono);font-size:.82rem;color:var(--gold-soft);font-weight:700;
  letter-spacing:.04em;background:var(--ink-deep);border:1px solid var(--rule);
  border-radius:4px;padding:2px 7px}
.guide > li::before,.rail > li::before,.pin,.keys li::before{font-variant-numeric:tabular-nums}
.spon button{background:none;border:0;color:var(--gold-soft);font:inherit;font-size:.86rem;
  text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0}

/* primary action */
.slab{display:block;background:var(--grad);color:#08080B;text-decoration:none;
  border-radius:2px;
  padding:22px 24px;margin:0 0 2px;border:0}
.slab .t{display:block;font-family:"Montserrat",sans-serif;font-weight:900;font-size:1.4rem;
  letter-spacing:.01em;line-height:1.12;text-transform:uppercase}
html[data-font="deva"] .slab .t,html[data-font="nastaliq"] .slab .t,html[data-font="naskh"] .slab .t{
  font-family:var(--face);text-transform:none;letter-spacing:0;line-height:1.7}
.slab .s{display:block;margin-top:5px;font-size:.9rem;opacity:.72;font-weight:600}
.slab.reg{text-align:center;border:1.5px solid rgba(255,255,255,.30);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.38), inset 0 -2px 0 rgba(0,0,0,.18),
    0 8px 26px rgba(194,31,191,.30);
  transition:transform .12s ease,filter .15s ease}
.slab.reg:active{transform:scale(.985)}
:root:not([data-theme="dark"]) .slab.reg{border-color:rgba(0,0,0,.14);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55), 0 8px 22px rgba(163,21,159,.22)}
.slab:hover,.slab:focus-visible{filter:brightness(1.12)}
/* Egen lenke: samme slab-form, men omriss - sekundaer handling, aldri doed flate. */
.slab.own{color:var(--chalk);border:1.5px solid transparent;
  background:linear-gradient(var(--ink),var(--ink)) padding-box,var(--grad) border-box}
.slab.own .t{font-size:1.05rem}
.slab.own:hover,.slab.own:focus-visible{filter:brightness(1.18);border-color:transparent}

/* ruled link rows */
/* Rader paa blaa grunn saa ut som tekst. Naa er de et hvitt kort med
   egne rader, tittelen i lenkefargen og et stoerre, tydeligere maal. */
.rows{background:var(--ink-deep);border:1px solid var(--rule);border-radius:8px;
  overflow:hidden}
/* Tittel OVER undertekst, som en listerad i en app. Side om side presset
   underteksten ned i en smal soeyle med ett ord per linje paa mobil. */
.row{display:grid;grid-template-columns:1fr auto;grid-template-areas:"t go" "s go";
  column-gap:12px;row-gap:2px;align-items:center;padding:14px 16px;
  border-top:1px solid var(--rule);text-decoration:none;color:inherit;min-height:60px}
.row.ico{grid-template-columns:30px 1fr auto;grid-template-areas:"ico t go" "ico s go"}
.row:first-child{border-top:0}
.row .ri{grid-area:ico;width:30px;height:30px;border-radius:8px;object-fit:cover}
.row .t{grid-area:t;font-weight:700;font-size:1.04rem;letter-spacing:-.01em;color:var(--gold-soft)}
.row .s{grid-area:s;color:var(--chalk-dim);font-size:.88rem;line-height:1.4}
.row:hover,.row:focus-visible{background:#F6F0FA}
.row .go{color:var(--gold);font-weight:800;font-size:1.25rem;font-family:var(--display);
  grid-area:go;line-height:1}
html[dir="rtl"] .row .go{transform:scaleX(-1)}
:root[data-theme="dark"] .row:hover,:root[data-theme="dark"] .row:focus-visible{
  background:var(--ink-raise)}

/* short list */
.rail{list-style:none;margin:0;padding:0;position:relative;counter-reset:n}
.rail::before{content:"";position:absolute;inset-block:14px;inset-inline-start:13px;
  width:1px;background:var(--rule)}
.rail > li{position:relative;padding:0 0 26px;padding-inline-start:46px;max-width:var(--measure)}
.rail > li:last-child{padding-bottom:0}
.rail > li::before{content:counter(n);counter-increment:n;position:absolute;inset-inline-start:0;
  top:-1px;width:27px;height:27px;border:1px solid var(--rule);border-radius:50%;
  background:var(--ink);color:var(--chalk-dim);display:grid;place-items:center;
  font-size:.8rem;font-weight:700;font-family:"Montserrat",sans-serif}

/* step-by-step guide */
.guide{list-style:none;counter-reset:g;margin:0;padding:0;position:relative}
.guide::before{content:"";position:absolute;inset-block:16px;inset-inline-start:15px;
  width:1px;background:var(--rule)}
.guide::before{inset-inline-start:19.5px}
.guide > li{counter-increment:g;position:relative;padding:0 0 26px;padding-inline-start:52px;
  max-width:var(--measure)}
.guide > li:last-child{padding-bottom:0}
/* Stegtallet ER avhukingen. Ett trykk, stort nok maal, og ingressen sitt
   loefte om aa «stoppe etter hvert steg og komme tilbake» blir ekte. */
.tick{position:absolute;inset-inline-start:0;top:-6px;width:40px;height:40px;
  border-radius:50%;background:var(--gold-metal);border:1.5px solid var(--on-gold);
  color:var(--on-gold);display:grid;place-items:center;font:800 .85rem/1 var(--display);
  font-variant-numeric:tabular-nums;cursor:pointer;padding:0}
.tick[aria-pressed="true"]{background:var(--jet);color:var(--jet-on);border-color:var(--jet)}
/* Dimming av avhukede steg var feil paa to maater: paa nastaliq og naskh
   blir allerede fine streker uleselige ved 50 % opasitet, og man maa kunne
   lese om igjen et steg man har gjort. Fullfoeringen vises paa sirkelen
   alene — teksten staar i full styrke. */
.guide > li.done h3{color:var(--chalk-dim)}
/* Delhaker: hver linje i et steg er en handling man kan krysse av. */
.subs{list-style:none;margin:10px 0 0;padding:0}

.subs > li{display:flex;gap:10px;align-items:flex-start;padding:5px 0}
.subs > li.on > span{color:var(--chalk-dim)}
.sub{flex:0 0 auto;width:26px;height:26px;margin-top:1px;border-radius:7px;
  border:1.5px solid var(--edge-ui);background:transparent;color:var(--on-gold);
  font:800 .82rem/1 var(--display);display:grid;place-items:center;cursor:pointer;padding:0}
.sub[aria-pressed="true"]{background:var(--gold-metal);border-color:var(--gold-metal)}
.subs > li > span{flex:1 1 auto}
.tick[aria-pressed="true"]::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;inset:0;
  border-radius:50%;box-shadow:0 0 0 3px var(--gold-metal)}
.tick{position:absolute}
.prog{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 20px;
  font-family:var(--mono);font-size:.82rem;color:var(--chalk-dim)}
.prog .bar{flex:1 1 120px;height:4px;background:var(--rule);border-radius:999px;
  overflow:hidden;min-width:90px}
.prog .bar i{display:block;height:100%;background:var(--gold-metal);
  transition:width .18s linear}
.prog button{background:none;border:0;color:var(--gold-soft);font:inherit;
  text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0}

/* Koder som maa skrives EKSAKT hoerer ikke hjemme i loepende tekst. */
.codes{display:flex;flex-wrap:wrap;gap:8px;margin:13px 0 0}
.codes button{display:inline-flex;align-items:center;gap:9px;background:var(--ink-deep);
  border:1px solid var(--rule);border-radius:6px;padding:9px 12px;cursor:pointer;
  font:inherit;font-size:.84rem;color:var(--chalk);text-align:start}
.codes button:hover{border-color:var(--gold-metal)}
.codes .k{color:var(--chalk-dim);font-size:.78rem}
/* «#Aitech» begynner med et noeytralt tegn. I en RTL-setning flyttes
   «#» til hoeyre for de latinske bokstavene og koden VISES som «Aitech#»,
   selv om verdien som kopieres er riktig. Isolering laaser visningen. */
.codes .v{font-family:var(--mono);font-weight:700;letter-spacing:.03em;
  direction:ltr;unicode-bidi:isolate;display:inline-block}
.codes .c{color:var(--gold-soft);font-size:.74rem;font-family:var(--face)}

/* Riktig app, riktig plattform. To store maal - ingen gjetting. */
.apps{display:flex;gap:8px;margin:13px 0 0;flex-wrap:wrap}
.apps a{flex:1 1 130px;display:flex;align-items:center;justify-content:center;gap:8px;
  border:1.5px solid transparent;border-radius:var(--r-btn);
  background:linear-gradient(var(--ink-raise),var(--ink-raise)) padding-box,var(--grad) border-box;
  color:var(--chalk);padding:11px 14px;text-decoration:none;font-weight:800;font-size:.9rem;
  font-family:var(--display);min-height:44px}
.apps a:hover,.apps a:focus-visible{filter:brightness(1.18)}
.joinbtn{display:block;margin:9px 0 0;background:var(--grad);color:#08080B;
  text-decoration:none;padding:14px 16px;border-radius:var(--r-btn);text-align:center;
  font-weight:800;font-size:1rem;font-family:var(--display);min-height:48px}
.joinbtn:hover,.joinbtn:focus-visible{filter:brightness(1.12)}

/* Ordlista. Lukket til man trykker, saa den som bare vil la Sonic gaa
   slipper aa scrolle forbi tolv begreper. */
.learn{display:grid;gap:2px}
.learn details{background:var(--ink-deep);border:1px solid var(--rule);border-radius:6px}
.learn summary{cursor:pointer;padding:14px 16px;font-weight:700;font-size:1rem;
  font-family:var(--display);list-style:none;display:flex;align-items:center;gap:10px;
  min-height:52px}
.learn summary::-webkit-details-marker{display:none}
.learn summary::after{content:"+";margin-inline-start:auto;color:var(--gold-soft);
  font-weight:800;font-size:1.2rem;line-height:1}
.learn details[open] summary::after{content:"\2212"}
.learn details[open] summary{border-bottom:1px solid var(--rule)}
.learn .body{padding:4px 16px 16px}
.learn .one{margin:10px 0 0;color:var(--chalk);font-size:.95rem}
.learn dl{margin:12px 0 0;display:grid;gap:3px}
.learn dt{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;
  color:var(--chalk-dim);font-family:var(--display);font-weight:700}
.learn dd{margin:0 0 9px;font-size:.9rem;color:var(--chalk-dim)}
.aca-t{margin:34px 0 4px;font-size:1.15rem}
.learn .les{padding:4px 16px 18px}
.learn .les h4{margin:16px 0 4px;font-size:.98rem;color:var(--chalk)}
.learn .les p{margin:0;font-size:.95rem;line-height:1.65;color:var(--chalk-dim)}
.learn summary .sub{display:block;font-weight:400;font-size:.85rem;color:var(--chalk-dim);margin-top:2px}
.learn .les .fx{margin:8px 0 0;padding:9px 12px;font-family:var(--mono);font-size:.84rem;line-height:1.6;color:var(--chalk);
  background:var(--ink);border:1px solid var(--rule);border-inline-start:3px solid var(--gold-metal);border-radius:0 5px 5px 0;
  white-space:pre-line;direction:ltr;unicode-bidi:isolate;text-align:left}
html[dir="rtl"] .learn .les .fx{border-radius:5px 0 0 5px}
.learn dd.ex{font-family:var(--mono);font-size:.84rem;color:var(--chalk);
  background:var(--ink);border:1px solid var(--rule);border-radius:5px;padding:9px 11px;
  direction:ltr;unicode-bidi:isolate;text-align:start}
/* Formelen er regelen de kan bruke selv. Den skiller seg fra eksempelet
   med gullkant, saa den leses som «dette er verktoeyet». */
.learn dd.fx{font-family:var(--mono);font-size:.84rem;color:var(--chalk);
  background:var(--ink);border:1px solid var(--rule);
  border-inline-start:3px solid var(--gold-metal);border-radius:0 5px 5px 0;
  padding:9px 11px;direction:ltr;unicode-bidi:isolate;text-align:start}
html[dir="rtl"] .learn dd.fx{border-radius:5px 0 0 5px}
.learn .lfig{margin:13px 0 4px}
.learn .lfig svg{display:block;width:100%;height:auto}
.guide h3{margin:0 0 5px;font-size:1.05rem;font-weight:800;letter-spacing:-.01em}
.guide p{margin:0;color:var(--chalk-dim);font-size:.95rem}

/* language chips for the partner's own videos */
/* «Husk dette» skal leses foer broedteksten rundt, ikke etter. Gul kant
   og hvit flate loefter den ut, og den staar i full tekstfarge — ikke
   dempet, slik den gjorde foer. */
/* «Slik vet du at det gikk riktig». Groenn kant fordi den betyr
   fullfoert — her er det faktisk riktig bruk av groenn. */
.chk{margin:13px 0 0;padding:12px 15px;background:var(--ink-deep);
  border:1px solid var(--rule);border-inline-start:4px solid #0F7A4A;
  border-radius:0 6px 6px 0;font-size:.89rem;color:var(--chalk)}
html[dir="rtl"] .chk{border-radius:6px 0 0 6px}
.chk b{display:block;font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;
  color:#0F7A4A;font-family:var(--display);margin-bottom:5px}
:root[data-theme="dark"] .chk{border-inline-start-color:#4ADE80}
:root[data-theme="dark"] .chk b{color:#4ADE80}

.vnote{margin:13px 0 0;padding:13px 15px;background:var(--ink-deep);
  border:1px solid var(--rule);border-inline-start:4px solid var(--gold-metal);
  border-radius:0 6px 6px 0;font-size:.9rem;color:var(--chalk);font-weight:500}
html[dir="rtl"] .vnote{border-radius:6px 0 0 6px}
/* Knapp slik den staar paa skjermen: ser ut som en knapp, leses som engelsk. */
.ui{display:inline-block;font:700 .9em/1.25 "Archivo","Montserrat",system-ui,sans-serif;
  padding:.02em .38em;margin:0 .06em;border:1px solid var(--edge-ui);border-radius:5px;
  background:var(--ink-deep);color:var(--chalk);white-space:nowrap;unicode-bidi:isolate}
.gl{color:var(--chalk-dim)}
.out .apply{display:block;margin-top:12px;min-height:44px;width:100%;border:0;border-radius:999px;background:var(--grad-ink);color:#fff;font:800 1rem/1 var(--display);cursor:pointer}
.out .apply:disabled{opacity:.6}
#notice-none .dlink{display:inline-flex;align-items:center;min-height:40px;margin-top:10px;
  color:var(--gold-soft);font-weight:700;text-decoration:underline;text-underline-offset:3px}
#spon .dcheck{margin:9px 0 0;font-size:.82rem;line-height:1.45;color:var(--chalk-dim);
  border-top:1px solid var(--rule);padding-top:9px}
.dcheck.selfw{color:var(--chalk);border-inline-start:3px solid var(--gold);padding-inline-start:10px}
#spon .dlink{display:inline-flex;align-items:center;min-height:40px;margin-top:4px;
  color:var(--gold-soft);font-weight:700;text-decoration:underline;text-underline-offset:3px}
#spon .ok{margin-inline-start:.3em;color:var(--gold-soft);font-weight:800}
.langs{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
.langs a{display:inline-flex;align-items:center;min-height:40px;padding:7px 14px;border:1px solid var(--rule);border-radius:999px;
  font-size:.82rem;font-weight:600;text-decoration:none;color:var(--chalk-dim);
  font-family:"Montserrat",sans-serif;background:var(--ink-deep)}
.langs a:hover,.langs a:focus-visible{border-color:var(--gold);color:var(--gold)}
.soon{margin:12px 0 0;font-size:.86rem;color:var(--chalk-dim);font-style:italic}

/* annotated screenshot */
.shot{margin:14px 0 0;position:relative;max-width:300px}
.shot img{display:block;width:100%;height:auto;border:1px solid var(--rule);border-radius:6px}
.pin{position:absolute;width:24px;height:24px;border-radius:50%;background:var(--gold-metal);
  color:var(--on-gold);font:800 12px/1 var(--display);display:grid;place-items:center;
  transform:translate(-50%,-50%);box-shadow:0 0 0 3px var(--ink);pointer-events:none}
html[dir="rtl"] .pin{transform:translate(50%,-50%)}
.keys{list-style:none;margin:12px 0 0;padding:0;counter-reset:k}
.keys li{display:flex;gap:10px;align-items:flex-start;padding:5px 0;font-size:.88rem;
  color:var(--chalk-dim)}
.keys li::before{content:counter(k);counter-increment:k;flex:0 0 auto;width:20px;height:20px;
  border-radius:50%;background:var(--gold-metal);color:var(--on-gold);display:grid;place-items:center;
  font:800 11px/1 var(--display);margin-top:2px}

/* earnings */
.earn{margin:0;padding:0;list-style:none}
.earn > li{padding:0 0 22px;max-width:var(--measure);position:relative;padding-inline-start:20px}
.earn > li::before{content:"";position:absolute;inset-inline-start:0;top:.6em;
  width:8px;height:8px;background:var(--gold)}
.earn h3{margin:0 0 3px;font-size:1.04rem;font-weight:700;letter-spacing:-.01em}
.earn p{margin:0;color:var(--chalk-dim);font-size:.93rem}
.warn{max-width:var(--measure);margin:10px 0 0;padding:18px 20px;background:#FFF4EC;
  border:1px solid #F0D3BE;border-inline-start:4px solid var(--ember);
  border-radius:0 6px 6px 0;font-size:.93rem;color:var(--chalk)}
html[dir="rtl"] .warn{border-radius:6px 0 0 6px}
:root[data-theme="dark"] .warn{background:var(--ink-raise);border-color:var(--rule);
  border-inline-start-color:var(--ember)}

/* values — tiers that widen */
.tiers{margin:0;padding:0;list-style:none}
.tiers > li{display:flex;align-items:flex-start;gap:16px;padding:18px 20px;margin-bottom:3px;
  background:var(--ink-raise);border-inline-start:3px solid var(--gold)}
.tiers > li:nth-child(1){width:76%;border-inline-start-color:var(--v1)}
.tiers > li:nth-child(2){width:84%;border-inline-start-color:var(--v2)}
.tiers > li:nth-child(3){width:92%;border-inline-start-color:var(--v3)}
.tiers > li:nth-child(4){width:100%;border-inline-start-color:var(--v4)}
@media (max-width:560px){ .tiers > li{width:100% !important} }
/* The whole word is the display type now — founder saw one 2rem Montserrat Black
   letter in four bright colours and said it read like a primary-school alphabet
   chart. Geometric/technical face per BRAND.md §1, medium weight instead of
   Black, sentence case instead of shouting caps, and the AIMPIRE acronym is
   carried by the initial in the logo gradient rather than by four flat brights. */
.tiers h3{margin:0 0 6px;font-family:var(--display);font-weight:700;
  font-variation-settings:"wdth" 90;
  font-size:clamp(1.5rem,5.6vw,2.05rem);line-height:1.04;letter-spacing:-.022em;
  text-transform:none;color:var(--chalk)}
.tiers h3 .ini{color:var(--gold-soft);
  box-shadow:inset 0 -.085em 0 0 var(--gold);padding-bottom:.03em}
html[data-font="deva"] .tiers h3,html[data-font="nastaliq"] .tiers h3,html[data-font="naskh"] .tiers h3{
  font-family:var(--display)}
.tiers p{margin:0;color:var(--chalk-dim);font-size:.92rem}

/* tre steder, tre navn */
.places{margin:0;padding:0;list-style:none;display:grid;gap:2px}
.places > li{padding:15px 18px;background:var(--ink-deep);
  border-inline-start:3px solid var(--gold)}
.places h3{margin:0 0 3px;font-size:.95rem;font-weight:800;
  font-family:"Montserrat",sans-serif;letter-spacing:.01em}
.places p{margin:0;color:var(--chalk-dim);font-size:.9rem}
@media (min-width:620px){ .places{grid-template-columns:repeat(3,1fr)} }
/* Amplify staar i én kolonne ogsaa paa bred skjerm — fire punkter som maa
   leses i rekkefoelge, ikke tre kort som kan skumleses. */
.places.amp{grid-template-columns:1fr !important;gap:3px;max-width:var(--measure)}
.places.amp > li{border-inline-start-color:var(--ember);padding:16px 18px}
.places.amp p{color:var(--chalk);font-size:.93rem}

/* IB-seksjonen. Staar nederst fordi den er valgfri. */
.ib{display:grid;gap:3px;max-width:var(--measure)}
.ib > section{background:var(--ink-deep);border:1px solid var(--rule);
  border-radius:6px;padding:17px 19px}
.ib h3{margin:0 0 7px;font-family:var(--display);font-weight:700;
  font-size:1.06rem;letter-spacing:-.015em}
.ib p{margin:0;color:var(--chalk);font-size:.93rem}
.ib .fig{margin:15px 0 0}
.ib .cap{margin:8px 0 0;font-size:.8rem;color:var(--chalk-dim);
  font-family:var(--mono);direction:ltr;unicode-bidi:isolate;text-align:start}
.ib .flag{margin:14px 0 0;padding:11px 13px;background:#FFF4EC;
  border:1px solid #F0D3BE;border-inline-start:4px solid var(--ember);
  border-radius:0 5px 5px 0;font-size:.85rem;color:var(--chalk)}
html[dir="rtl"] .ib .flag{border-radius:5px 0 0 5px}
:root[data-theme="dark"] .ib .flag{background:var(--ink-raise);border-color:var(--rule)}
.ib svg{display:block;width:100%;height:auto}

/* notices */
.notice{max-width:var(--measure);padding:22px 24px;background:var(--ink-deep);
  border-inline-start:3px solid var(--gold)}
.notice.alert{border-inline-start-color:var(--ember);background:#FFF4EC}
:root[data-theme="dark"] .notice.alert{background:var(--ink-raise)}
.notice h2{margin:0 0 8px;font-size:1.1rem;font-weight:700}
.notice p{margin:0 0 10px;color:var(--chalk-dim);font-size:.94rem}
.notice p:last-child{margin-bottom:0}
.notice .foot{font-size:.85rem;padding-top:12px;margin-top:14px;border-top:1px solid var(--rule)}
.choice{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.choice button{flex:1 1 150px;padding:13px;border:1px solid var(--rule);background:none;
  color:var(--chalk);font:inherit;font-size:.92rem;font-weight:700;cursor:pointer;
  font-family:"Montserrat",sans-serif}
/* To navn, ingen favoritt: begge knappene like (B-023). */
.choice button:first-child{background:none;border-color:var(--rule);color:inherit}

/* leader tool */
.tool{max-width:var(--measure)}
.tool p{color:var(--chalk-dim);font-size:.9rem;line-height:1.55;margin:0 0 12px}
.tool input{width:100%;background:var(--ink-deep);border:1px solid var(--rule);color:var(--chalk);
  padding:11px 13px;border-radius:var(--r-in);font:inherit;font-size:.95rem;font-family:"Montserrat",sans-serif;
  margin-bottom:8px}
.tool input:focus{border-color:var(--gold);outline:none}
.tool .flab{display:block;margin:10px 0 4px;font:700 .78rem/1.2 var(--display);color:var(--chalk-dim);
  letter-spacing:.02em}
html[data-font="nastaliq"] .tool .flab,html[data-font="naskh"] .tool .flab,html[data-font="deva"] .tool .flab{font-family:var(--face)}
.tool input.felt-feil{border-color:var(--gold-deep);box-shadow:0 0 0 1px var(--gold-deep)}
.tool .hint{font-size:.82rem;color:var(--chalk-dim);margin:0 0 14px}
/* Founder 16.10: navnet paa den som inviterte, i gull og stoerre - det er det
   foerste medlemmet skal kjenne igjen. Resten av linja er stille. */
/* Founder 16.10 (andre runde): gult navn var stygt. Navnet i hvitt som foer,
   blikkfanget er en gradient-ring med forbokstaven - samme sprak som resten. */
.spon .avi{width:34px;height:34px;border-radius:50%;background:var(--grad);color:#08080B;
  display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;
  font-family:var(--display);font-weight:900;font-size:.95rem;line-height:1;text-transform:uppercase}
.spon .who{color:var(--chalk);font-weight:800;font-size:1.02rem;letter-spacing:.01em}
/* Registrer-handlingen er primaer-flaten (samme som «Open your account»), ikke en hvit knapp. */
.spon .slab.reg{flex:1 1 100%;margin:8px 0 0;padding:16px 18px;border-radius:var(--r-btn)}
.spon .slab.reg .t{font-size:1.12rem}
.spon .slab.reg .s{margin-top:3px;font-size:.86rem}
.spon .slab.own{flex:1 1 100%;margin:10px 0 0;padding:13px 18px;border-radius:var(--r-btn)}
#nn-who{margin:10px 0 0;padding:0;border:0;gap:8px;align-items:center}
#notice-none .slab.reg{display:block;margin:12px 0 2px;padding:16px 18px;border-radius:var(--r-btn)}
#notice-none .slab.reg{margin-top:10px}
#notice-none .slab.reg .t{font-size:1.12rem}
#notice-none .slab.reg .s{margin-top:3px;font-size:.86rem}
.ib .slab.own{display:block;margin:12px 0 0;padding:13px 18px;border-radius:var(--r-btn)}
.tool button{width:100%;background:var(--grad);color:#08080B;border:0;padding:13px 16px;min-height:48px;
  border-radius:var(--r-btn);font:800 1rem/1.15 var(--display);cursor:pointer}
.tool button:hover,.tool button:focus-visible{filter:brightness(1.1);outline:none}
.tool button:active{transform:scale(.985)}
.out{margin-top:14px;padding:14px 15px;background:var(--ink-deep);border:1px solid var(--rule);
  font-size:.8rem;word-break:break-all;line-height:1.7}
.out b{display:block;color:var(--gold-soft);margin-bottom:6px;font-size:.85rem}
.out.bad b{color:var(--gold-soft)}

.risk{max-width:var(--measure);margin:56px 0 0;padding-top:20px;border-top:1px solid var(--rule);
  color:var(--chalk-dim);font-size:.95rem}
.legal{max-width:var(--measure);margin:18px 0 0;color:var(--chalk-dim);opacity:.8;
  font-size:.9rem;line-height:1.7}
.legal p{margin:0 0 10px}
.legal p:last-child{margin-bottom:0}
.sig{margin:30px 0 0;font-size:.8rem;color:var(--chalk-dim);font-family:"Montserrat",sans-serif}

/* Overskrifter i ikke-latinsk skrift bruker spraakets egen skrift. */
html[data-font="nastaliq"] .sec h3,html[data-font="naskh"] .sec h3,
html[data-font="deva"] .sec h3,html[data-font="nastaliq"] .notice h2,
html[data-font="naskh"] .notice h2,html[data-font="deva"] .notice h2{font-family:var(--face);letter-spacing:0}
/* Lange forklaringer deles i avsnitt med tomme linjer i innholdet. */
.sec p{white-space:pre-line}
/* Skriftvalg under spraakraden: lite, men tydelig nok til aa oppdages. */
.script{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.script[hidden]{display:none}
.script button{font:600 .82rem/1.2 Montserrat,system-ui,sans-serif;padding:7px 13px;border-radius:999px;
  border:1px solid var(--rule);background:none;color:var(--chalk-dim);cursor:pointer}
.script button[dir=rtl]{font-family:"Noto Nastaliq Urdu","Noto Naskh Arabic",serif;font-weight:400}
.script button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#fff}
/* ---------- visninger ----------
   Kategorien er et attributt paa .shell. `hidden` (render sin) vinner alltid. */
.shell[data-view] .sec[data-cat]{display:none}
.shell[data-view="start"] .sec[data-cat="start"],
.shell[data-view="learn"] .sec[data-cat="learn"],
.shell[data-view="earn"]  .sec[data-cat="earn"],
.shell[data-view="tools"] .sec[data-cat="tools"],
.shell[data-view="faq"]   .sec[data-cat="faq"],
.shell[data-view="ib"]    .sec[data-cat="ib"]{display:block}
/* Inne i en kategori er «Start her» allerede lest. Sponsorlinja blir staaende:
   den sier hvem lenka tilhoerer, og det gjelder paa hver side. */
.shell[data-view]:not([data-view="menu"]) .hero h1,
.shell[data-view]:not([data-view="menu"]) .hero > p{display:none}
.shell[data-view]:not([data-view="menu"]) .hero{padding:18px 0 0}
/* Varslene hoerer hjemme der beslutningen tas: forsiden og «Kom i gang». */
.shell[data-view]:not([data-view="menu"]):not([data-view="start"]):not(.conflict) .notices{display:none}
/* Paa forsiden er «ingen sponsorlenke» bare overskriften - ellers fyller den
   hele foerste skjerm og menyen havner under bretten. Hele forklaringen staar
   i «Kom i gang». Konflikt-valget beholdes helt: det krever et svar. */
.shell[data-view="menu"] #notice-none p{display:none}
.shell[data-view="menu"] #notice-none{padding-block:14px}
.shell[data-view="menu"] #notice-none h3{margin:0}
.sec[hidden],.menu[hidden],.back[hidden]{display:none !important}
/* Ledersiden viser bare lederverktoeyet, medlemssiden aldri det. Ligger i CSS
   saa en seksjon som slaar seg paa selv (IB, kalkulator, bonuser) ikke lekker over. */
html[data-page="leaders"] .sec:not(#s-leaders){display:none !important}
html:not([data-page="leaders"]) #s-leaders{display:none !important}
/* ---------- hovedmeny ---------- */
.menu{display:grid;gap:10px;padding:6px 0 0}
.menu .mlede{margin:0 0 16px;max-width:var(--measure);color:var(--chalk-dim);font-size:1.02rem}
.menu .share{display:inline-flex;justify-self:start;width:auto;align-items:center;gap:9px;margin:18px 0 0;padding:11px 18px;min-height:44px;
  border:1px solid var(--rule);border-radius:999px;background:transparent;color:var(--chalk);
  font:600 .95rem/1 var(--display);cursor:pointer}
.menu .share:hover,.menu .share:focus-visible{border-color:var(--gold);outline:none}
.menu .share svg{width:18px;height:18px;flex:none}
.plate{display:grid;grid-template-columns:5px 1fr 30px;align-items:center;gap:0 18px;
  width:100%;text-align:start;font:inherit;color:inherit;background:var(--ink-deep);
  border:1px solid var(--rule);border-radius:16px;padding:0;overflow:hidden;cursor:pointer;
  transition:border-color .18s ease,box-shadow .18s ease,transform .12s ease}
.plate > .stripe{align-self:stretch;min-height:94px;background:var(--rule)}
.plate > .bd{padding:19px 0}
.plate > .go{justify-self:end;margin-inline-end:18px;width:10px;height:10px;
  color:var(--gold-soft);transition:transform .18s ease}
/* Tegnet, ikke et tegn: Nastaliq tegner U+203A som en parentes. */
.plate > .go::before{content:"";display:block;width:8px;height:8px;
  border-top:2px solid currentColor;border-right:2px solid currentColor;transform:rotate(45deg)}
[dir=rtl] .plate > .go{transform:scaleX(-1)}
.plate:hover{border-color:var(--gold-soft);box-shadow:0 6px 22px rgba(163,21,159,.10)}
.plate:hover > .go{transform:translateX(3px)}
[dir=rtl] .plate:hover > .go{transform:scaleX(-1) translateX(3px)}
.plate:active{transform:translateY(1px)}
:root[data-theme="dark"] .plate[data-cat="start"]{border-color:#4A3A5E}
:root[data-theme="dark"] .plate:hover{box-shadow:0 6px 22px rgba(0,0,0,.35)}
.plate .t{display:block;margin:0 0 6px;font-family:var(--display);font-weight:700;
  font-variation-settings:"wdth" 92;font-size:1.2rem;letter-spacing:-.012em;color:var(--chalk)}
.plate .d{display:block;margin:0;color:var(--chalk-dim);font-size:.95rem;line-height:1.52;
  max-width:34rem}
.plate[data-cat="start"]{border-color:#E3C6E2}
.plate[data-cat="start"] .t{font-size:1.32rem}
.plate[data-cat="start"] > .stripe{background:var(--grad-ink)}
/* Hver vei inn har sin farge fra logoen - slik presentasjonene skiller
   kategorier med farge. Kanten er fargen, flaten bare et snev av den. */
.plate[data-cat="tools"]{--cat:#0B7C72}
.plate[data-cat="earn"]{--cat:#A3159F}
.plate[data-cat="learn"]{--cat:#C99A00}
.plate[data-cat="faq"]{--cat:#1B4FD8}
.plate[data-cat="ib"]{--cat:#5B3FD1}
.plate[data-cat]:not([data-cat="start"]) > .stripe{background:var(--cat)}
:root:not([data-theme="dark"]) .plate[data-cat]:not([data-cat="start"]){
  background:color-mix(in srgb, var(--cat) 6%, #FFFFFF);border-color:color-mix(in srgb, var(--cat) 22%, #FFFFFF)}
:root[data-theme="dark"] .plate[data-cat="tools"]{--cat:#2FE0CC}
:root[data-theme="dark"] .plate[data-cat="earn"]{--cat:#E04DDE}
:root[data-theme="dark"] .plate[data-cat="learn"]{--cat:#FBE16B}
:root[data-theme="dark"] .plate[data-cat="faq"]{--cat:#5B8BFF}
:root[data-theme="dark"] .plate[data-cat="calc"]{--cat:#E04DDE}
:root[data-theme="dark"] .plate[data-cat="ib"]{--cat:#A99BFF}
.plate[data-cat="learn"] > .stripe{background:var(--gold)}
.plate[data-cat="earn"]  > .stripe{background:var(--gold-metal)}
.plate[data-cat="tools"] > .stripe{background:var(--edge-ui)}
html[data-font="deva"] .plate .t,html[data-font="nastaliq"] .plate .t,
html[data-font="naskh"] .plate .t{font-family:var(--face);letter-spacing:0}
/* Framdrift paa foerste plate. Ekte tall fra stegene som er huket av,
   ikke pynt - den er grunnen til aa komme tilbake. */
.plate .pg{display:flex;align-items:center;gap:9px;margin-top:11px;font-size:.85rem;
  color:var(--gold-soft);font-variant-numeric:tabular-nums}
.plate .pg i{display:block;flex:0 0 80px;height:4px;border-radius:2px;background:var(--rule)}
.plate .pg i > b{display:block;height:100%;border-radius:2px;background:var(--gold)}
/* ---------- opptak ---------- */
.clipf,.clip{display:block;margin:14px 0 0;aspect-ratio:720/1558;height:min(62vh,520px);
  width:auto;max-width:100%;border-radius:14px;border:1px solid var(--rule);background:#000}
.clipf{position:relative;padding:0;overflow:hidden;cursor:pointer}
.clipf img{display:block;width:100%;height:100%;object-fit:cover;opacity:.55}
.clipf .play{position:absolute;inset-inline:10px;bottom:12px;display:flex;align-items:center;
  gap:10px;padding:11px 14px;border-radius:999px;background:rgba(8,8,11,.86);color:#F4F2F7;
  font:600 .9rem/1.3 var(--face);text-align:start}
.clipf .play::before{content:"";flex:0 0 0;border-style:solid;border-width:7px 0 7px 12px;
  border-color:transparent transparent transparent #FBE16B}
[dir=rtl] .clipf .play::before{border-width:7px 12px 7px 0;border-color:transparent #FBE16B transparent transparent}
.clipf:hover img{opacity:.7}
/* ---------- avkryssing ---------- */
.markd{display:flex;align-items:center;gap:10px;margin:14px 0 0;padding:11px 16px;
  min-height:46px;width:100%;max-width:22rem;background:none;font:inherit;font-weight:600;
  color:var(--chalk);border:1.5px dashed var(--edge-ui);border-radius:10px;cursor:pointer;
  text-align:start;transition:background .15s,border-color .15s}
.markd::before{content:"";flex:0 0 20px;height:20px;border-radius:5px;
  border:2px solid var(--edge-ui);box-sizing:border-box}
.markd:hover{border-color:var(--gold-soft)}
.markd[aria-pressed="true"]{border-style:solid;border-color:var(--gold-metal);
  color:var(--chalk-dim);font-weight:500}
.markd[aria-pressed="true"]::before{content:"\2713";display:grid;place-items:center;
  background:var(--gold-metal);border-color:var(--gold-metal);color:#0C1118;font-size:.8rem;font-weight:800}
.progn{flex-basis:100%;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.progn .alld{color:var(--chalk);font-family:var(--face);font-size:.95rem;font-weight:600}
.nextb{background:none;border:1px solid var(--rule);border-radius:999px;padding:7px 14px;
  font:inherit;font-family:var(--face);font-size:.88rem;color:var(--gold-soft);cursor:pointer}
.nextb:hover{border-color:var(--gold-soft)}
.guide > li{scroll-margin-top:70px}
.guide > li.folded:not(.open) > :not(.tick):not(h3){display:none}
.guide > li.folded{padding-bottom:18px}
.guide > li.folded > h3{cursor:pointer;display:flex;align-items:center;gap:10px;margin:0;min-height:40px}
.guide > li.folded > h3::after{content:"";width:8px;height:8px;border-right:2px solid var(--chalk-dim);border-bottom:2px solid var(--chalk-dim);
  transform:rotate(45deg);margin-inline-start:auto;margin-inline-end:6px;transition:transform .15s}
.guide > li.folded.open > h3::after{transform:rotate(-135deg)}
.guide > li.folded > h3:focus-visible{outline:2px solid var(--gold-soft);outline-offset:2px;border-radius:6px}
.guide > li.folded:not(.done) > h3{color:var(--chalk-dim)}
.guide > li.current > h3{font-size:1.15rem}
.guide .stuck{display:inline-flex;align-items:center;min-height:36px;margin:10px 0 0;color:var(--gold-soft);font-size:.9rem;text-decoration:none}
.guide .stuck:hover,.guide .stuck:focus-visible{text-decoration:underline;text-underline-offset:3px}
/* ---------- apper ---------- */
.appc{background:var(--ink-deep);border:1px solid var(--rule);border-radius:14px;
  padding:18px 18px 18px;margin:0 0 12px}
.appc h3{margin:0 0 6px;font-family:var(--display);font-size:1.12rem;color:var(--chalk)}
html[data-font="nastaliq"] .appc h3,html[data-font="naskh"] .appc h3,
html[data-font="deva"] .appc h3{font-family:Montserrat,system-ui,sans-serif}
.appc p{margin:0;color:var(--chalk-dim)}
.appc .ah{display:flex;align-items:center;gap:13px;margin:0 0 10px}
.appc .ah h3{margin:0}
.appc .ah img{flex:0 0 48px;width:48px;height:48px;border-radius:11px;
  box-shadow:0 0 0 1px rgba(20,16,28,.08)}
.stepapps{margin:14px 0 0}
.stepapps .appc{margin:0 0 10px}
/* ---------- kalkulator ---------- */
.calc{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin:0 0 16px;max-width:var(--measure)}
.cin{display:grid;gap:6px;font-size:.86rem;color:var(--chalk-dim);flex:1 1 150px}
.cin input{font:700 1.2rem/1.2 var(--display);padding:11px 14px;border-radius:10px;border:1px solid var(--edge-ui);
  background:var(--ink-deep);color:var(--chalk);width:100%;font-variant-numeric:tabular-nums}
.cper{display:flex;flex-wrap:wrap;gap:6px}
.cper button{font:inherit;font-size:.86rem;padding:9px 12px;border-radius:999px;border:1px solid var(--rule);
  background:none;color:var(--chalk-dim);cursor:pointer}
.cper button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#fff}
.cbig{display:grid;gap:4px;background:var(--ink-deep);border:1px solid var(--rule);border-radius:14px;
  padding:14px 16px;margin:0 0 12px;max-width:var(--measure)}
.cbig span{font-size:.86rem;color:var(--chalk-dim)}
.cbig strong{font:800 1.7rem/1.1 var(--display);color:var(--chalk);font-variant-numeric:tabular-nums}
.cbig small{font-size:.84rem;color:var(--chalk-dim)}
.bnl{display:grid;gap:10px;max-width:var(--measure)}
.bnl article{background:var(--ink-deep);border:1px solid var(--rule);border-radius:12px;padding:12px 14px}
.bnl h3{margin:0 0 6px;font-size:1rem;line-height:1.3}
.bnl p{margin:4px 0 0;font-size:.92rem;line-height:1.55}
.bnl p b{display:block;font-size:.78rem;font-weight:600;color:var(--chalk-dim)}
/* Fra partnerens presentasjoner: store tall med skillelinje (12x | 24x),
   og kolonnekort med fargede faner. Formen er
   deres, fargene er Aimpires (logoens fire). */
.vs{background:var(--ink-deep);border:1px solid var(--rule);border-radius:14px;padding:16px 16px 12px}
.vs h3{margin:0 0 4px}
.vsnum{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;margin:4px 0 12px}
.vsnum span{font:800 clamp(2.8rem,13vw,3.8rem)/1 var(--display);letter-spacing:-.02em;
  -webkit-background-clip:text;background-clip:text;color:transparent}
.vsnum span:first-child{background-image:linear-gradient(180deg,#1B4FD8 0%,#15D8C4 100%)}
.vsnum span:last-child{background-image:linear-gradient(180deg,#C21FBF 0%,#FBE16B 100%)}
:root:not([data-theme="dark"]) .vsnum span:last-child{background-image:linear-gradient(180deg,#A3159F 0%,#D98E04 100%)}
.vsnum i{display:block;width:0;height:58px;border-inline-start:2px dashed var(--edge-ui)}
.amp li.vs{border-inline-start:1px solid var(--rule)}
.vsrow{display:grid;grid-template-columns:1fr 1fr;gap:2px 0;padding:9px 0;border-top:1px solid var(--rule)}
.vsrow > span{grid-column:1 / -1;font-size:.84rem;color:var(--chalk-dim)}
.vsrow > b{text-align:center;font:700 1.02rem/1.3 var(--display);font-variant-numeric:tabular-nums;color:var(--chalk)}
.vs .vsnote{margin:10px 0 0;font-size:.86rem;color:var(--chalk-dim)}
/* Bank, fond eller Sonic (#founder 15.10): avkastning og risiko paa samme rad. */
.alt{margin:22px 0 6px;background:var(--ink-deep);border:1px solid var(--rule);border-radius:14px;padding:16px 14px 12px}
.alt h3{margin:0 0 4px}
.alt > p.lede{margin:0 0 12px;font-size:.95rem}
.alth,.altrow{display:grid;grid-template-columns:repeat(3,1fr);gap:0 8px}
.alth b{font:800 .8rem/1.2 var(--display);text-align:center;padding:6px 2px;border-radius:999px;border:1px solid var(--edge-ui)}
.alth b:last-child{border-color:transparent;background:var(--grad-ink);color:#fff}
.altrow{padding:10px 0 9px;border-top:1px solid var(--rule)}
.altrow > span{grid-column:1 / -1;font-size:.82rem;color:var(--chalk-dim);margin-bottom:4px}
.altrow > b{font:600 .9rem/1.3 var(--face);text-align:center;color:var(--chalk);overflow-wrap:anywhere}
.altrow > b:last-child{font-weight:800}
.alt .vsnote{margin:8px 0 0;font-size:.8rem;color:var(--chalk-dim)}
.alt .disc{margin:10px 0 0;font-size:.82rem;color:var(--chalk);border-top:1px solid var(--rule);padding-top:10px}
.bnl article{padding:0;overflow:hidden}
.bnl article h3{margin:0;padding:10px 14px;background:var(--tab);color:#fff;font-size:.98rem}
.bnl article p{padding:0 14px}
.bnl article p:last-child{padding-bottom:13px}
.bnl article:nth-child(4n+1){--tab:#1B4FD8}
.bnl article:nth-child(4n+2){--tab:#0B7C72}
.bnl article:nth-child(4n+3){--tab:#A3159F}
.bnl article:nth-child(4n+4){--tab:#FBE16B}
.bnl article:nth-child(4n+4) h3{color:#14101C}
html[data-font="nastaliq"] .bnl p{line-height:2.05}
html[data-font="nastaliq"] .bnl p b{margin:0 0 2px;line-height:1.9}
html[data-font="nastaliq"] .vsrow > span{line-height:1.9}
html[data-font="nastaliq"] .vs .vsnote{line-height:2}
.acts{margin:6px 0 0;padding:0;list-style:none;max-width:var(--measure)}
.acts li{position:relative;padding-inline-start:18px;margin:6px 0;line-height:1.55}
.acts li::before{content:"";position:absolute;inset-inline-start:3px;top:.6em;width:7px;height:7px;border-radius:50%;background:var(--gold)}
.acts.vnote li::before{background:var(--ember)}
/* Delhaker erstatter kulepunktet: haken ER markoeren. */
.acts.subs > li{padding-inline-start:0}
.acts.subs > li::before{content:none}
/* Kort sjekk: to valg, og forklaringen kommer uansett hva man svarer. */
/* Foldet avsnitt: overskriften er knappen, og pilen sier at det er mer. */
/* Fagord i teksten: en stiplet strek sier at det finnes en forklaring. */
.ordb{display:inline;padding:0;border:0;background:none;color:inherit;font:inherit;
  cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px;
  text-decoration-color:var(--gold-soft)}
.ordb:hover,.ordb:focus-visible{color:var(--gold-soft)}
.fold > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;
  min-height:44px;margin:0 -4px;padding:0 4px}
.fold > summary::-webkit-details-marker{display:none}
.fold > summary h3{margin:0;flex:1 1 auto}
.fold > summary::after{content:"";flex:0 0 auto;width:9px;height:9px;margin-inline-end:2px;
  border-inline-end:2px solid var(--gold-soft);border-block-end:2px solid var(--gold-soft);
  transform:rotate(45deg);transition:transform .15s ease}
.fold[open] > summary::after{transform:rotate(-135deg)}
.fold > p{margin-top:8px}
.qz{margin:14px 0 0;padding:13px 14px;border:1px solid var(--rule);border-radius:12px;
  background:var(--ink-deep);max-width:var(--measure)}
.qzt{display:block;font:800 .76rem/1 var(--display);letter-spacing:.08em;
  text-transform:uppercase;color:var(--gold-soft);margin-bottom:7px}
.qz > p{margin:0 0 11px}
.qzb{display:block;width:100%;min-height:44px;margin:7px 0 0;padding:10px 14px;
  border:1px solid var(--edge-ui);border-radius:10px;background:transparent;
  color:var(--chalk);font:600 .95rem/1.35 var(--face);text-align:start;cursor:pointer}
.qzb[aria-pressed="true"]{border-color:var(--gold-metal);background:var(--ink-raise)}
.qzb:disabled{cursor:default;opacity:.85}
.qzw{margin:12px 0 0;font-size:.9rem;color:var(--chalk-dim);
  border-top:1px solid var(--rule);padding-top:10px}
html[data-font="nastaliq"] .acts li{line-height:2.05}
html[data-font="nastaliq"] .acts li::before{top:.95em}
.p2p{margin:14px 0 0;max-width:var(--measure);border:1px solid var(--rule);border-radius:12px;background:var(--ink-deep);padding:0 14px}
.p2p summary{cursor:pointer;padding:12px 0;font-weight:700;color:var(--chalk)}
.p2p p{margin:0 0 10px}
.p2p .p2pv{display:inline-block;margin:0 0 10px;padding:9px 14px;border-radius:999px;background:var(--gold);color:#fff;text-decoration:none;font-weight:600}
.p2p ol{margin:0 0 12px;padding-inline-start:20px}
.p2p ol > li{margin:10px 0}
.p2p h4{margin:0 0 4px;font-size:.98rem}
.p2p ul{margin:0;padding-inline-start:18px}
.p2p ul li{margin:4px 0;line-height:1.55}
html[data-font="nastaliq"] .p2p ul li, html[data-font="nastaliq"] .p2p p{line-height:2.05}
/* Hopp-knapper, glidebryter, hurtigvalg og kostnadsstolpe */
/* Founder 17.10: ingen avklippede faner paa mobil - raden bryter til to linjer
   i stedet for aa gjemme «Withdrawals» bak kanten. */
.jump{display:flex;flex-wrap:wrap;gap:6px;padding:8px 0 2px;margin:0}
.jump::-webkit-scrollbar{display:none}
.jump button{flex:0 0 auto;font:600 .82rem/1 var(--face);padding:8px 14px;min-height:40px;border-radius:999px;border:1px solid var(--rule);
  background:var(--ink-deep);color:var(--chalk);cursor:pointer;white-space:nowrap}
.jump button:hover,.jump button:focus-visible{border-color:var(--gold);color:var(--chalk)}
.rs-pick{margin:6px 0 0;font:700 .92rem/1.3 ui-monospace,monospace;color:var(--gold-soft);
  letter-spacing:.02em;font-variant-numeric:tabular-nums}
.sec{scroll-margin-top:120px}
/* Soeket hopper rett til svaret: ogsaa enkeltelementer maa ha luft til den
   klebrige topplinja, ellers gjemmer svaret seg bak den (founder 17.10). */
#guide > li,.qa,.learn > details,.rail > li,[id^="earn-"]{scroll-margin-top:118px}
.cslide{flex:1 1 100%;width:100%;accent-color:var(--gold);margin:2px 0}
.cpre{display:flex;flex-wrap:wrap;gap:6px;flex:1 1 100%}
.cpre button{font:600 .86rem/1 var(--display);padding:8px 13px;min-height:40px;border-radius:999px;border:1px solid var(--edge-ui);background:transparent;color:var(--chalk);cursor:pointer;font-variant-numeric:tabular-nums}
.cpre button:hover{border-style:solid;border-color:var(--gold)}
.cbar{display:flex;height:14px;border-radius:999px;overflow:hidden;margin:12px 0 0;max-width:var(--measure);background:var(--rule)}
.cbar i{display:block;height:100%;transition:width .25s ease}
.cbar .k{background:linear-gradient(90deg,#1B4FD8,#15D8C4)}
.cbar .fx{background:repeating-linear-gradient(45deg,#15D8C4 0 4px,rgba(21,216,196,.35) 4px 8px)}
.cbar .f{background:#C21FBF}
.cbar .c{background:#FBE16B}
.ctab dt::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-inline-end:7px;vertical-align:middle;background:transparent}
.ctab dt:nth-of-type(2)::before{background:#FBE16B}
.ctab dt:nth-of-type(3)::before{background:#C21FBF}
.ctab dt:nth-of-type(4)::before{background:linear-gradient(90deg,#1B4FD8,#15D8C4)}
.plate[data-cat="calc"]{--cat:#A3159F}
.plate[data-cat="calc"] > .stripe{background:var(--cat)}
@media (prefers-reduced-motion:reduce){.cbar i{transition:none}}
/* Inntekt delt i faner: bare én del om gangen, så det ikke blir for mye på én gang. */
.shell[data-view="earn"][data-tab="sonic"]    .sec[data-tab]:not([data-tab="sonic"]),
.shell[data-view="earn"][data-tab="results"]  .sec[data-tab]:not([data-tab="results"]),
.shell[data-view="earn"][data-tab="calc"]     .sec[data-tab]:not([data-tab="calc"]),
.shell[data-view="earn"][data-tab="withdraw"] .sec[data-tab]:not([data-tab="withdraw"]),
.shell[data-view="earn"][data-tab="ib"]       .sec[data-tab]:not([data-tab="ib"]){display:none}
.jump button[aria-selected="true"]{background:var(--gold);border-color:var(--gold);color:#fff}
.ctab{display:grid;grid-template-columns:1fr auto;gap:6px 16px;margin:12px 0 0;max-width:var(--measure);font-size:.92rem}
.ctab dt{color:var(--chalk-dim)}
.ctab dd{margin:0;text-align:end;font-variant-numeric:tabular-nums;color:var(--chalk)}
.ctab dt:last-of-type,.ctab dd:last-of-type{font-weight:700;color:var(--chalk);border-top:1px solid var(--rule);padding-top:6px}
.crisk{border:1px solid var(--ember);border-radius:14px;padding:12px 16px;margin:0 0 12px;max-width:var(--measure)}
.crisk h3{margin:0 0 8px;font-size:1rem;color:var(--ember)}
.crisk ul{margin:0;padding-inline-start:18px;color:var(--chalk)}
.crisk li{margin:0 0 6px}
/* ---------- resultater ---------- */
.rsfig{max-width:var(--measure);margin:6px 0 4px}
.rsfig svg{display:block;width:100%;height:auto}
.rsleg{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:.86rem;color:var(--chalk-dim);margin:0 0 16px}
.rsleg i{display:inline-block;width:12px;height:12px;border-radius:3px}
.rsleg span{margin-inline-end:12px}
.rsstat{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin:0 0 18px;max-width:var(--measure)}
.rsstat div{background:var(--ink-deep);border:1px solid var(--rule);border-radius:10px;padding:10px 12px}
.rsstat dt{font-size:.78rem;color:var(--chalk-dim);margin:0 0 3px}
.rsstat dd{margin:0;font:700 1.08rem/1.2 var(--display);color:var(--chalk);font-variant-numeric:tabular-nums}
.rsnotes{max-width:var(--measure);margin:0 0 14px;padding-inline-start:18px;color:var(--chalk-dim)}
.rsnotes li{margin:0 0 8px}
.rstab{max-width:var(--measure);margin:12px 0 0}
.rstab summary{cursor:pointer;color:var(--gold-soft);font-weight:600}
.rstab table{width:100%;border-collapse:collapse;margin:10px 0 0;font-size:.86rem;font-variant-numeric:tabular-nums}
.rstab th,.rstab td{padding:5px 8px;border-bottom:1px solid var(--rule);text-align:end}
.rstab th:first-child,.rstab td:first-child{text-align:start}
.rsrc{font-size:.88rem;color:var(--chalk-dim)}
.rsrc a{color:var(--gold-soft);font-weight:600}
/* ---------- spoersmaal og svar ---------- */
.faqs{display:block;width:100%;max-width:var(--measure);margin:0 0 16px;padding:13px 16px;
  font:inherit;color:var(--chalk);background:var(--ink-deep);border:1px solid var(--edge-ui);
  border-radius:12px}
.faqs::placeholder{color:var(--chalk-dim)}
.faql{max-width:var(--measure)}
.qa{border:1px solid var(--rule);border-radius:12px;background:var(--ink-deep);margin:0 0 8px}
.qa[hidden]{display:none}
.qa summary{list-style:none;cursor:pointer;padding:15px 44px 15px 16px;position:relative;
  font-weight:600;color:var(--chalk);line-height:1.45}
[dir=rtl] .qa summary{padding:15px 16px 15px 44px}
.qa summary::-webkit-details-marker{display:none}
.qa summary::after{content:"+";position:absolute;inset-inline-end:16px;top:12px;font-size:1.3rem;
  color:var(--gold-soft);font-weight:400}
.qa[open] summary::after{content:"\2212"}
.qa p{margin:0;padding:0 16px 16px;color:var(--chalk-dim)}
html[data-font="nastaliq"] .qa summary{font-weight:400}
/* ---------- tilbake til menyen ---------- */
/* Toppstripa klistrer seg: «Kom i gang» er ni steg langt, veien tilbake skal
   ikke ligge ni steg unna, og hvor langt man er kommet skal alltid synes. */
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;
  justify-content:space-between;margin:14px 0 0;padding:10px 0;background:var(--ink)}
.topbar[hidden]{display:none !important}
.topbar{flex-wrap:wrap;row-gap:4px}
.topbar .jump{flex:1 1 100%;order:3}
.topbar .back{white-space:nowrap}
.minip{display:flex;align-items:center;gap:9px;font-size:.86rem;color:var(--gold-soft);
  font-variant-numeric:tabular-nums;font-weight:700}
.minip i{display:block;width:70px;height:5px;border-radius:3px;background:var(--rule);overflow:hidden}
.minip b{display:block;height:100%;background:var(--gold-metal);transition:width .2s}
.shell:not([data-view="start"]) .minip{display:none}
.back{display:inline-flex;align-items:center;gap:9px;
  margin:0;padding:9px 17px;background:var(--ink);
  border:1px solid var(--rule);border-radius:999px;font:inherit;
  font-size:.94rem;color:var(--gold-soft);cursor:pointer;transition:border-color .18s}
.back:hover{border-color:var(--gold-soft)}
.back::before{content:"\2190";font-size:1.05em}
[dir=rtl] .back::before{content:"\2192"}
@media (prefers-reduced-motion:no-preference){
  .plate{animation:rise .42s cubic-bezier(.2,.7,.3,1) backwards}
  .plate:nth-of-type(2){animation-delay:.05s}
  .plate:nth-of-type(3){animation-delay:.10s}
  .plate:nth-of-type(4){animation-delay:.15s}
}

/* ============================================================
   KNAPPESYSTEM OG HIERARKI (16.10). Én signatur: «siktelinja» - merkevarens
   gradient som tynn strek - er det eneste som sier «aktiv/viktig». Tre
   knappenivaaer, én regel for aktive brikker (fylt jet), to fremhevede kort
   paa menyen og resten som liste. Bare CSS + menyens gruppering; ingen tekst.
   ============================================================ */
:root{--aim:var(--grad-ink);--r-card:16px;--r-btn:14px;--r-chip:999px;--r-in:12px}

/* --- Nivaa 1: hovedhandling. Fylt jet, siktelinje under teksten. --- */
.out .apply,.nextb,.joinbtn{
  position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;
  min-height:52px;padding:14px 22px 16px;border:0;border-radius:var(--r-btn);
  background:var(--jet);color:var(--jet-on);font:800 1rem/1.15 var(--display);
  letter-spacing:0;text-decoration:none;cursor:pointer;filter:none;
  transition:transform .12s ease,filter .18s ease}
.out .apply::after,.nextb::after,.joinbtn::after{content:"";position:absolute;inset-inline:18px;bottom:8px;height:2px;
  border-radius:2px;background:var(--aim);opacity:.95}
.out .apply:hover,.nextb:hover,.joinbtn:hover,.joinbtn:focus-visible{filter:brightness(1.07)}
.out .apply:active,.nextb:active,.joinbtn:active{transform:scale(.985)}
.out .apply{width:100%;margin-top:14px}
.nextb{width:100%;margin-top:4px}
/* Neste steg paa forsidekortet, og lederens ferdige lenke som tydelig blokk med kopiknapp. */
.plate .nx{display:block;margin-top:7px;font-size:.84rem;font-weight:700;color:var(--gold-soft)}
.out .mylink{display:block;margin:10px 0 2px;padding:12px 14px;border-radius:var(--r-in);
  background:var(--ink-deep);border:1px solid var(--rule);color:var(--chalk);
  font:700 .95rem/1.4 ui-monospace,monospace;word-break:break-all;unicode-bidi:isolate}
.out .copyb{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;
  margin-top:8px;padding:10px 18px;border:1px solid var(--gold-soft);border-radius:var(--r-btn);
  background:transparent;color:var(--chalk);font:800 .92rem/1.15 var(--display);cursor:pointer}
.out .copyb:hover,.out .copyb:focus-visible{border-color:var(--gold);outline:none}
.joinbtn{display:flex;width:100%;margin-top:12px}
:root[data-theme="dark"] .out .apply::after,:root[data-theme="dark"] .nextb::after,:root[data-theme="dark"] .joinbtn::after{opacity:.85}

/* --- Nivaa 2: sekundaer. Omriss, samme hoeyde og radius, aldri understrek. --- */
.back,.menu .share,#notice-none .dlink,#spon .dlink{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  min-height:46px;padding:11px 18px;border:1px solid var(--edge-ui);border-radius:var(--r-btn);
  background:transparent;color:var(--chalk);font:700 .95rem/1.15 var(--display);
  text-decoration:none;cursor:pointer;transition:border-color .18s ease,transform .12s ease}
.back:hover,.menu .share:hover,#notice-none .dlink:hover,#spon .dlink:hover,
.back:focus-visible,.menu .share:focus-visible,#notice-none .dlink:focus-visible,#spon .dlink:focus-visible{border-color:var(--gold-soft);outline:none}
.back:active,.menu .share:active,#notice-none .dlink:active,#spon .dlink:active{transform:scale(.985)}
#spon .dlink{margin-top:8px}
/* Founder 17.10: lenke-knappene saa «hvite og doede» ut. Full bredde, gullkant,
   fast retningspil - samme hoeyde og radius som resten av knappene. */
#spon .dlink,.ib .dlink{display:flex;width:100%;min-height:48px;
  border:1.5px solid transparent;border-radius:var(--r-btn);font-weight:800;
  background:linear-gradient(var(--ink),var(--ink)) padding-box,var(--grad) border-box}
/* Forsidekortet (founder 17.10 03:26): egen-lenke er en LITEN pille her - hovedplassen
   er under IB og bonuser. Kortet skal ikke rope; det peker. */
#notice-none .dlink{display:inline-flex;width:auto;min-height:28px;margin-top:10px;
  padding:3px 10px;border:1px solid var(--rule);border-radius:999px;font:700 .72rem/1.15 var(--display);
  background:transparent;color:var(--chalk-dim)}
#notice-none .dlink:hover,#notice-none .dlink:focus-visible{border-color:var(--gold-soft);color:var(--chalk);filter:none}
#notice-none .slab.reg#nn-own{margin-top:10px}
#spon .dlink:hover,#notice-none .dlink:hover,.ib .dlink:hover,
#spon .dlink:focus-visible,#notice-none .dlink:focus-visible,.ib .dlink:focus-visible{
  filter:brightness(1.18);border-color:transparent}
#spon .dlink::after,#notice-none .dlink::after,.ib .dlink::after{content:"\203A";
  color:var(--gold-soft);font-size:1.2em;font-weight:800;line-height:1}
html[dir="rtl"] #spon .dlink::after,html[dir="rtl"] #notice-none .dlink::after,
html[dir="rtl"] .ib .dlink::after{content:"\2039"}
/* «Min egen lenke»: kompakt pille med gradientkant - merkets signatur, ikke en graa strek
   (founder 17.10 02:35). Fyllet foelger sideflaten i begge tema. */
/* Bitteliten og diskret, ytterst til hoeyre paa navneraden (founder 17.10 03:36). */
#spon .dlink.tiny,.spon .dlink.tiny{display:inline-flex;align-items:center;width:auto;min-height:28px;
  margin:0 0 0 auto;margin-inline-start:auto;margin-inline-end:0;align-self:center;
  padding:3px 10px;border:1px solid var(--rule);border-radius:999px;background:transparent;
  color:var(--chalk-dim);font:700 .72rem/1.15 var(--display);text-decoration:none}
#spon .dlink.tiny::after{content:"\203A";margin-inline-start:5px;color:var(--chalk-dim);font-size:1em}
html[dir="rtl"] #spon .dlink.tiny::after{content:"\2039"}
#spon .dlink.tiny:hover,#spon .dlink.tiny:focus-visible{border-color:var(--gold-soft);color:var(--chalk);filter:none}
.back{min-height:40px;padding:8px 14px;font-size:.9rem;border-color:var(--rule)}
.menu .share{margin-top:16px;padding-inline:18px 20px}
.ldlink{display:inline-flex;min-height:36px;margin:4px 0;padding:6px 12px;font-size:.9rem}

/* --- Nivaa 3: tekstknapp. Farge, ingen strek foer hover. --- */
.prog button,.ordb{color:var(--gold-soft);text-decoration:none;font-family:var(--face)}
.prog button:hover,.prog button:focus-visible{text-decoration:underline;text-underline-offset:3px}

/* --- Brikker: spraak, faner, perioder, beloep. Aktiv = fylt jet. Én regel. --- */
.switch button,.jump button,.cper button,.cpre button,.langs a{
  min-height:40px;padding:8px 14px;border:1px solid var(--rule);border-radius:var(--r-chip);
  background:transparent;color:var(--chalk);font:700 .84rem/1 var(--display);cursor:pointer;
  transition:border-color .15s ease,background-color .15s ease}
.switch button{background:var(--ink-deep);padding:8px clamp(6px,2vw,14px)}
.switch{gap:3px}
/* Skriftvalget (Roman Urdu / اردو) foelger samme brikkeregel: aktiv = fylt jet. */
.script button{min-height:40px;border:1px solid var(--rule);background:transparent;color:var(--chalk)}
.script button[aria-pressed="true"]{background:var(--jet);border-color:var(--jet);color:var(--jet-on)}
.script button:hover,.script button:focus-visible{border-color:var(--gold-soft);outline:none}
/* Spraakraden maa aldri skyve siden sidelengs (maalt 16.10: 13 px i engelsk, 37 px i
   urdu paa 390 px). Blir den for bred, ruller den innenfor seg selv. */
.switch{max-width:100%;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.switch::-webkit-scrollbar{display:none}
.cpre button{border-style:solid;color:var(--chalk-dim)}
.switch button:hover,.jump button:hover,.cper button:hover,.cpre button:hover,.langs a:hover,
.switch button:focus-visible,.jump button:focus-visible,.cper button:focus-visible,.cpre button:focus-visible{border-color:var(--gold-soft);outline:none}
.switch button[aria-pressed="true"],.jump button[aria-selected="true"],.cper button[aria-pressed="true"],.cpre button[aria-pressed="true"]{
  background:var(--jet);border-color:var(--jet);color:var(--jet-on);box-shadow:none}
.switch .thm{border-style:dashed;color:var(--chalk-dim)}
.jump{padding:10px 0 4px}

/* --- Fokus for alle som bruker tastatur/skjermleser. --- */
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--gold-soft);outline-offset:2px}

/* --- Framdrift i guiden: ikke konsoll-tekst. Linje, stolpe, hovedknapp. --- */
.prog{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px 14px;margin:0 0 22px;
  font-family:var(--face);font-size:.9rem;color:var(--chalk-dim)}
#prog-t{grid-area:1/1;color:var(--chalk);font-weight:600}
#prog-r{grid-area:1/2;justify-self:end;font-size:.84rem}
.prog .bar{grid-area:2/1/3/3;height:5px;border-radius:999px}
.prog .bar i{background:var(--aim)}
.progn{grid-area:3/1/4/3;display:block}
.progn .alld{display:block;margin:0 0 8px}

/* --- Klebefeltet: hårstrek under, saa det har en kant naar det ligger over tekst. --- */
.topbar{box-shadow:0 1px 0 var(--rule)}

/* --- Varselboksen (ingen sponsor): rolig flate med siktelinje oeverst, ikke tykk marg. --- */
.notice{position:relative;overflow:hidden;border:1px solid var(--rule);border-radius:var(--r-card);
  border-inline-start:1px solid var(--rule)}
.notice::before{content:"";position:absolute;inset-inline:0;top:0;height:3px;background:var(--aim)}
.notice.alert{border-color:var(--ember)}
.notice.alert::before{background:var(--ember)}

/* --- Menyen: to fremhevede kort, resten som liste. Ingen regnbuestriper. --- */
.menu{gap:12px}
.plate{grid-template-columns:1fr 24px;gap:0 14px;padding:0 20px;border-radius:var(--r-card);position:relative}
.plate > .stripe{display:none}
.plate > .bd{padding:20px 0}
.plate > .go{margin-inline-end:0;color:var(--chalk-dim)}
.plate[data-cat]{--cat:transparent;background:var(--ink-deep);border-color:var(--rule)}
:root:not([data-theme="dark"]) .plate[data-cat]:not([data-cat="start"]){background:var(--ink-deep);border-color:var(--rule)}
.plate.feat{overflow:hidden}
.plate.feat::before{content:"";position:absolute;inset-inline:0;top:0;height:3px;background:var(--aim)}
.plate.feat .t{font-size:1.32rem}
.plate.feat > .go{color:var(--chalk)}
.plate[data-cat="start"]{border-color:var(--rule)}
:root[data-theme="dark"] .plate[data-cat="start"]{border-color:var(--rule)}
.plate:hover{border-color:var(--edge-ui);box-shadow:none}
.plate.feat:hover{border-color:var(--gold-soft)}
.mlist{display:grid;gap:0;border:1px solid var(--rule);border-radius:var(--r-card);overflow:hidden;background:var(--ink-deep)}
.mlist .plate{border:0;border-radius:0;background:transparent}
.mlist .plate + .plate{border-top:1px solid var(--rule)}
.mlist .plate > .bd{padding:15px 0}
.mlist .plate .t{font-size:1.06rem;margin-bottom:3px}
.mlist .plate .d{font-size:.9rem;line-height:1.45}
.mlist .plate:hover{background:var(--ink-raise)}
.plate .pg i > b{background:var(--aim)}

/* Lista er ikke direkte barn av menyen, saa inntoningen treffer den ikke - vis den rett. */
.mlist .plate{opacity:1;animation:none;transform:none}
/* .prog button slaar .nextb paa spesifisitet - hovedknappen maa vinne. */
.prog .nextb{background:var(--jet);color:var(--jet-on);border:0;padding:14px 22px 16px;min-height:52px;
  border-radius:var(--r-btn);font:800 1rem/1.15 var(--display);text-decoration:none}
.prog .nextb:hover,.prog .nextb:focus-visible{text-decoration:none;filter:brightness(1.07)}
html[data-font="nastaliq"] .prog .nextb,html[data-font="naskh"] .prog .nextb,html[data-font="deva"] .prog .nextb{font-family:var(--face);line-height:1.6}

/* --- Soek i hele guiden (founder 16.10): ett felt oeverst paa forsiden, treff hopper dit. --- */
/* Soeket bor bak et lupe-ikon i toppraden (founder 16.10: feltet midt paa
   forsiden var stygt og feilplassert). Ikonet aapner et ark over siden, fra
   alle visninger; feltet faar fokus med en gang. */
.mast .sbtn{order:2;margin:0 0 12px auto;padding:0;width:40px;height:40px;flex:0 0 auto;
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;
  background:var(--ink-deep);border:1px solid var(--rule);border-radius:999px;color:var(--chalk-dim)}
.mast .switch{order:3}
.mast .sbtn svg{width:18px;height:18px}
.mast .sbtn:hover,.mast .sbtn:focus-visible{color:var(--chalk);border-color:var(--gold-metal)}
/* Bred skjerm: alt paa én linje - spraakene skyves til hoeyre, lupa ytterst. */
@media (min-width:700px){
  .mast .switch{order:2;margin-inline-start:auto}
  .mast .sbtn{order:3;margin:0 0 8px 0}}
.sheet{position:fixed;top:0;right:0;bottom:0;left:0;inset:0;z-index:60;overflow:auto;background:var(--ink);
  padding:max(14px,env(safe-area-inset-top)) 16px 28px}
@supports (background:color-mix(in srgb,red 50%,transparent)){
  .sheet{background:color-mix(in srgb,var(--ink) 86%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}}
.sheet[hidden]{display:none}
.sheet-in{max-width:var(--measure);margin:0 auto}
.qbar{display:flex;align-items:center;gap:8px;background:var(--ink-deep);border:1px solid var(--rule);
  border-radius:var(--r-btn);padding:4px 6px 4px 14px}
.qbar .qi{width:20px;height:20px;color:var(--chalk-dim);flex:0 0 auto}
.qbar input{flex:1 1 auto;min-width:0;background:transparent;border:0;color:var(--chalk);font:inherit;
  font-size:16px;padding:12px 0;outline:none}
.qbar input::-webkit-search-cancel-button{display:none}
.qbar .qx{flex:0 0 auto;width:40px;height:40px;border:0;border-radius:999px;background:transparent;
  color:var(--chalk-dim);font:inherit;font-size:16px;cursor:pointer}
.qbar .qx:hover,.qbar .qx:focus-visible{background:var(--ink-raise);color:var(--chalk);outline:none}
body.q-open{overflow:hidden}
.qout{margin-top:10px;border:1px solid var(--rule);border-radius:var(--r-card);background:var(--ink-deep);overflow:hidden}
.qres{display:block;width:100%;text-align:start;padding:12px 14px;border:0;border-top:1px solid var(--rule);background:transparent;color:var(--chalk);font:inherit;cursor:pointer}
.qres:first-child{border-top:0}
.qres:hover,.qres:focus-visible{background:var(--ink-raise);outline:none}
.qres b{display:block;font-family:var(--display);font-size:.98rem}
.qres span{display:block;color:var(--chalk-dim);font-size:.88rem;line-height:1.45;margin-top:2px}
.qres small{display:block;color:var(--gold-soft);font-size:.78rem;margin-top:4px}
.qnone{padding:12px 14px;color:var(--chalk-dim);font-size:.9rem}
html[data-font="nastaliq"] .qres b,html[data-font="naskh"] .qres b,html[data-font="deva"] .qres b{font-family:var(--face)}

/* --- «Ha Aimpire paa telefonen»: liten, rolig rad paa forsiden. --- */
.keep{max-width:var(--measure);margin:14px 0 4px;padding:14px 16px;border:1px solid var(--rule);border-radius:var(--r-card);background:var(--ink-deep)}
.shell:not([data-view="menu"]) .keep{display:none}
.keep-h{display:flex;align-items:center;gap:10px}
.keep-h strong{font-family:var(--display);font-size:1rem}
.keep-x{margin-inline-start:auto;width:32px;height:32px;border:0;border-radius:50%;background:transparent;color:var(--chalk-dim);cursor:pointer;font-size:18px;line-height:1}
.keep-x::before{content:"\00d7"}
.keep-x:hover{color:var(--chalk)}
.keep p{margin:6px 0 0;font-size:.92rem;color:var(--chalk-dim)}
.keep-go{display:inline-flex;align-items:center;justify-content:center;margin-top:10px;min-height:38px;padding:8px 15px;
  border:1.5px solid transparent;border-radius:999px;
  background:linear-gradient(var(--ink-raise),var(--ink-raise)) padding-box,var(--grad) border-box;
  color:var(--chalk);font:750 .88rem/1.15 var(--display);cursor:pointer}
.keep-go:hover,.keep-go:focus-visible{filter:brightness(1.18);outline:none}
.keep-how{margin-top:8px;border:0;background:transparent}
.keep-how > summary{padding:6px 0;font-size:.9rem;color:var(--gold-soft)}
.keep-how p{margin:4px 0 0;font-size:.9rem}
.keep-chrome{display:inline-flex;align-items:center;margin-top:8px;min-height:40px;padding:8px 14px;border:1px solid var(--edge-ui);border-radius:var(--r-btn);color:var(--chalk);text-decoration:none;font:700 .9rem/1.15 var(--display)}
