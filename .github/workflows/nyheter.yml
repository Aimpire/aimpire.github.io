# Henter ukens nyhetskalender (Forex Factory-feed, K-28) én gang i timen og legger
# de viktige nyhetene i data/nyheter.json, saa huben kan vise «neste store nyhet».
# Feeden tillater ikke henting direkte fra nettleseren (ingen CORS), derfor denne jobben.
name: nyheter
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  hent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hent og filtrer
        run: |
          set -e
          curl -fsS --max-time 30 "https://nfs.faireconomy.media/ff_calendar_thisweek.json" -o /tmp/ff.json
          mkdir -p data
          jq '[.[] | select(.impact=="High") | {t:.title, c:.country, d:.date, f:.forecast, p:.previous}] | sort_by(.d)' /tmp/ff.json > data/nyheter.new
          if [ "$(jq length data/nyheter.new)" -gt 0 ]; then mv data/nyheter.new data/nyheter.json; else rm data/nyheter.new; fi
      - name: Lagre hvis endret
        run: |
          git config user.name "Aimpire"
          git config user.email "noreply@aimpire.invalid"
          git add data/nyheter.json
          git diff --cached --quiet || (git commit -m "nyheter: oppdatert kalender" && git push)
