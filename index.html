<script>
/* App-filen (manifest) bygges HER, foer resten av siden (founder 17.10 20:41/20:47):
   iPhone leser den idet man trykker «Legg til paa Hjem-skjerm», og en hjemskjerm-app har
   eget, tomt lager. Paa en lederlenke faar appen derfor startadresse MED ?l=-koden og
   spraaket, saa den aapnes som ekte app (uten adressefelt) og med lederens navn - fra
   Chrome eller Safari, paa iPhone og Android. Kilder: K-106. Adressen faar spraaket lagt til
   av applyLang (replaceState) foer man rekker aa trykke «Legg til». */
(function(){
  try{
    var q = new URLSearchParams(location.search), l = (q.get("l") || "").toLowerCase().replace(/[^a-z0-9]/g, "");
    var m = document.createElement("link"); m.rel = "manifest";
    if(!l){ m.href = "manifest.webmanifest"; document.head.appendChild(m); return; }
    /* Lederlenke: manifestet har INGEN start_url. Da bruker telefonen adressen siden staar paa
       (med ?l= og spraak) som startadresse - W3C appmanifest, K-106. Vanlig https-fil, virker
       paa iPhone og Android, fra Chrome og Safari. */
    m.href = "manifest-leder.webmanifest";
    document.head.appendChild(m);
  }catch(e){}
})();
</script>

<style>
/* Samplet fra founders egne Canva-dokumenter 14.10.2026, ikke oppfunnet:
   kjerneblaa #006EFD, gradient som lysner mot hvitt, svart display-serif.
   Lys er standard - merkevaren er hvit-dominert (31-45 % av pikslene).
   Variabelnavnene er beholdt fra den moerke paletten, saa de ~90
   bruksstedene ikke maatte roeres. Kontrasttall i kommentar per linje. */
:root{
  /* Aimpires egne farger, fra logoen: svart + gradienten blaa -> turkis ->
     magenta -> gul. IKKE AiTech (marine + himmelblaa) og IKKE Tag (lime).
     Lys modus: hvit med farge, ikke graa. Kontrast maalt mot #FFFFFF. */
  --ink:#FBFAFD;            /* sideflate: nesten hvit, et snev fiolett     */
  --ink-deep:#FFFFFF;
  --ink-raise:#FFFFFF;
  --gold:#A3159F;           /* FLATE: knapp, aktiv fane, marg - magenta 10:1 med hvit tekst */
  --gold-soft:#0B7C72;      /* TEKSTaksent: dyp turkis, 5,1:1              */
  --gold-deep:#A3159F;
  --lime:#0F7A4A; --red:#C0392B;
  --chalk:#14101C;          /* broedtekst: 18:1                            */
  --chalk-dim:#4D4858;      /* guidetekst: 8,6:1                           */
  --rule:#E7E2EE;
  --edge-ui:#827C8E;
  --ember:#C24F15;
  --gold-metal:#FBE16B;     /* FLATE: markoerer og stegtall - merke-gult   */
  --on-gold:#14101C;        /* tekst PAA gult, samme i begge temaer: 15:1  */
  --gold-ink:#7A5410;
  --jet:#14101C;
  --jet-on:#FFFFFF;
  --v1:#1B4FD8; --v2:#0E8F86; --v3:#A3159F; --v4:#C99A00;
  --grad:linear-gradient(118deg,#1B4FD8 0%,#15D8C4 33%,#C21FBF 68%,#FBE16B 100%);
  /* Samme familie, men uten de to trinnene som forsvinner paa hvitt:
     #15D8C4 gir 1,9:1 og #FBE16B gir 1,3:1 mot hvit flate. */
  --grad-ink:linear-gradient(110deg,#1B4FD8 0%,#0E8F86 40%,#A3159F 100%);
  --measure:36rem;
  --face:"Montserrat",system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --display:"Archivo","Montserrat",system-ui,sans-serif;
}
:root[data-theme="dark"]{
  --ink:#08080B; --ink-deep:#121217; --ink-raise:#1A1A22;
  --gold:#C21FBF; --gold-soft:#5EE6D6; --gold-deep:#E04DDE;
  --chalk:#F4F2F7; --chalk-dim:#A9A4B5; --rule:#27242F;
  --edge-ui:#6F6A7C; --ember:#F08A4B;
  --v1:#5B8BFF; --v2:#2FE0CC; --v3:#E04DDE; --v4:#FBE16B;
  --gold-metal:#FBE16B; --gold-ink:#FBE16B; --jet:#F4F2F7; --jet-on:#08080B;
  --grad-ink:var(--grad);
}
html[data-font="deva"]{ --face:"Noto Sans Devanagari","Montserrat",sans-serif }
html[data-font="nastaliq"]{ --face:"Noto Nastaliq Urdu","Montserrat",serif }
html[data-font="naskh"]{ --face:"Noto Naskh Arabic","Montserrat",serif }

/* «Himmelen over bruksanvisningen» v2 (founder 17.10 05:21: «hvor er alle de visuelle
   effektene … som skulle bevege seg i bakgrunnen»). v1 skiftet bare fargetone 18° på 14 s
   og fløt kun ved scrolling - målt live: nesten usynlig. v2 er SYNLIG, men like lett:
   - tre fargefelt i merkefargene som driver sakte (22/27/33 s, alternerende) - bare
     transform animeres, hvert felt er ett GPU-lag, ingen filter, ingen blur;
   - en tynn kurslinje som glir som et levende chart (48 s, sømløs løkke) med et
     pulserende punkt. Linja går OPP OG NED og ender flatt: et marked, aldri et
     gevinstløfte (ærlighetsregelen).
   Ingen bilder, ingen JS, ingen ekstra forespørsler. Redusert bevegelse = alt står stille. */
.sky{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;contain:strict}
.sky .orb{position:absolute;border-radius:50%;will-change:transform;transform:translate3d(0,0,0)}
.sky .o1{width:78vmax;height:78vmax;inset-inline-start:-30vmax;top:-34vmax;
  background:radial-gradient(closest-side,rgba(21,216,196,.40),rgba(21,216,196,0))}
.sky .o2{width:64vmax;height:64vmax;inset-inline-end:-26vmax;top:-20vmax;
  background:radial-gradient(closest-side,rgba(194,31,191,.30),rgba(194,31,191,0))}
.sky .o3{width:58vmax;height:58vmax;inset-inline-start:18vw;top:42vh;
  background:radial-gradient(closest-side,rgba(251,225,107,.34),rgba(251,225,107,0))}
:root[data-theme="dark"] .sky .o1{background:radial-gradient(closest-side,rgba(27,79,216,.46),rgba(27,79,216,0))}
:root[data-theme="dark"] .sky .o2{background:radial-gradient(closest-side,rgba(194,31,191,.30),rgba(194,31,191,0))}
:root[data-theme="dark"] .sky .o3{background:radial-gradient(closest-side,rgba(21,216,196,.20),rgba(21,216,196,0))}
.skyline{position:absolute;z-index:-1;pointer-events:none;overflow:hidden;contain:paint;inset-inline:0;top:112px;height:120px;opacity:.55;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 18%,#000 82%,transparent 100%);
          mask-image:linear-gradient(90deg,transparent 0,#000 18%,#000 82%,transparent 100%);
  background:repeating-linear-gradient(180deg,transparent 0 29px,rgba(20,16,28,.07) 29px 30px)}
:root[data-theme="dark"] .skyline{opacity:.7;
  background:repeating-linear-gradient(180deg,transparent 0 29px,rgba(244,242,247,.06) 29px 30px)}
.skyline .tape{position:absolute;inset-block:5px;left:0;width:200%;will-change:transform}
.skyline .tape svg{display:block;width:100%;height:100%;overflow:visible}
.skyline .tape path{fill:none;stroke:url(#skyline);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;
  vector-effect:non-scaling-stroke}
.skyline .tape .area{fill:url(#skyfill);stroke:none}
@keyframes orbA{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(9vw,7vh,0) scale(1.14)}}
@keyframes orbB{from{transform:translate3d(0,0,0) scale(1.06)}to{transform:translate3d(-10vw,9vh,0) scale(.94)}}
@keyframes orbC{from{transform:translate3d(0,0,0) scale(.96)}to{transform:translate3d(-12vw,-8vh,0) scale(1.1)}}
@keyframes tape{from{transform:translate3d(0,0,0)}to{transform:translate3d(-50%,0,0)}}
html[dir="rtl"] .skyline{transform:scaleX(-1)}
@media (prefers-reduced-motion:no-preference){
  .sky .o1{animation:orbA 22s ease-in-out infinite alternate}
  .sky .o2{animation:orbB 27s ease-in-out infinite alternate}
  .sky .o3{animation:orbC 33s ease-in-out infinite alternate}
  .skyline .tape{animation:tape 48s linear infinite}
}
/* Neon-chart i bakgrunnen (founder 17.10 22:54 «neon lys … bevege seg i puls som et
   bakgrunnsbilde bak tekster»). To kurslinjer i ulik dybde + svake candles, som glir
   sakte og pulserer. Gloed = tre streker oppaa hverandre (bred/svak, middels, tynn/sterk),
   IKKE filter/blur - samme ytelsesregel som resten av .sky. Linjene gaar opp og ned:
   et marked, aldri et gevinstloefte. Lav styrke saa teksten alltid er lesbar. */
.neon{position:absolute;inset-inline:0;top:22vh;height:62vh;
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 22%,#000 78%,transparent);mask-image:linear-gradient(180deg,transparent,#000 22%,#000 78%,transparent)}
.nt{position:absolute;inset-block:0;left:0;width:200%;will-change:transform}
.nt svg{display:block;width:100%;height:100%;overflow:visible}
.nt path{fill:none;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.nt1 path{stroke:#15D8C4}.nt2 path{stroke:#C21FBF}
.nt .g3{stroke-width:14;opacity:.05}.nt .g2{stroke-width:6;opacity:.12}.nt .g1{stroke-width:1.8;opacity:.55}
.nt2{top:18%;bottom:-6%}
.nt2 svg{opacity:.7}
.nc .cu{fill:#16C784;stroke:#16C784}.nc .cd{fill:#EA3943;stroke:#EA3943}
.nc rect{opacity:.10}.nc line{stroke-width:1;opacity:.12;vector-effect:non-scaling-stroke}
.neon{opacity:.55}
:root[data-theme="dark"] .neon{opacity:.85}
html[dir="rtl"] .neon{transform:scaleX(-1)}
@keyframes neonpuls{0%,100%{opacity:.75}50%{opacity:1}}
@media (prefers-reduced-motion:no-preference){
  /* Glid (transform) og puls (opacity) paa samme lag: begge komponeres paa GPU,
     ingen ny tegning av SVG-en per bilde. */
  .nt1{animation:tape 70s linear infinite,neonpuls 4.5s ease-in-out infinite}
  .nt2{animation:tape 110s linear infinite,neonpuls 4.5s ease-in-out -2.2s infinite}
}
/* Ikke la bakgrunnen drive i skjulte faner: nettleseren struper allerede animasjoner i
   bakgrunnsfaner; html.paused settes i tillegg av visibilitychange (se skriptet). */
html.paused .sky *,html.paused .skyline *{animation-play-state:paused}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ink);color:var(--chalk);font-family:var(--face);
  font-size:1.0625rem;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
/* Nastaliq stabler bokstavformer vertikalt INNE i linja, saa 14px nastaliq
   har omtrent samme detaljnivaa som 10px latinsk. Maalt foer endring:
   guidetekst 15,2px, markoerforklaringer 14,08px — saa vidt lesbart.
   Roten loeftes per skriftsystem, og alle rem-verdier foelger med. */
html[data-font="nastaliq"]{font-size:18px}
html[data-font="naskh"]{font-size:18px}
html[data-font="deva"]{font-size:17.5px}
html[data-font="nastaliq"] body{line-height:1.9}
html[data-font="naskh"] body{line-height:1.9}
html[data-font="deva"] body{line-height:1.8}
/* Noto Nastaliq Urdu finnes i 400 og 700. Ber vi om 800 eller 900, lager
   nettleseren syntetisk fet — og paa en skrift der strekene allerede
   overlapper, smoerer det teksten ut i stedet for aa framheve den. */
html[data-font="nastaliq"] h1,html[data-font="nastaliq"] h2,
html[data-font="nastaliq"] h3,html[data-font="nastaliq"] .t{font-weight:500}
html[data-font="nastaliq"] strong,html[data-font="nastaliq"] b,
html[data-font="nastaliq"] .wm{font-weight:700}
/* Overskriftene skal IKKE foelge den loeftede roten - da blir de vegger.
   Egne tak, i em av seg selv, saa brodteksten kan vaere lesbar uten at
   titlene roper. */
html[data-font="nastaliq"] .sec > h2,html[data-font="nastaliq"] .short > h2{font-size:1.16rem;line-height:1.5}
html[data-font="nastaliq"] .plate .t{font-size:1.04rem;line-height:1.55}
html[data-font="nastaliq"] .plate[data-cat="start"] .t{font-size:1.12rem}
html[data-font="nastaliq"] .plate .d{font-size:.92rem;line-height:1.85}
.shell{max-width:46rem;margin:0 auto;padding:0 clamp(18px,5vw,40px) 72px}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold-soft);outline-offset:3px}
[hidden]{display:none !important}
/* Mens en spraakpakke hentes foerste gang: ingen engelsk som blinker forbi. */
html[aria-busy="true"] .shell{visibility:hidden}

/* masthead */
.mast{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  padding:26px 0 0;border-bottom:1px solid var(--rule)}
.wordmark{display:flex;align-items:center;gap:11px;padding-bottom:12px}
.mono{width:40px;height:40px;flex:0 0 auto;display:block}
.wordmark .wm{display:block;font-family:var(--display);font-weight:800;font-size:18px;
  font-variation-settings:"wdth" 94;letter-spacing:.11em;text-transform:uppercase;
  line-height:1;color:var(--chalk)}
/* «AIM» er fortsatt poenget i navnet, men det baeres av vekt, ikke av en
   andre farge. Ett ordmerke skal ha én farge naar det staar inntil en
   gradient - ellers konkurrerer de. */
.wordmark .wm em{font-style:normal;font-weight:500;color:inherit}
.wordmark .tag{display:block;margin-top:5px;font-size:10px;letter-spacing:.22em;
  color:var(--chalk-dim);font-weight:600;font-family:var(--display);text-transform:uppercase}
/* Alle fem skal paa én linje ogsaa paa 360px, ellers havner urdu til
   venstre paa linje to - stikk motsatt av hensikten med aa sette den sist. */
.switch{display:flex;gap:4px;padding-bottom:8px;align-items:center}
.switch button{background:var(--ink-deep);border:1px solid var(--rule);border-radius:999px;
  color:var(--chalk);font:inherit;font-size:13px;font-weight:700;
  padding:8px clamp(8px,2.6vw,14px);
  cursor:pointer;font-family:var(--display);min-height:40px;line-height:1;
  white-space:nowrap;transition:none}
.switch button:hover{border-color:var(--gold)}
/* Aktivt spraak: svart flate med gull understrek. Svart baerer kontrasten,
   gullet sier hvilken. Begge deler leses paa en billig skjerm i dagslys. */
.switch button[aria-pressed="true"]{background:var(--jet);border-color:var(--jet);
  color:var(--jet-on);box-shadow:inset 0 -3px 0 0 var(--gold-metal)}
/* Lys/moerk er en KONTROLL, ikke et spraak - den skilles ut. */
.switch .thm{font-size:15px;margin-inline-start:auto;padding:7px 11px;min-width:40px;
  border-style:dashed;color:var(--chalk-dim);flex:0 0 auto}
.switch .thm:hover{color:var(--chalk);border-color:var(--gold-metal)}

/* hero */
.hero{padding:52px 0 40px}
.hero h1{margin:0;font-family:var(--display);font-weight:800;
  font-variation-settings:"wdth" 88;
  font-size:clamp(2.5rem,10.5vw,4.6rem);line-height:.94;letter-spacing:-.028em;
  text-transform:none;text-wrap:balance}
html[data-font="deva"] .hero h1,html[data-font="nastaliq"] .hero h1,html[data-font="naskh"] .hero h1{
  font-family:var(--face);text-transform:none;letter-spacing:0;line-height:1.3;
  font-size:clamp(2rem,8vw,3.4rem)}
/* Maa staa ETTER den felles regelen over - samme spesifisitet, saa det er
   rekkefoelgen som avgjoer. Foerste forsoek laa foran og ble overstyrt:
   maalt 36px i stedet for 28,8. */
html[data-font="nastaliq"] .hero h1{font-size:clamp(1.6rem,6.4vw,2.5rem);line-height:1.42}
.hero h1 span{display:block}
/* Gradienten bor i logoen og i regelstreken under hver h2. Paa overskriften
   ble den dekorasjon — og halvt usynlig paa hvitt. Dyp blaa i stedet: 9,33:1,
   og to toner leser som ett utsagn i stedet for to. */
/* Andre linje i logoens egen gradient - lys modus uten den gule, som forsvinner paa hvitt. */
.hero h1 span:last-child{background:var(--grad-ink);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:26px 0 0;max-width:var(--measure);color:var(--chalk-dim);font-size:1.02rem}
@media (prefers-reduced-motion:no-preference){
  .hero h1 span{animation:rise .55s cubic-bezier(.2,.7,.3,1) backwards}
  .hero h1 span:nth-child(2){animation-delay:.07s}
}
@keyframes rise{from{opacity:0;transform:translateY(.35em)}to{opacity:1;transform:none}}

/* Paa korte skjermer (360x640 og mindre, de vanligste billige telefonene) tok
   logo, spraakvalg, overskrift og sponsorvarselet hele foerste skjerm, saa det
   foerste kortet - det som sier hva man skal gjoere - laa nedenfor kanten.
   Maalt 16.10: kort 1 begynte paa 644 px med 640 px skjerm. Overskriften er
   merkevaren, men den maa ikke staa i veien for handlingen. */
@media (max-height:700px){
  header{padding-top:12px}
  .wordmark{margin-bottom:2px}
  .hero{padding:26px 0 22px}
  .hero h1{font-size:clamp(2rem,8.4vw,3.2rem)}
  html[data-font="deva"] .hero h1,html[data-font="naskh"] .hero h1{font-size:clamp(1.7rem,6.6vw,2.6rem)}
  html[data-font="nastaliq"] .hero h1{font-size:clamp(1.45rem,5.6vw,2.1rem)}
  .hero p{margin-top:14px}
  .notice{margin-block:10px}
  .menu .mlede{margin-bottom:9px}
  /* Nastaliq og naskh bruker mer hoeyde per linje. Luften strammes, ikke
     teksten: founder 15.10 sa urdu var «stor og skremmende» da den var tett. */
  html[data-font="nastaliq"] .hero,html[data-font="naskh"] .hero,html[data-font="deva"] .hero{padding:16px 0 12px}
  html[data-font="nastaliq"] .hero p,html[data-font="naskh"] .hero p,html[data-font="deva"] .hero p{margin-top:10px}
  html[data-font="nastaliq"] .script,html[data-font="naskh"] .script{margin-top:4px}
  html[data-font="nastaliq"] .notice,html[data-font="naskh"] .notice{padding-block:11px}
}

/* sections */
.sec{padding:50px 0 0}
.sec > h2,.short > h2{margin:0 0 22px;font-size:1.42rem;font-weight:700;letter-spacing:-.015em;
  color:var(--chalk);font-family:var(--display);font-variation-settings:"wdth" 92}
html[data-font="deva"] .sec > h2,html[data-font="nastaliq"] .sec > h2,html[data-font="naskh"] .sec > h2,html[data-font="deva"] .short > h2,html[data-font="nastaliq"] .short > h2,html[data-font="naskh"] .short > h2{
  font-family:var(--face);letter-spacing:0}
.sec > h2 b,.short > h2 b{display:block;width:46px;height:3px;background:var(--grad);margin-top:11px}
.lede{max-width:var(--measure);color:var(--chalk-dim);margin:0 0 26px}

/* sponsor */
.spon{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;margin:30px 0 0;
  padding:12px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
  font-size:.86rem;color:var(--chalk-dim)}
.spon strong{color:var(--chalk);font-weight:700}
.spon .fp{font-family:var(--mono);font-size:.82rem;color:var(--gold-soft);font-weight:700;
  letter-spacing:.04em;background:var(--ink-deep);border:1px solid var(--rule);
  border-radius:4px;padding:2px 7px}
.guide > li::before,.rail > li::before,.pin,.keys li::before{font-variant-numeric:tabular-nums}
.spon button{background:none;border:0;color:var(--gold-soft);font:inherit;font-size:.86rem;
  text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0}

/* primary action */
.slab{display:block;background:var(--grad);color:#08080B;text-decoration:none;
  border-radius:2px;
  padding:22px 24px;margin:0 0 2px;border:0}
.slab .t{display:block;font-family:"Montserrat",sans-serif;font-weight:900;font-size:1.4rem;
  letter-spacing:.01em;line-height:1.12;text-transform:uppercase}
html[data-font="deva"] .slab .t,html[data-font="nastaliq"] .slab .t,html[data-font="naskh"] .slab .t{
  font-family:var(--face);text-transform:none;letter-spacing:0;line-height:1.7}
.slab .s{display:block;margin-top:5px;font-size:.9rem;opacity:.72;font-weight:600}
 /* Hovedknappen - endelig oppskrift (knappelab 04:23 + fagprinsipper 04:25):
    pille, fire TONEDE skyggelag (kontakt/noekkel/mellom/ambient), lyshetsskifte i
    fyllet, gradienten glir ved pek, kun transform og skygge i overgangene. */
.slab.reg{text-align:center;border:0;border-radius:999px !important;position:relative;overflow:hidden;
  max-width:430px;
  background:
    linear-gradient(rgba(255,255,255,.16), rgba(255,255,255,0) 40%, rgba(0,0,0,.14)),
    var(--grad);
  background-size:100% 100%, 165% 100%;
  background-position:0 0, 0% 50%;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.16),
    inset 0 1px 0 rgba(255,255,255,.42),
    0 2px 6px rgba(10,10,16,.45),
    0 8px 18px -6px rgba(194,31,191,.42),
    0 18px 44px -14px rgba(21,216,196,.38);
  transition:transform .14s ease, box-shadow .18s ease, background-position .5s ease}
.slab.reg::after{content:"";position:absolute;top:0;inset-inline-start:-30%;width:45%;height:100%;
  background:linear-gradient(105deg,transparent,rgba(255,255,255,.26) 50%,transparent);
  transform:skewX(-20deg);pointer-events:none}
.slab.reg:hover{transform:translateY(-1px);background-position:0 0, 60% 50%;filter:none;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.2),
    inset 0 1px 0 rgba(255,255,255,.46),
    0 3px 8px rgba(10,10,16,.5),
    0 12px 24px -6px rgba(194,31,191,.5),
    0 24px 54px -14px rgba(21,216,196,.44)}
.slab.reg:active{transform:translateY(0) scale(.98);transition-duration:.08s;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.14),
    inset 0 2px 6px rgba(0,0,0,.25),
    0 2px 5px rgba(10,10,16,.4),
    0 6px 14px -6px rgba(194,31,191,.38)}
.slab.reg:focus-visible{outline:3px solid rgba(94,230,214,.55);outline-offset:3px}
:root:not([data-theme="dark"]) .slab.reg{
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.35),
    inset 0 1px 0 rgba(255,255,255,.6),
    0 2px 6px rgba(26,16,30,.18),
    0 8px 18px -6px rgba(163,21,159,.28),
    0 18px 40px -14px rgba(16,150,140,.25)}
.slab:hover,.slab:focus-visible{filter:brightness(1.12)}
/* Egen lenke: samme slab-form, men omriss - sekundaer handling, aldri doed flate. */
.slab.own{color:var(--chalk);border:1.5px solid transparent;
  background:linear-gradient(var(--ink),var(--ink)) padding-box,var(--grad) border-box}
.slab.own .t{font-size:1.05rem}
.slab.own:hover,.slab.own:focus-visible{filter:brightness(1.18);border-color:transparent}

/* ruled link rows */
/* Rader paa blaa grunn saa ut som tekst. Naa er de et hvitt kort med
   egne rader, tittelen i lenkefargen og et stoerre, tydeligere maal. */
.rows{background:var(--ink-deep);border:1px solid var(--rule);border-radius:8px;
  overflow:hidden}
/* Tittel OVER undertekst, som en listerad i en app. Side om side presset
   underteksten ned i en smal soeyle med ett ord per linje paa mobil. */
.row{display:grid;grid-template-columns:1fr auto;grid-template-areas:"t go" "s go";
  column-gap:12px;row-gap:2px;align-items:center;padding:14px 16px;
  border-top:1px solid var(--rule);text-decoration:none;color:inherit;min-height:60px}
.row.ico{grid-template-columns:30px 1fr auto;grid-template-areas:"ico t go" "ico s go"}
.row:first-child{border-top:0}
.row .ri{grid-area:ico;width:30px;height:30px;border-radius:8px;object-fit:cover}
.row .t{grid-area:t;font-weight:700;font-size:1.04rem;letter-spacing:-.01em;color:var(--gold-soft)}
.row .s{grid-area:s;color:var(--chalk-dim);font-size:.88rem;line-height:1.4}
.row:hover,.row:focus-visible{background:#F6F0FA}
.row .go{color:var(--gold);font-weight:800;font-size:1.25rem;font-family:var(--display);
  grid-area:go;line-height:1}
html[dir="rtl"] .row .go{transform:scaleX(-1)}
:root[data-theme="dark"] .row:hover,:root[data-theme="dark"] .row:focus-visible{
  background:var(--ink-raise)}

/* short list */
.rail{list-style:none;margin:0;padding:0;position:relative;counter-reset:n}
.rail::before{content:"";position:absolute;inset-block:14px;inset-inline-start:13px;
  width:1px;background:var(--rule)}
.rail > li{position:relative;padding:0 0 26px;padding-inline-start:46px;max-width:var(--measure)}
.rail > li:last-child{padding-bottom:0}
.rail > li::before{content:counter(n);counter-increment:n;position:absolute;inset-inline-start:0;
  top:-1px;width:27px;height:27px;border:1px solid var(--rule);border-radius:50%;
  background:var(--ink);color:var(--chalk-dim);display:grid;place-items:center;
  font-size:.8rem;font-weight:700;font-family:"Montserrat",sans-serif}

/* step-by-step guide */
.guide{list-style:none;counter-reset:g;margin:0;padding:0;position:relative}
.guide::before{content:"";position:absolute;inset-block:16px;inset-inline-start:15px;
  width:1px;background:var(--rule)}
.guide::before{inset-inline-start:19.5px}
.guide > li{counter-increment:g;position:relative;padding:0 0 26px;padding-inline-start:52px;
  max-width:var(--measure)}
.guide > li:last-child{padding-bottom:0}
/* Stegtallet ER avhukingen. Ett trykk, stort nok maal, og ingressen sitt
   loefte om aa «stoppe etter hvert steg og komme tilbake» blir ekte. */
.tick{position:absolute;inset-inline-start:0;top:-6px;width:40px;height:40px;
  border-radius:50%;background:var(--gold-metal);border:1.5px solid var(--on-gold);
  color:var(--on-gold);display:grid;place-items:center;font:800 .85rem/1 var(--display);
  font-variant-numeric:tabular-nums;cursor:pointer;padding:0}
.tick[aria-pressed="true"]{background:var(--jet);color:var(--jet-on);border-color:var(--jet)}
/* Dimming av avhukede steg var feil paa to maater: paa nastaliq og naskh
   blir allerede fine streker uleselige ved 50 % opasitet, og man maa kunne
   lese om igjen et steg man har gjort. Fullfoeringen vises paa sirkelen
   alene — teksten staar i full styrke. */
.guide > li.done h3{color:var(--chalk-dim)}
/* Delhaker: hver linje i et steg er en handling man kan krysse av. */
.subs{list-style:none;margin:10px 0 0;padding:0}

.subs > li{display:flex;gap:10px;align-items:flex-start;padding:5px 0}
.subs > li.on > span{color:var(--chalk-dim)}
.sub{flex:0 0 auto;width:26px;height:26px;margin-top:1px;border-radius:7px;
  border:1.5px solid var(--edge-ui);background:transparent;color:var(--on-gold);
  font:800 .82rem/1 var(--display);display:grid;place-items:center;cursor:pointer;padding:0}
.sub[aria-pressed="true"]{background:var(--gold-metal);border-color:var(--gold-metal)}
.subs > li > span{flex:1 1 auto}
.tick[aria-pressed="true"]::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;inset:0;
  border-radius:50%;box-shadow:0 0 0 3px var(--gold-metal)}
.tick{position:absolute}
.prog{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 20px;
  font-family:var(--mono);font-size:.82rem;color:var(--chalk-dim)}
.prog .bar{flex:1 1 120px;height:4px;background:var(--rule);border-radius:999px;
  overflow:hidden;min-width:90px}
.prog .bar i{display:block;height:100%;background:var(--gold-metal);
  transition:width .18s linear}
.prog button{background:none;border:0;color:var(--gold-soft);font:inherit;
  text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0}

/* Koder som maa skrives EKSAKT hoerer ikke hjemme i loepende tekst. */
.codes{display:flex;flex-wrap:wrap;gap:8px;margin:13px 0 0}
.codes button{display:inline-flex;align-items:center;gap:9px;background:var(--ink-deep);
  border:1px solid var(--rule);border-radius:6px;padding:9px 12px;cursor:pointer;
  font:inherit;font-size:.84rem;color:var(--chalk);text-align:start}
.codes button:hover{border-color:var(--gold-metal)}
.codes .k{color:var(--chalk-dim);font-size:.78rem}
/* «#Aitech» begynner med et noeytralt tegn. I en RTL-setning flyttes
   «#» til hoeyre for de latinske bokstavene og koden VISES som «Aitech#»,
   selv om verdien som kopieres er riktig. Isolering laaser visningen. */
.codes .v{font-family:var(--mono);font-weight:700;letter-spacing:.03em;
  direction:ltr;unicode-bidi:isolate;display:inline-block}
.codes .c{color:var(--gold-soft);font-size:.74rem;font-family:var(--face)}

/* Riktig app, riktig plattform. To store maal - ingen gjetting. */
.apps{display:flex;gap:8px;margin:13px 0 0;flex-wrap:wrap}
.apps a{flex:1 1 130px;display:flex;align-items:center;justify-content:center;gap:8px;
  border:1.5px solid transparent;border-radius:var(--r-btn);
  background:linear-gradient(var(--ink-raise),var(--ink-raise)) padding-box,var(--grad) border-box;
  color:var(--chalk);padding:11px 14px;text-decoration:none;font-weight:800;font-size:.9rem;
  font-family:var(--display);min-height:44px}
.apps a:hover,.apps a:focus-visible{filter:brightness(1.18)}
.joinbtn{display:block;margin:9px 0 0;background:var(--grad);color:#08080B;
  text-decoration:none;padding:14px 16px;border-radius:var(--r-btn);text-align:center;
  font-weight:800;font-size:1rem;font-family:var(--display);min-height:48px}
.joinbtn:hover,.joinbtn:focus-visible{filter:brightness(1.12)}

/* Ordlista. Lukket til man trykker, saa den som bare vil la Sonic gaa
   slipper aa scrolle forbi tolv begreper. */
.learn{display:grid;gap:2px}
.learn details{background:var(--ink-deep);border:1px solid var(--rule);border-radius:6px}
.learn summary{cursor:pointer;padding:14px 16px;font-weight:700;font-size:1rem;
  font-family:var(--display);list-style:none;display:flex;align-items:center;gap:10px;
  min-height:52px}
.learn summary::-webkit-details-marker{display:none}
.learn summary::after{content:"+";margin-inline-start:auto;color:var(--gold-soft);
  font-weight:800;font-size:1.2rem;line-height:1}
.learn details[open] summary::after{content:"\2212"}
.learn details[open] summary{border-bottom:1px solid var(--rule)}
.learn .body{padding:4px 16px 16px}
.learn .one{margin:10px 0 0;color:var(--chalk);font-size:.95rem}
.learn dl{margin:12px 0 0;display:grid;gap:3px}
.learn dt{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;
  color:var(--chalk-dim);font-family:var(--display);font-weight:700}
.learn dd{margin:0 0 9px;font-size:.9rem;color:var(--chalk-dim)}
.aca-t{margin:34px 0 4px;font-size:1.15rem}
.learn .les{padding:4px 16px 18px}
.learn .les h4{margin:16px 0 4px;font-size:.98rem;color:var(--chalk)}
.learn .les p{margin:0;font-size:.95rem;line-height:1.65;color:var(--chalk-dim)}
/* Leksjonens undertittel deler klassenavn med 26 px-avkrysningsboksen (.sub over) -
   nullstill boks-stilen, og legg undertittelen på egen linje under tittelen (målt 17.10:
   den ble klemt inn i en 26 px-boks ved siden av tittelen). */
.learn summary{flex-wrap:wrap}
.learn summary::after{order:2}
.learn summary .sub{display:block;order:3;flex:1 1 100%;width:auto;height:auto;margin-top:2px;

  border:0;border-radius:0;background:none;box-shadow:none;font-weight:400;font-size:.85rem;color:var(--chalk-dim)}
/* Ordlista som brikker (founder 17.10 20:24 «design og forenkling»): ord-pillene ligger i rader;
   den som aapnes, legger seg over hele bredden. */
#learn{display:flex !important;flex-wrap:wrap;gap:8px}
#learn > details{flex:0 0 auto;border-radius:999px !important;margin:0 !important;
  background:linear-gradient(var(--ink-deep),var(--ink-deep)) padding-box,var(--grad) border-box;border:1.5px solid transparent !important}
#learn > details > summary{padding:9px 15px !important;font-size:.9rem !important;border:0 !important}
#learn > details > summary .sub{display:none !important}
#learn > details > summary::after{content:none !important}
#learn > details[open]{flex:1 1 100%;border-radius:16px !important;background:var(--ink-deep);border:1px solid var(--rule) !important}
#learn > details[open] > summary{font-size:1rem !important}
#learn > details[open] > summary::after{content:"\2212" !important;margin-inline-start:auto}

.learn .les .fx{margin:8px 0 0;padding:9px 12px;font-family:var(--mono);font-size:.84rem;line-height:1.6;color:var(--chalk);
  background:var(--ink);border:1px solid var(--rule);border-inline-start:3px solid var(--gold-metal);border-radius:0 5px 5px 0;
  white-space:pre-line;direction:ltr;unicode-bidi:isolate;text-align:left}
html[dir="rtl"] .learn .les .fx{border-radius:5px 0 0 5px}
.learn dd.ex{font-family:var(--mono);font-size:.84rem;color:var(--chalk);
  background:var(--ink);border:1px solid var(--rule);border-radius:5px;padding:9px 11px;
  direction:ltr;unicode-bidi:isolate;text-align:start}
/* Formelen er regelen de kan bruke selv. Den skiller seg fra eksempelet
   med gullkant, saa den leses som «dette er verktoeyet». */
.learn dd.fx{font-family:var(--mono);font-size:.84rem;color:var(--chalk);
  background:var(--ink);border:1px solid var(--rule);
  border-inline-start:3px solid var(--gold-metal);border-radius:0 5px 5px 0;
  padding:9px 11px;direction:ltr;unicode-bidi:isolate;text-align:start}
html[dir="rtl"] .learn dd.fx{border-radius:5px 0 0 5px}
.learn .lfig{margin:13px 0 4px}
.learn .lfig svg{display:block;width:100%;height:auto}
.guide h3{margin:0 0 5px;font-size:1.05rem;font-weight:800;letter-spacing:-.01em}
.guide p{margin:0;color:var(--chalk-dim);font-size:.95rem}

/* language chips for the partner's own videos */
/* «Husk dette» skal leses foer broedteksten rundt, ikke etter. Gul kant
   og hvit flate loefter den ut, og den staar i full tekstfarge — ikke
   dempet, slik den gjorde foer. */
/* «Slik vet du at det gikk riktig». Groenn kant fordi den betyr
   fullfoert — her er det faktisk riktig bruk av groenn. */
.chk{margin:13px 0 0;padding:12px 15px;background:var(--ink-deep);
  border:1px solid var(--rule);border-inline-start:4px solid #0F7A4A;
  border-radius:0 6px 6px 0;font-size:.89rem;color:var(--chalk)}
html[dir="rtl"] .chk{border-radius:6px 0 0 6px}
.chk b{display:block;font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;
  color:#0F7A4A;font-family:var(--display);margin-bottom:5px}
:root[data-theme="dark"] .chk{border-inline-start-color:#4ADE80}
:root[data-theme="dark"] .chk b{color:#4ADE80}

.vnote{margin:13px 0 0;padding:13px 15px;background:var(--ink-deep);
  border:1px solid var(--rule);border-inline-start:4px solid var(--gold-metal);
  border-radius:0 6px 6px 0;font-size:.9rem;color:var(--chalk);font-weight:500}
html[dir="rtl"] .vnote{border-radius:6px 0 0 6px}
/* Knapp slik den staar paa skjermen: ser ut som en knapp, leses som engelsk. */
.ui{display:inline-block;font:700 .9em/1.25 "Archivo","Montserrat",system-ui,sans-serif;
  padding:.02em .38em;margin:0 .06em;border:1px solid var(--edge-ui);border-radius:5px;
  background:var(--ink-deep);color:var(--chalk);white-space:nowrap;unicode-bidi:isolate}
.gl{color:var(--chalk-dim)}
.out .apply{display:block;margin-top:12px;min-height:44px;width:100%;border:0;border-radius:999px;background:var(--grad-ink);color:#fff;font:800 1rem/1 var(--display);cursor:pointer}
.out .apply:disabled{opacity:.6}
#ld-btn.sent{opacity:1;filter:saturate(.8)}
#ld-btn:disabled:not(.sent){opacity:.7}
#notice-none .dlink{display:inline-flex;align-items:center;min-height:40px;margin-top:10px;
  color:var(--gold-soft);font-weight:700;text-decoration:underline;text-underline-offset:3px}
#spon .dcheck{margin:9px 0 0;font-size:.82rem;line-height:1.45;color:var(--chalk-dim);
  border-top:1px solid var(--rule);padding-top:9px}
.dcheck.selfw{color:var(--chalk);border-inline-start:3px solid var(--gold);padding-inline-start:10px}
#spon .dlink{display:inline-flex;align-items:center;min-height:40px;margin-top:4px;
  color:var(--gold-soft);font-weight:700;text-decoration:underline;text-underline-offset:3px}
#spon .ok{margin-inline-start:.3em;color:var(--gold-soft);font-weight:800}
.langs{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
.langs a{display:inline-flex;align-items:center;min-height:40px;padding:7px 14px;border:1px solid var(--rule);border-radius:999px;
  font-size:.82rem;font-weight:600;text-decoration:none;color:var(--chalk-dim);
  font-family:"Montserrat",sans-serif;background:var(--ink-deep)}
.langs a:hover,.langs a:focus-visible{border-color:var(--gold);color:var(--gold)}
.soon{margin:12px 0 0;font-size:.86rem;color:var(--chalk-dim);font-style:italic}

/* annotated screenshot */
.shot{margin:14px 0 0;position:relative;max-width:300px}
.shot img{display:block;width:100%;height:auto;border:1px solid var(--rule);border-radius:6px}
.pin{position:absolute;width:24px;height:24px;border-radius:50%;background:var(--gold-metal);
  color:var(--on-gold);font:800 12px/1 var(--display);display:grid;place-items:center;
  transform:translate(-50%,-50%);box-shadow:0 0 0 3px var(--ink);pointer-events:none}
html[dir="rtl"] .pin{transform:translate(50%,-50%)}
.keys{list-style:none;margin:12px 0 0;padding:0;counter-reset:k}
.keys li{display:flex;gap:10px;align-items:flex-start;padding:5px 0;font-size:.88rem;
  color:var(--chalk-dim)}
.keys li::before{content:counter(k);counter-increment:k;flex:0 0 auto;width:20px;height:20px;
  border-radius:50%;background:var(--gold-metal);color:var(--on-gold);display:grid;place-items:center;
  font:800 11px/1 var(--display);margin-top:2px}
/* Skjermbilder v2 (founder 17.10 21:28 «still dem bedre»): telefonramme, pulserende pekere,
   trykk for stort bilde, trykk paa en linje for aa lyse opp pekeren. */
.shot{max-width:320px !important;margin:18px 0 0 6px !important;cursor:zoom-in}
.shot img{border:0 !important;border-radius:18px !important;box-shadow:0 0 0 7px #0E0E14,0 0 0 8px rgba(255,255,255,.08),0 22px 44px rgba(0,0,0,.45)}
.pin{width:22px !important;height:22px !important;background:var(--grad) !important;color:#08080B !important;font:900 11px/1 var(--display) !important;
  box-shadow:0 0 0 2px #fff,0 4px 10px rgba(0,0,0,.35) !important}
.pin::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(94,230,214,.7);animation:pinpuls 2.4s ease-out infinite;opacity:0}
.pin.lys{transform:translate(-50%,-50%) scale(1.35);transition:transform .25s}
html[dir="rtl"] .pin.lys{transform:translate(50%,-50%) scale(1.35)}
.pin.lys::after{animation-duration:.9s}
@keyframes pinpuls{0%{opacity:.9;transform:scale(.7)}100%{opacity:0;transform:scale(1.6)}}
.keys li{cursor:pointer;border-radius:10px;padding:6px 8px !important;margin-inline:-8px;transition:background .2s}
.keys li.lys{background:rgba(94,230,214,.12);color:var(--chalk)}
.keys li::before{background:var(--grad) !important;color:#08080B !important}
.shotbox{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:rgba(8,8,11,.92);cursor:zoom-out;animation:sbfade .2s ease}
.shotbox .shot{max-width:min(92vw,520px) !important;margin:0 !important;cursor:zoom-out}
.shotbox .shot img{max-height:86vh;width:auto;max-width:100%}
@keyframes sbfade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.pin::after{animation:none}}


/* earnings */
.earn{margin:0;padding:0;list-style:none}
.earn > li{padding:0 0 22px;max-width:var(--measure);position:relative;padding-inline-start:20px}
.earn > li::before{content:"";position:absolute;inset-inline-start:0;top:.6em;
  width:8px;height:8px;background:var(--gold)}
.earn h3{margin:0 0 3px;font-size:1.04rem;font-weight:700;letter-spacing:-.01em}
.earn p{margin:0;color:var(--chalk-dim);font-size:.93rem}
.warn{max-width:var(--measure);margin:10px 0 0;padding:18px 20px;background:#FFF4EC;
  border:1px solid #F0D3BE;border-inline-start:4px solid var(--ember);
  border-radius:0 6px 6px 0;font-size:.93rem;color:var(--chalk)}
html[dir="rtl"] .warn{border-radius:6px 0 0 6px}
:root[data-theme="dark"] .warn{background:var(--ink-raise);border-color:var(--rule);
  border-inline-start-color:var(--ember)}

/* values — tiers that widen */
.tiers{margin:0;padding:0;list-style:none}
.tiers > li{display:flex;align-items:flex-start;gap:16px;padding:18px 20px;margin-bottom:3px;
  background:var(--ink-raise);border-inline-start:3px solid var(--gold)}
.tiers > li:nth-child(1){width:76%;border-inline-start-color:var(--v1)}
.tiers > li:nth-child(2){width:84%;border-inline-start-color:var(--v2)}
.tiers > li:nth-child(3){width:92%;border-inline-start-color:var(--v3)}
.tiers > li:nth-child(4){width:100%;border-inline-start-color:var(--v4)}
@media (max-width:560px){ .tiers > li{width:100% !important} }
/* The whole word is the display type now — founder saw one 2rem Montserrat Black
   letter in four bright colours and said it read like a primary-school alphabet
   chart. Geometric/technical face per BRAND.md §1, medium weight instead of
   Black, sentence case instead of shouting caps, and the AIMPIRE acronym is
   carried by the initial in the logo gradient rather than by four flat brights. */
.tiers h3{margin:0 0 6px;font-family:var(--display);font-weight:700;
  font-variation-settings:"wdth" 90;
  font-size:clamp(1.5rem,5.6vw,2.05rem);line-height:1.04;letter-spacing:-.022em;
  text-transform:none;color:var(--chalk)}
.tiers h3 .ini{color:var(--gold-soft);
  box-shadow:inset 0 -.085em 0 0 var(--gold);padding-bottom:.03em}
html[data-font="deva"] .tiers h3,html[data-font="nastaliq"] .tiers h3,html[data-font="naskh"] .tiers h3{
  font-family:var(--display)}
.tiers p{margin:0;color:var(--chalk-dim);font-size:.92rem}

/* tre steder, tre navn */
.places{margin:0;padding:0;list-style:none;display:grid;gap:2px}
.places > li{padding:15px 18px;background:var(--ink-deep);
  border-inline-start:3px solid var(--gold)}
.places h3{margin:0 0 3px;font-size:.95rem;font-weight:800;
  font-family:"Montserrat",sans-serif;letter-spacing:.01em}
.places p{margin:0;color:var(--chalk-dim);font-size:.9rem}
@media (min-width:620px){ .places{grid-template-columns:repeat(3,1fr)} }
/* Amplify staar i én kolonne ogsaa paa bred skjerm — fire punkter som maa
   leses i rekkefoelge, ikke tre kort som kan skumleses. */
.places.amp{grid-template-columns:1fr !important;gap:3px;max-width:var(--measure)}
.places.amp > li{border-inline-start-color:var(--ember);padding:16px 18px}
.places.amp p{color:var(--chalk);font-size:.93rem}

/* IB-seksjonen. Staar nederst fordi den er valgfri. */
.ib{display:grid;gap:3px;max-width:var(--measure)}
.ib > section{background:var(--ink-deep);border:1px solid var(--rule);
  border-radius:6px;padding:17px 19px}
.ib h3{margin:0 0 7px;font-family:var(--display);font-weight:700;
  font-size:1.06rem;letter-spacing:-.015em}
.ib p{margin:0;color:var(--chalk);font-size:.93rem}
.ib .fig{margin:15px 0 0}
.ib .cap{margin:8px 0 0;font-size:.8rem;color:var(--chalk-dim);
  font-family:var(--mono);direction:ltr;unicode-bidi:isolate;text-align:start}
.ib .flag{margin:14px 0 0;padding:11px 13px;background:#FFF4EC;
  border:1px solid #F0D3BE;border-inline-start:4px solid var(--ember);
  border-radius:0 5px 5px 0;font-size:.85rem;color:var(--chalk)}
html[dir="rtl"] .ib .flag{border-radius:5px 0 0 5px}
:root[data-theme="dark"] .ib .flag{background:var(--ink-raise);border-color:var(--rule)}
.ib svg{display:block;width:100%;height:auto}

/* notices */
.notice{max-width:var(--measure);padding:22px 24px;background:var(--ink-deep);
  border-inline-start:3px solid var(--gold)}
.notice.alert{border-inline-start-color:var(--ember);background:#FFF4EC}
:root[data-theme="dark"] .notice.alert{background:var(--ink-raise)}
.notice h2{margin:0 0 8px;font-size:1.1rem;font-weight:700}
.notice p{margin:0 0 10px;color:var(--chalk-dim);font-size:.94rem}
.notice p:last-child{margin-bottom:0}
.notice .foot{font-size:.85rem;padding-top:12px;margin-top:14px;border-top:1px solid var(--rule)}
.choice{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.choice button{flex:1 1 150px;padding:13px;border:1px solid var(--rule);background:none;
  color:var(--chalk);font:inherit;font-size:.92rem;font-weight:700;cursor:pointer;
  font-family:"Montserrat",sans-serif}
/* To navn, ingen favoritt: begge knappene like (B-023). */
.choice button:first-child{background:none;border-color:var(--rule);color:inherit}

/* leader tool */
.tool{max-width:var(--measure)}
.tool p{color:var(--chalk-dim);font-size:.9rem;line-height:1.55;margin:0 0 12px}
.tool input{width:100%;background:var(--ink-deep);border:1px solid var(--rule);color:var(--chalk);
  padding:11px 13px;border-radius:var(--r-in);font:inherit;font-size:.95rem;font-family:"Montserrat",sans-serif;
  margin-bottom:8px}
.tool input:focus{border-color:var(--gold);outline:none}
.tool .flab{display:block;margin:10px 0 4px;font:700 .78rem/1.2 var(--display);color:var(--chalk-dim);
  letter-spacing:.02em}
html[data-font="nastaliq"] .tool .flab,html[data-font="naskh"] .tool .flab,html[data-font="deva"] .tool .flab{font-family:var(--face)}
.tool input.felt-feil{border-color:var(--gold-deep);box-shadow:0 0 0 1px var(--gold-deep)}
.tool .hint{font-size:.82rem;color:var(--chalk-dim);margin:0 0 14px}
/* Founder 16.10: navnet paa den som inviterte, i gull og stoerre - det er det
   foerste medlemmet skal kjenne igjen. Resten av linja er stille. */
/* Founder 16.10 (andre runde): gult navn var stygt. Navnet i hvitt som foer,
   blikkfanget er en gradient-ring med forbokstaven - samme sprak som resten. */
.spon .avi{width:34px;height:34px;border-radius:50%;background:var(--grad);color:#08080B;
  display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;
  font-family:var(--display);font-weight:900;font-size:.95rem;line-height:1;text-transform:uppercase}
.spon .who{color:var(--chalk);font-weight:800;font-size:1.02rem;letter-spacing:.01em}
/* Registrer-handlingen er primaer-flaten (samme som «Open your account»), ikke en hvit knapp. */
.spon .brk{flex:0 0 100%;height:0}
.spon .slab.reg{flex:0 0 auto;width:min(100%,430px);margin:10px 0 0;padding:14px 26px;min-height:52px}
.spon .slab.reg .t{font-size:.95rem;letter-spacing:.06em}
.spon .slab.reg .s{margin-top:3px;font-size:.86rem}
.spon .slab.own{flex:1 1 100%;margin:10px 0 0;padding:13px 18px;border-radius:var(--r-btn)}
#nn-who{margin:10px 0 0;padding:0;border:0;gap:8px;align-items:center}
#notice-none .slab.reg{display:block;margin:12px 0 2px;padding:13px 22px;min-height:50px}
#notice-none .slab.reg .t{font-size:.98rem;letter-spacing:.05em}
#notice-none .slab.reg .s{margin-top:3px;font-size:.86rem}
.ib .slab.own{display:block;margin:12px 0 0;padding:13px 18px;border-radius:var(--r-btn)}
.tool button{width:100%;max-width:430px;display:block;background:var(--grad);color:#08080B;border:0;padding:13px 16px;min-height:50px;
  border-radius:999px;font:800 1rem/1.15 var(--display);cursor:pointer;position:relative;overflow:hidden;
  box-shadow:0 8px 24px -8px rgba(21,216,196,.4), 0 8px 26px -6px rgba(194,31,191,.42),
    inset 0 1px 0 rgba(255,255,255,.5), inset 0 -3px 8px rgba(0,0,0,.2)}
.tool button::after{content:"";position:absolute;top:0;inset-inline-start:-30%;width:45%;height:100%;
  background:linear-gradient(105deg,transparent,rgba(255,255,255,.3) 50%,transparent);
  transform:skewX(-20deg);pointer-events:none}
.tool button:hover,.tool button:focus-visible{filter:brightness(1.1);outline:none}
.tool button:active{transform:scale(.985)}
.out{margin-top:14px;padding:14px 15px;background:var(--ink-deep);border:1px solid var(--rule);
  font-size:.8rem;word-break:break-all;line-height:1.7}
.out b{display:block;color:var(--gold-soft);margin-bottom:6px;font-size:.85rem}
.out.bad b{color:var(--gold-soft)}

.risk{max-width:var(--measure);margin:56px 0 0;padding-top:20px;border-top:1px solid var(--rule);
  color:var(--chalk-dim);font-size:.95rem}
.legal{max-width:var(--measure);margin:18px 0 0;color:var(--chalk-dim);opacity:.8;
  font-size:.9rem;line-height:1.7}
.legal p{margin:0 0 10px}
.legal p:last-child{margin-bottom:0}
.sig{margin:30px 0 0;font-size:.8rem;color:var(--chalk-dim);font-family:"Montserrat",sans-serif}

/* Overskrifter i ikke-latinsk skrift bruker spraakets egen skrift. */
html[data-font="nastaliq"] .sec h3,html[data-font="naskh"] .sec h3,
html[data-font="deva"] .sec h3,html[data-font="nastaliq"] .notice h2,
html[data-font="naskh"] .notice h2,html[data-font="deva"] .notice h2{font-family:var(--face);letter-spacing:0}
/* Lange forklaringer deles i avsnitt med tomme linjer i innholdet. */
.sec p{white-space:pre-line}
/* Skriftvalg under spraakraden: lite, men tydelig nok til aa oppdages. */
.script{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.script[hidden]{display:none}
.script button{font:600 .82rem/1.2 Montserrat,system-ui,sans-serif;padding:7px 13px;border-radius:999px;
  border:1px solid var(--rule);background:none;color:var(--chalk-dim);cursor:pointer}
.script button[dir=rtl]{font-family:"Noto Nastaliq Urdu","Noto Naskh Arabic",serif;font-weight:400}
.script button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#fff}
/* ---------- visninger ----------
   Kategorien er et attributt paa .shell. `hidden` (render sin) vinner alltid. */
.shell[data-view] .sec[data-cat]{display:none}
.shell[data-view="start"] .sec[data-cat="start"],
.shell[data-view="learn"] .sec[data-cat="learn"],
.shell[data-view="earn"]  .sec[data-cat="earn"],
.shell[data-view="tools"] .sec[data-cat="tools"],
.shell[data-view="faq"]   .sec[data-cat="faq"],
.shell[data-view="ib"]    .sec[data-cat="ib"]{display:block}
/* Inne i en kategori er «Start her» allerede lest. Sponsorlinja blir staaende:
   den sier hvem lenka tilhoerer, og det gjelder paa hver side. */
.shell[data-view]:not([data-view="menu"]) .hero h1,
.shell[data-view]:not([data-view="menu"]) .hero > p{display:none}
.shell[data-view]:not([data-view="menu"]) .hero{padding:18px 0 0}
/* Varslene hoerer hjemme der beslutningen tas: forsiden og «Kom i gang». */
.shell[data-view]:not([data-view="menu"]):not([data-view="start"]):not(.conflict) .notices{display:none}
/* Paa forsiden er «ingen sponsorlenke» bare overskriften - ellers fyller den
   hele foerste skjerm og menyen havner under bretten. Hele forklaringen staar
   i «Kom i gang». Konflikt-valget beholdes helt: det krever et svar. */
.shell[data-view="menu"] #notice-none p{display:none}
.shell[data-view="menu"] #notice-none p.ownhint{display:block}
/* ---- Kort inntjeningsguide (s-ibq) ---- */
#s-ibq .iqh{margin:26px 0 10px;font:800 1.05rem/1.25 var(--display)}
.iqnote{margin:8px 0 0;font-size:.86rem;color:var(--chalk-dim)}
.iqflow{display:flex;align-items:stretch;gap:6px;margin-top:14px}
.iqnode{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;
  padding:14px 6px;border-radius:16px;background:var(--ink-raise,rgba(127,127,127,.06));border:1px solid var(--rule)}
.iqnode strong{font:800 .92rem/1.2 var(--display)}
.iqnode span:last-child{font-size:.78rem;line-height:1.3;color:var(--chalk-dim)}
.iqic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--grad);color:#fff;margin-bottom:4px}
.iqic svg{width:24px;height:24px}
.iq-coin .iqic{background:linear-gradient(135deg,#FBE16B,#E3B505);color:#3a2a00}
.iqarr{flex:0 0 18px;align-self:center;position:relative;height:2px;background:var(--rule)}
.iqarr::after{content:"";position:absolute;inset-inline-end:-1px;top:-4px;border:5px solid transparent;border-inline-start:6px solid var(--rule)}
.iqarr i{position:absolute;top:-2px;width:6px;height:6px;border-radius:50%;background:var(--gold-soft,#15D8C4);animation:iqdot 2.4s linear infinite}
.iqarr.sm{flex-basis:26px}
@keyframes iqdot{from{inset-inline-start:0;opacity:0}20%{opacity:1}to{inset-inline-start:100%;opacity:0}}
.iqsteps{list-style:none;margin:0;padding:0;counter-reset:iq;display:grid;gap:10px}
.iqsteps li{counter-increment:iq;position:relative;padding:14px 14px 14px 58px;border-radius:16px;border:1px solid var(--rule)}
html[dir="rtl"] .iqsteps li{padding:14px 58px 14px 14px}
.iqsteps li::before{content:counter(iq);position:absolute;inset-inline-start:14px;top:14px;width:30px;height:30px;border-radius:50%;
  display:grid;place-items:center;background:var(--grad);color:#08080B;font:900 .95rem/1 var(--display)}
.iqsteps h4{margin:3px 0 4px;font:800 1rem/1.25 var(--display)}
.iqsteps p{margin:0;font-size:.9rem;line-height:1.45;color:var(--chalk-dim)}
.iqbtn{display:inline-flex;align-items:center;gap:8px;margin-top:10px;min-height:40px;padding:0 16px;border-radius:999px;
  background:var(--grad);color:#08080B;font:800 .88rem/1 var(--display);text-decoration:none}
.iqbtn.ghost{background:linear-gradient(var(--ink),var(--ink)) padding-box,var(--grad) border-box;border:1.5px solid transparent;color:var(--chalk)}
.iqlad{display:grid;gap:6px}
.iqrow{display:grid;grid-template-columns:22px 1fr 52px;align-items:center;gap:8px;font-size:.85rem}
.iqrow .n{font:800 .8rem/1 var(--display);color:var(--chalk-dim);text-align:center}
.iqrow .bar{height:12px;border-radius:6px;background:var(--rule);overflow:hidden}
.iqrow .bar i{display:block;height:100%;width:var(--w);border-radius:6px;background:var(--chalk-dim);opacity:.35;
  transform-origin:left;animation:iqgrow .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d)}
.iqrow.on .bar i{background:var(--grad);opacity:1}
.iqrow .v{font:700 .82rem/1 var(--display);text-align:right;color:var(--chalk-dim)}
.iqrow.on .v,.iqrow.on .n{color:var(--chalk)}
@keyframes iqgrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.iqleg{display:flex;gap:16px;flex-wrap:wrap;margin-top:6px;font-size:.78rem;color:var(--chalk-dim)}
.iqleg span::before{content:"";display:inline-block;width:12px;height:8px;border-radius:4px;margin-inline-end:6px;background:var(--chalk-dim);opacity:.35}
.iqleg .on::before{background:var(--grad);opacity:1}
.iqex{padding:16px;border-radius:18px;border:1px solid var(--rule);background:var(--ink-raise,rgba(127,127,127,.06))}
.iqpair{display:flex;align-items:center;gap:8px}
.iqwho{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:10px}
.iqwho .avi{flex:0 0 38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--grad);color:#08080B;font:900 1rem/1 var(--display)}
.iqwho div{display:flex;flex-direction:column;min-width:0}
.iqwho strong{font:800 .95rem/1.2 var(--display)}
.iqwho div span{font-size:.78rem;line-height:1.3;color:var(--chalk-dim)}
.iqex > p{margin:14px 0 0;font-size:.95rem;line-height:1.5}
.ibmore{margin-top:4px;border:1px solid var(--rule);border-radius:16px;padding:0 14px}
.ibmore > summary{cursor:pointer;min-height:52px;display:flex;align-items:center;font:800 .95rem/1.2 var(--display);list-style:none}
.ibmore > summary::-webkit-details-marker{display:none}
.ibmore > summary::after{content:"+";margin-inline-start:auto;font-size:1.3rem;color:var(--chalk-dim)}
.ibmore[open] > summary::after{content:"\2212"}
.ibmore #ibmore-in > .sec{padding-inline:0;border:0;margin:0}
@media (prefers-reduced-motion:reduce){.iqarr i,.iqrow .bar i{animation:none}}
.iqtree{display:grid;gap:10px;padding:14px;border-radius:18px;border:1px solid var(--rule)}
.iqlvrow{display:grid;grid-template-columns:132px 1fr;align-items:center;gap:12px}
.iqlvrow.me{grid-template-columns:132px 1fr}
.iqlvrow .dots{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.iqlvrow .dot{width:12px;height:12px;border-radius:50%;background:var(--grad);animation:iqpop .4s ease both;animation-delay:var(--d)}
.iqlvrow .dot.l2{opacity:.8;width:10px;height:10px}.iqlvrow .dot.l3{opacity:.6;width:8px;height:8px}
.iqlvrow .dot.me{width:34px;height:34px;display:grid;place-items:center;margin:0 auto;color:#fff;animation:none}
.iqlvrow .dot.me svg{width:20px;height:20px}
.iqlvrow .lbl{display:flex;flex-direction:column}
.iqlvrow .lbl strong{font:800 .92rem/1.2 var(--display)}
.iqlvrow .lbl span{font-size:.85rem;color:var(--chalk-dim)}
@keyframes iqpop{from{transform:scale(0)}to{transform:scale(1)}}
.iqun{display:grid;gap:8px}
.iqucard{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;border:1px solid var(--rule)}
.iqucard .lock{font-size:1.5rem;line-height:1}
.iqucard div{display:flex;flex-direction:column;gap:2px}
.iqucard .if{font-size:.85rem;color:var(--chalk-dim)}
.iqucard strong{font:800 .95rem/1.3 var(--display)}
.iqstairs{display:grid;gap:12px}
.iqtrack{padding:14px;border-radius:18px;border:1px solid var(--rule)}
.iqtrack .tt{margin:0 0 10px;font-size:.85rem;color:var(--chalk-dim)}
.iqtrack .steps{display:flex;align-items:flex-end;gap:6px}
.iqtrack .step{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.iqtrack .step i{display:block;width:100%;height:var(--h);border-radius:8px 8px 3px 3px;background:var(--grad);transform-origin:bottom;animation:iqrise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d)}
.iqtrack.b .step i{background:linear-gradient(180deg,#FBE16B,#C21FBF)}
.iqtrack .step b{font:800 .8rem/1.1 var(--display);text-align:center}
.iqtrack .step span{font-size:.7rem;color:var(--chalk-dim);text-align:center;white-space:nowrap}
@keyframes iqrise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.iqrb{margin:0;font-size:.92rem;line-height:1.5}
.short .iqic.emo{background:var(--ink-raise,rgba(127,127,127,.08));border:1px solid var(--rule);font-size:1.35rem;line-height:1}
.shchips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.shchip{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:14px 6px;border-radius:16px;border:1px solid var(--rule);animation:iqpop .45s ease both;animation-delay:var(--d)}
.shchip b{font:900 1.35rem/1 var(--display);background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.shchip span{font-size:.75rem;line-height:1.3;color:var(--chalk-dim)}
.short .iqex > p{margin:0}
.shmore{margin-top:18px}
/* Academy-kort (founder 17.10 20:15) */
#academy summary{display:flex !important;align-items:center;gap:12px}
#academy .lic{position:relative;flex:0 0 46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:1.35rem;
  background:linear-gradient(var(--ink),var(--ink)) padding-box,var(--grad) border-box;border:1.5px solid transparent}
#academy .lic b{position:absolute;top:-6px;inset-inline-start:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--grad);color:#08080B;font:900 .7rem/20px var(--display);text-align:center}
#academy .ltx{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
#academy .ltx .lt{font-weight:800}
#academy .lok{flex:0 0 auto;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#16C47F;color:#08080B;font-weight:900;font-size:.85rem}
#academy summary.done .lic{opacity:.85}
#academy .lpro{display:flex;align-items:center;gap:10px;margin:0 0 12px;font:800 .82rem/1 var(--display);color:var(--chalk-dim)}
#academy .lpro i{flex:1;height:6px;border-radius:3px;background:var(--rule);overflow:hidden}
#academy .lpro i b{display:block;height:100%;background:var(--grad);border-radius:3px}

.snhalal{margin-top:18px;padding:14px 16px;border-radius:18px;border:1px solid var(--rule);background:var(--ink-raise,rgba(127,127,127,.06))}
.snhalal h4{margin:0 0 4px;font:800 1rem/1.25 var(--display)}
.snhalal > p{margin:0 0 10px;font-size:.85rem;color:var(--chalk-dim)}
.snhalal ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.snhalal li{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;line-height:1.4}
.snhalal li .e{flex:0 0 22px;font-size:1.05rem;line-height:1.3}

.snspark{display:flex;align-items:flex-end;gap:3px;height:84px;padding:10px;border-radius:16px;border:1px solid var(--rule)}
.snspark i{flex:1 1 0;height:var(--h);border-radius:3px 3px 1px 1px;background:linear-gradient(180deg,#15D8C4,#1B4FD8);transform-origin:bottom;animation:iqrise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d)}
.snyears{display:flex;justify-content:space-between;font-size:.72rem;color:var(--chalk-dim);margin-top:4px;padding:0 4px}
.sncalc{padding:14px;border-radius:18px;border:1px solid var(--rule);background:var(--ink-raise,rgba(127,127,127,.06))}
.sncalc .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:.9rem;color:var(--chalk-dim)}
.sncalc .row b{font:900 1.1rem/1 var(--display);color:var(--chalk)}
.sncalc .row.big{margin-top:12px}
