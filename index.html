n:"assets/logo-ff.png"},{url:"https://matrix.to/#/%23aimpire:matrix.org",en:["Aimpire group","Questions and news — opens in Element X"],icon:"assets/app-element.jpg"},{url:"https://instagram.com/aim.pire",en:["Instagram","@aim.pire — what we are up to"],icon:"assets/logo-ig.png"}]},guide:{en:{lede:"Steps 1–4 take about fifteen minutes. Have your ID card or passport ready.\nThen you wait for approval. The rest you do when it suits you — the page remembers where you stopped.",steps:[["Use your sponsor's link","Open the link your sponsor sent you — their own link, not one from a group.\nRight below you see your sponsor's name and a six-character code — then you are on the right link.\nNo such line? Ask your sponsor to send you their link before you go on.",{check:"Your sponsor's name and the code show right below. If nothing shows, no sponsor is attached to you."}],["Create your account","Tap «Register with us now» right below. CopyX opens in a new tab.\nFill in the form the way the numbers on the picture show, wait for «Verifying…» to finish, then press Sign Up.\nOpen the email you get and tap the confirmation link. Not in your inbox? Check spam.",{img:"assets/shot-register.jpg",alt:"The CopyX sign-up form",marks:[{n:1,x:24,y:32,t:"Your real name. It must match the ID you upload later, or verification fails."},{n:2,x:24,y:45,t:"A password you use nowhere else. Not your email password."},{n:3,x:9,y:66,t:"Tick both. Read them first — they say you can lose money."},{n:4,x:50,y:87,t:"If you see this yellow box, your link was missing the invite code. Go back and open your sponsor's link instead."},{n:5,x:24,y:56,t:"This is set to Albania for everyone. Change it — the phone code follows it."}],check:"You tapped the link in the email and are asked to log in."}],["Link your broker account — this step matters","Just confirmed your email? Log in to the IB Portal (AiTech) with the button below and scroll down to the third green box, CopyX Registration.\nThe first time, the button in the box says Register to CopyX. Press it — that is how your Tag Markets account is created. Once it is done, the button says Login to CopyX.\nDo not create it anywhere else — an account made elsewhere is not linked, and nothing tracks correctly.",{video:{url:"https://drive.google.com/file/d/1KrEU9XkoVflSNhCXUtmHzx-wY0q_RBB1/view",label:"Watch this step"},note:"The portal says it too: use only that button.",img:"assets/shot-copyx-register.jpg",alt:"The CopyX Registration panel in the IB Portal",marks:[{n:1,x:34,y:37,t:"Read this line. It tells you to create the broker account from here, not anywhere else."},{n:2,x:13,y:71,t:"This is the button. The first time it says Register to CopyX. This picture was taken afterwards, so here it says Login to CopyX."},{n:3,x:50,y:90,t:"The warning in yellow: a Tag Markets account made directly on CopyX will not be linked."}],check:"The button in the box now says Login to CopyX — your Tag Markets account is created and linked. From now on you log in to Tag Markets directly, with the same username and password."}],["Verify your identity","You need your ID card or passport, plus a face scan.\nPhotograph the document in good light with all four corners visible — a blurry photo is the usual reason for rejection.",{img:"assets/shot-kyc.jpg",alt:"The Upload Documents panel",marks:[{n:1,x:50,y:44,t:"Pick the document type here first. Nothing uploads until you do."},{n:2,x:50,y:75,t:"This yellow line is normal before you upload. It is not an error."},{n:3,x:90,y:5,t:"Validate means the broker has not checked your documents yet."}],check:"The yellow «upload» line is gone and your document shows as submitted. «Validate» only means the broker has not looked yet. You don't need to press anything."}],["Wait for approval","Approval usually takes a short while.\nUntil then you cannot deposit — the notice on the wallet page is normal, not an error.",{img:"assets/shot-wallet-kyc.jpg",alt:"The wallet page showing that KYC must be completed first",marks:[{n:1,x:50,y:30,t:"This pink line means verification is still pending. It disappears once your documents are approved."}],check:"The pink line on the wallet page is gone and Deposit can be pressed."}],["While you wait: install the two apps","Use the wait to install two apps, from the official stores only — the buttons below go straight there.\nMetaTrader 5, to see your account (step 9).\nElement X, for the Aimpire group (step 10).\nTag Markets, CopyX and the IB Portal run in your browser. Never install a «Tag Markets app» someone sends you.",{appcards:!0,check:"Both apps open on your phone. You do not need to log in yet."}],["Put money in","Have the crypto ready in your wallet first — the address you get works for about 15 minutes.\nIn the Tag Markets portal, press Deposit and choose the amount and the crypto. Send a little more than $10, for example $12 on a low-fee network — fees are taken on the way, and at least $10 has to arrive.\nPress copy next to the address, paste it into your wallet (Binance, RedotPay or similar) and check that the first four and last four characters match.\nTime ran out? Get a new address — never reuse the old one.",{note:"Pick the same network in your wallet as the payment page shows.\nCheapest: Solana and Polygon (under a cent), then BNB (BEP20, 10–30 cents) and TRON (TRC20, around $1–1.5). Ethereum (ERC20) costs the most. Bitcoin and Polkadot also work — Arbitrum does not.\nWe recommend crypto: it arrives within 2–3 hours. A card takes 6–8 working days and is often declined; bank transfer exists only in the EU (from $500). Check what is allowed where you live.",check:"The amount shows on the wallet page in the Tag Markets portal, usually within 2–3 hours. Your wallet may show «Pending» for a while — up to 24 hours. Still missing after that? Check the transaction in your wallet, and ask your sponsor.",clip:{src:"assets/video/steg6-innskudd.mp4",poster:"assets/video/steg6-innskudd.jpg",secs:71},p2p:!0}],["Connect to Sonic copy trading","This step starts the copying — until then, nothing trades.\nIn Tag Markets open CopyX, find SONIC and press Details. The card shows the terms: 30 % performance fee, one month minimum, no management fee and no joining fee.\nPress Connect, enter your amount (minimum $10) and choose Amplify.\nUnder Community Token type #Aitech, press Verify, enter 000000 in Hash and press Submit.\nTick both boxes and press Copy Now.",{note:"With the token the account trades at 24× — our $109 traded as $2,616 — and it stops by itself at a 5 % drop instead of 10 %. Put in an amount you can afford to lose.",codes:[{label:"Community token",value:"#Aitech"},{label:"Hash",value:"000000"}],check:"«CopyX Account Created» appears — press Continue, and SONIC shows on your dashboard. Amount $0? Submit did not go through — do Connect again from the start, and ask your sponsor if it happens again.",clip:{src:"assets/video/steg7-sonic.mp4",poster:"assets/video/steg7-sonic.jpg",secs:65},quiz:{q:"Your deposit trades at 24×. The trading balance falls 4.2 %. How much of your deposit is left?",a:["Almost all of it","None of it"],right:1,why:"None of it. At 24×, a 4.2 % fall in the balance is your whole deposit — our $109 traded as $2,616. The account closes by itself at 5 %. The amount you put in is the part you control."}}],["See your account in MetaTrader 5","In the Tag Markets portal open MT5 Credentials: account number, Master Password, Investor Password.\nIn MetaTrader 5 add an existing account, search for T.M. Financials Ltd and choose TMFinancials-Server.\nYour login is the account number, and the password is the Investor Password — you see everything but cannot trade by accident. Then you see Balance, Equity and Free Margin.",{note:"The Master Password can trade; the Investor Password can only look. Never give anyone your Master Password. If someone needs to check your results, give them the Investor Password.",apps:{lede:"Install MetaTrader 5 for your phone:",items:[{os:"Android",url:"https://play.google.com/store/apps/details?id=net.metaquotes.metatrader5"},{os:"iPhone",url:"https://apps.apple.com/app/metatrader-5/id413251709"}]},check:"Balance matches the Tag Markets portal and is 24 times the amount you connected to Sonic in step 8 — our $109 showed as $2,616. Not 24 times? Stop and ask your sponsor.",clip:{src:"assets/video/steg8-mt5.mp4",poster:"assets/video/steg8-mt5.jpg",secs:51},vpn:{t:"Can't find T.M. Financials Ltd in the search? In Pakistan and some other countries the network blocks the search. Turn on the free 1.1.1.1 app from Cloudflare while you search, and turn it off once the account is added. In Norway, the UK and similar countries you don't need it.",h:"Free: 1.1.1.1 (Cloudflare)"}}],["Join the group","Questions get answered in the group — nobody there started out knowing anything.\nAdding more money later? Add a little at a time.",{apps:{lede:"Install Element X — that exact app, not Element Classic and not another chat app. Make an account, any username. Then come back here and tap Join the Aimpire group.",items:[{os:"Android",url:"https://play.google.com/store/apps/details?id=io.element.android.x"},{os:"iPhone",url:"https://apps.apple.com/app/element-x/id1631335820"}]},join:{url:"https://matrix.to/#/%23aimpire:matrix.org",label:"Join the Aimpire group"},check:"You can read the messages, not just see the group's name."}]],quiz_t:"Quick check",quiz_again:"Have another look —",phases:[["Set up",0,3],["Waiting",4,5],["Running",6,9]]}},langs:[{code:"en",label:"English",dir:"ltr",font:"latin"},{code:"no",label:"Norsk",dir:"ltr",font:"latin"},{code:"hi",label:"हिन्दी",dir:"ltr",font:"deva"},{code:"ar",label:"العربية",dir:"rtl",font:"naskh"},{code:"ur",label:"اردو",dir:"rtl",font:"nastaliq"},{code:"ar_rm",label:"Roman Arabic",dir:"ltr",font:"latin",bcp:"ar-Latn",roman_of:"ar"},{code:"ur_rm",label:"Roman Urdu",dir:"ltr",font:"latin",bcp:"ur-Latn",roman_of:"ur"}],earn_shot:{img:"assets/shot-commission.jpg",alt:{en:"The commissions overview in the IB Portal"},marks:{en:[{n:1,x:22,y:55,t:"This is where your real numbers live. If a figure in a chat message does not match this screen, this screen is right."}]}},places:{title:{en:"Three places, three names"},lede:{en:"Three places, one login: CopyX, the IB Portal (AiTech) and Tag Markets use the same username and password. Knowing what each place is for spares you most of the confusion."},items:{en:[["CopyX","The platform that copies the traders. You create this first, in step 2."],["IB Portal (AiTech)","Where your team and your numbers live. Same login as CopyX."],["Tag Markets","The broker — the company that actually holds your money. The account is created from the IB Portal in step 3; after that you log in here directly, with the same username and password."]]}},guide_ui:{en:{copy:"Copy",copied:"Copied",progress:"{done} of {total} steps done",reset:"Clear",check:"You know it worked when",mark:"Mark this step done",marked:"Done — tap to undo",left:"{n} left",next:"Next: {t}",all_done:"All {total} steps done. You are set up.",all_done_go:"Next: how Sonic works",watch:"See it on screen — {s} seconds",stuck:"Stuck? Ask your sponsor — the person who sent you the link — or in ❓ Questions, in any language.",ask_btn:"Ask {N} for help",ask_msg:"Hi {N}, I need help with step {n} of 10 in the Aimpire guide: «{t}». Can you help me?",read_btn:"Read aloud",read_stop:"Stop",ask_gen:"Hi {N}, I need a little help with Aimpire. Do you have a moment?",portal_btn:"Log in to the IB Portal (AiTech)",cont_label:"Your setup · step {n} of {total}",cont_go:"Continue where you left off",tm_btn:"Log in to Tag Markets"},_stuck_url:"https://matrix.to/#/%23aimpire-questions:matrix.org"},learn:{intro:{en:"You do not need any of this to let Sonic run. It is here for when you want to understand what you are looking at. Tap any word to open it."},labels:{en:["Example","Why it matters","Formula"]},terms:{en:[["Pip","The unit a price moves in — the fourth decimal on most pairs.","On EUR/USD, 1.0850 → 1.0851 is one pip. At 0.01 lots that is $0.10.","Every target and result you hear is quoted in pips, and a number of pips means nothing until you know the lot size behind it.","pip value = lots × $10   (USD-quoted pair)","pip"],["Point","A tenth of a pip. Some platforms quote points instead.","«+500 points» on EUR/USD is 50 pips. At 0.01 lots that is $5, not $500.","This is the mix-up that makes a modest result look ten times bigger. Check the unit before you compare your numbers to anyone's.","pips = points ÷ 10",""],["Spread","The gap between the buy price and the sell price. You pay it the moment you enter.","Buy 1.08515, sell 1.08500 is 1.5 pips. At 0.01 lots, $0.15 per trade.","Every trade starts behind by the spread, win or lose. Ten trades a day on a small account is a real cost.","spread cost = spread in pips × pip value","spread"],["Lot size","How much you trade. This decides what one move is worth — and it is not the same number on every instrument.","EUR/USD: 1.00 lot ≈ $10 per pip, 0.01 ≈ $0.10. Gold (XAUUSD): 1.00 lot = 100 oz, so a $1 move is $100.","This is the one number that decides whether an ordinary move is an irritation or the end of the account — and the figure differs per instrument. Sonic's own record shows it trades gold, not a currency pair. Before you size anything, check the real value: in MT5, open the symbol's Specification (on a computer, right-click the symbol).","pip/point value = lots × contract size × tick     EURUSD → $10 · XAUUSD → $100","lot"],["Leverage and margin","Leverage is how big a position you may hold. Margin is the part of your money locked while it is open.","A 0.01 lot EUR/USD position is about $1,085 of currency. At 1:300 that ties up roughly $3.60 of yours.","Higher leverage does not reduce risk. It only frees margin so you are allowed to open more.","margin = lots × 100,000 × price ÷ leverage",""],["Balance and equity","Balance is money from trades already closed. Equity is that plus or minus everything still open.","Balance $100, one trade 40 pips against you at 0.01 lots (−$4) → equity $96.","Balance is history. Equity is where you actually stand. A floating loss is a real loss not yet written down.","equity = balance + open profit − open loss",""],["Margin call and stop out","When equity falls far enough against the margin your trades need, the broker closes them for you.","A $100 account carrying a $60 floating loss has $40 of equity left.","At a stop out you do not choose the exit. The loss is locked in at that moment, often at the worst point.","margin level = (equity ÷ used margin) × 100 %",""],["Stop-loss","A standing instruction to close at a price you picked in advance, so the loss stops growing.","Buy at 1.0850 with a stop at 1.0830 is 20 pips. At 0.01 lots, $2 at risk — decided before you entered.","Without one, the size of your loss is set by how long you can stand to look at it.","risk = stop in pips × pip value",""],["Limit and stop orders","A limit waits for a better price. A stop only triggers once price pushes through a level.","Price 1.0850. Buy Limit 1.0830 fills if price falls. Buy Stop 1.0870 fills if price rises.","Signals are posted in this shorthand: Buy Limit, Buy Stop, Sell Limit, Sell Stop. Pick the wrong one of the four and it either never triggers, or opens your trade at the wrong moment."],["Risk per trade","The money — not the pips — you accept losing on one trade.","$100 account, 0.01 lots, 20-pip stop = $2 at risk. That is 2 percent.","On a $100 account the smallest tradable size already risks several percent per trade. The «risk 1 percent» advice does not fit yet.","lots = risk in $ ÷ (stop in pips × $10)","size"],["Drawdown","How far equity has fallen from its highest point, in percent.","$100 down to $60 is 40 percent down. Getting back to $100 needs a 67 percent gain, not 40.","Losses and recoveries are not symmetrical. A run of small losses can leave you needing a return you have never produced.","gain needed = loss ÷ (1 − loss)   →   40 % lost needs 67 % back","dd"],["Compounding","Leaving gains in, so position size grows with the balance instead of staying fixed.","$100 at 5 percent a month, profit left in, is about $180 after a year rather than $160.","It is the honest argument for patience on a small account — and the engine of every unrealistic plan you will be shown.","final = start × (1 + rate)^periods",""]]}},academy:{title:{en:"Aimpire Academy"},lead:{en:"Longer lessons, one honest topic at a time. Everything here is for learning — nothing is advice."},lessons:[{id:"size",title:{en:"Pips and lot size"},sub:{en:"How much one move actually costs you"},blocks:{en:[["What a pip is worth","On EUR/USD a pip is the fourth decimal: 1.0850 → 1.0851. With 1.00 lot a pip is about $10; with 0.01 lot, about $0.10. Gold is quoted differently: with 1.00 lot, a $1 move in the gold price is about $100 — so think in dollars, not pips, for gold and oil."],["The formula","Two lines, and they decide the size — not your mood. Always round down to the smallest lot step, usually 0.01.","Risk in $ = account × risk % / 100\nLots = risk in $ / (stop distance in pips × pip value per lot)"],["A real sum with small money","Account $100, risk 2 % = $2. Stop 20 pips away on EUR/USD. That is 0.01 lots — the smallest size there is. This is why small accounts have no room for wider stops or bigger sizes: the sum sets the size, not courage.","$2 / (20 × $10) = 0.01 lots"],["The 0.01 floor","If the formula gives less than 0.01 — say account $50 and a 40-pip stop → 0.0025 lots — then even the smallest size risks more than you chose. The honest options: a closer stop with a reason, or letting that trade go. Forcing 0.01 anyway makes your risk % a wish, not a setting."],["Points are not pips","Some platforms count in points: 10 points = 1 pip. A «100 points» move is 10 pips. Mixing them up makes every sum wrong by a factor of ten — check which one your platform shows."],["Check your platform","Contract sizes differ between brokers, especially for oil and indices. In MT5: right-click the symbol → Specification. Two minutes that protect every sum you will ever make."],["What leverage changes — and what it does not","Leverage decides how much of your money the broker sets aside as margin to open a trade — not what a pip is worth. 0.01 lot of EUR/USD is about $1,085 of currency: at 1:500 that needs about $2.17 of margin, at 1:30 about $36. The profit or loss per pip is the same $0.10 either way. What high leverage changes is how small a balance can open a big size — and how fast a losing run reaches the stop-out level, where the broker closes your trades for you. Limits on leverage differ from country to country — check what applies where you live.","Margin = lots × contract size × price / leverage\n0.01 × 100,000 × 1.0850 / 500 = $2.17"]]},quiz:{en:{q:"Account $100, risk 2 %, stop 20 pips on EUR/USD. What size fits?",a:["0.01 lot","0.10 lot","1.00 lot"],right:0,why:"$2 ÷ (20 pips × $10 per lot) = 0.01 lot. With 0.10 lot the same stop would cost $20 — a fifth of the account."}}},{id:"mind",title:{en:"Trading psychology"},sub:{en:"The part nobody wants to read"},blocks:{en:[["Losing and recovering are not symmetrical","Lose 10 % and you need 11 % to get back. Lose 50 % and you need 100 %. This is why the first job is never «win more» — it is «lose small». Every rule in this community about small risk comes from this one sum."],["How to recognise an income claim","Posts that show a bot, a balance and a dream have a pattern: a best month, but no test period, no largest loss, no result on data the system never saw. One question punctures most of them: «where is the test?» When one widely shared «AI bot» was rebuilt exactly as described and run on three years of real data, it lost 82 %."],["Ask for the test, not the screenshot","A screenshot shows a moment. A test has a period, a largest drawdown, and results on data the system never saw. Fewer than 20 trades is not a record, it is a tendency. These questions are not rude — anyone with something real answers them gladly."],["News windows","Around big scheduled news (rate decisions, jobs numbers) the price can jump and the spread widen. A calm habit: know this week's «High» events from the calendar, and expect the 15 minutes before and after to be wild. Not a rule we enforce — a habit that saves beginners from their worst prices."],["The tool is not the decision","Copy trading and AI tools can watch, read and suggest — but the account, the risk and the decision stay yours. Use the tool to understand more, never to look away. If you cannot explain why a position is open, that is the signal to learn — not to add money."],["When it hurts","After a loss the strongest urge is to win it back at once — same day, bigger size. That urge has emptied more accounts than any bad strategy. The habit that works: write the loss down, close the platform, and come back tomorrow with the same small risk as always."]]},quiz:{en:{q:"You lost 50 %. How much must you gain to get back to where you started?",a:["50 %","100 %","75 %"],right:1,why:"Half of $100 is $50, and $50 has to double to reach $100 again. Losing and recovering are not symmetrical."}}},{id:"time",title:{en:"When the market moves"},sub:{en:"Sessions, overlaps and the daily change"},blocks:{en:[["A market that almost never sleeps","Currencies trade around the clock from Sunday evening to Friday evening, New York time. About $9.6 trillion changes hands each day (BIS, April 2025), and three quarters of it goes through trading desks in the United Kingdom, the United States, Singapore and Hong Kong. That is why the working hours of those places matter to you."],["Four sessions","Sydney, Tokyo, London and New York each have their own working day. The market tends to be calmer when only one of them is open, and busier when two overlap. The clock under Tools shows all four in your own time, and it adjusts by itself when Europe and the US change to winter time."],["The overlap","When London and New York are both open, more people trade at the same time, and prices often move further in those hours. That makes them good hours to watch and learn — and it also means a stop can be reached faster."],["The daily change","At 17:00 New York a new trading day starts. A position you hold past that moment pays or earns swap. Many brokers charge three days of swap on Wednesday, to cover the weekend. Check the swap for your instrument in MT5 before you keep a trade open overnight."],["News can beat the clock","A scheduled release, such as an interest-rate decision, can move a quiet hour more than a busy one. Look at the week's High events in the news calendar, and remember that its times are New York time."],["What this is not","Busy hours are not «good hours to trade». They are hours when more happens, in both directions. Knowing them helps you understand what you see — it does not tell you what to do."]]},quiz:{en:{q:"London and New York are both open. What does that usually mean?",a:["Prices are sure to rise during those hours","More trading, often bigger moves both ways","The market is quiet and moves little"],right:1,why:"More trading at the same time often means bigger moves, in both directions. A stop can be reached faster too."}}},{id:"gold",title:{en:"Gold: what moves it"},sub:{en:"Four drivers, and why one move has many reasons"},blocks:{en:[["Why gold, here","The strategy described in this hub trades gold (XAU/USD), not a currency pair. Gold behaves differently from EUR/USD — in what moves it, in how big a move is, and in what it costs to hold."],["Four kinds of driver","The World Gold Council sorts what moves gold into four groups: economic expansion, risk and uncertainty, opportunity cost (for example interest rates and the dollar), and momentum (money flowing in or out, and how traders are positioned). Usually several of them pull at the same time."],["One month, several reasons","In September 2026 gold fell 8.5 %, to $4,176. In the same month the US 10-year interest rate rose by 0.53 percentage points and the dollar index rose 2 % — and yet about $10 billion flowed into gold funds (World Gold Council, 7 October 2026). A single headline rarely explains a move."],["Think in dollars, not pips","On gold, a $1 move in the price is about $100 for 1.00 lot and about $1 for 0.01 lot. Platforms and websites count «pips» and «points» on gold in different ways, so the same move can show up as very different numbers. The dollar amount is what reaches your account."],["Holding gold overnight","Gold has its own swap rate, separate from the currency pairs. Check the swap for XAU/USD in MT5 before you keep a gold trade open overnight, and check which day your broker charges three days."],["What this is not","Knowing the drivers helps you understand a move after it has happened. It does not tell you where gold goes next — nobody can promise that."]]},quiz:{en:{q:"The gold price moves $1. Roughly what is that for 0.01 lot?",a:["$0.01","$1","$100"],right:1,why:"About $1 for 0.01 lot and about $100 for 1.00 lot. On gold, think in dollars, not pips."}}},{id:"candle",title:{en:"Reading a candle"},sub:{en:"Four prices in one shape"},blocks:{en:[["What one candle is","Each candle on a chart is one slice of time — one minute, one hour or one day, depending on the timeframe you choose. It shows four prices from that slice: where it opened, the highest, the lowest, and where it closed."],["Body and wicks","The thick part, the body, runs from the open to the close. The thin lines above and below, the wicks, reach to the highest and lowest price. A long wick means the price went that far and came back within the same slice of time."],["Colour","If the close is higher than the open, the candle is usually green or white; if it is lower, usually red or black. Platforms let you change the colours, so read the open and close rather than trusting the colour alone."],["The timeframe changes the picture","The same hour can look calm on a daily chart and wild on a one-minute chart. When two people talk about «the chart», first ask which timeframe they mean."],["Try it in MT5","Open any symbol in MT5, choose candles as the chart type, and look at one candle's open, high, low and close — on a computer by pointing at it, on a phone with the crosshair. Switch between M1, H1 and D1 and watch how the same price moves look different."],["What this is not","A candle shows what has already happened. Names of candle «patterns» are everywhere online, but no single candle tells you what comes next — treat any such claim as something to test, not something to follow."]]},quiz:{en:{q:"A long wick above a candle shows that…",a:["the price is sure to fall next","the price went that high and came back","the platform showed a wrong price"],right:1,why:"A candle shows what happened in its slice of time — not what comes next."}}},{id:"corr",title:{en:"Two trades can be one"},sub:{en:"Why spreading out is not always spreading risk"},blocks:{en:[["Two pairs, one bet","EUR/USD and GBP/USD are two different pairs, but both have the US dollar on the same side. From October 2025 to October 2026 they moved in the same direction on 210 of 251 trading days — about 84 % (US Federal Reserve data, via FRED)."],["What that means for your risk","If you buy both, you have not spread your risk — you have placed roughly the same bet twice, on the dollar falling. Two trades that each risk 2 % can behave like one trade that risks close to 4 %."],["Pairs that move apart","When the dollar sits on the other side of a pair, as in USD/JPY, that pair often moves the opposite way to EUR/USD. So buying EUR/USD and selling USD/JPY is also, in large part, the same bet twice."],["The links change","These are tendencies, not rules. They shift over months and can break on a single news day. A figure from last year describes last year."],["A simple habit","Before you open a second trade, ask which currency you are really betting on in each one. If it is the same currency twice, add up the risk as if it were one trade."],["What this is not","Correlation tells you how pairs have moved together. It does not tell you which way either of them goes next."]]},quiz:{en:{q:"You buy EUR/USD and GBP/USD and risk 2 % on each. Roughly how much is at risk?",a:["About 2 %, because the risk is split","Close to 4 %, as they often move together","Nothing, because they cancel each other out"],right:1,why:"They moved the same way on 210 of 251 days in the past year. Often it is one bet placed twice."}}},{id:"swap",title:{en:"Swap: the cost of holding overnight"},sub:{en:"Why buying and selling can cost different amounts"},blocks:{en:[["What swap is","A position you keep open past 17:00 New York pays or earns swap for that night. It is an interest charge: holding a pair overnight means borrowing one currency and holding the other, and the broker adds its own margin on top."],["Buy and sell differ","The swap for buying and for selling the same instrument is usually not the same — one can be minus while the other is plus. The broker's own help centre listed XAU/USD at −42.14 points per night for buying and +21.92 for selling, and says «All the Swaps are shown in Points» (article dated 27 July 2024 — today's values can be different)."],["Three nights on one day","To cover the weekend, swap is charged three times on one weekday. Many brokers use Wednesday; check which day yours uses."],["Where you see it","In MT5, open the instrument's Specification to see «Swap long» and «Swap short». After the first night, the Swap column on your open trade shows what you actually paid or earned, in your account's own currency."],["Small numbers add up","A swap that looks small for one night can grow large over weeks, and on a small account it can eat a real share of the balance. Before you plan to hold a trade for days, multiply the nightly swap by the nights."],["What this is not","A plus swap is not free money. One normal price move can be far bigger than many nights of swap — the swap only tells you the cost or credit of waiting."]]},quiz:{en:{q:"Where in MT5 can you see the swap for buying and for selling an instrument?",a:["In Specification: Swap long and Swap short","In the news calendar","Only by asking the broker"],right:0,why:"Specification shows both. After the first night, the Swap column on your open trade shows what you actually paid or earned."}}},{id:"regime",title:{en:"Three kinds of market"},sub:{en:"Up, down and sideways — and why one method doesn't fit all three"},blocks:{en:[["Three things price can do","Over a period, price can go up, go down, or move back and forth without getting anywhere. The same method can make money in one of these and lose in another."],["Uptrend and downtrend","In an uptrend, each new high is above the last one, and so is each low. In a downtrend, the highs and lows get lower each time. For scale: in September 2026 gold fell 8.5 %, according to the World Gold Council. A fall on its own is not a downtrend — the test is whether the highs and lows got lower."],["Sideways","When price moves between a ceiling and a floor without breaking out, it is called sideways, or a range. It looks calm, but methods that follow the trend often do poorly here."],["Why the method matters","A grid is orders placed at fixed steps above and below a price. Set up to catch a trend, it does best when price runs one way and does poorly when price chops back and forth. Set up for a sideways market it is the opposite: it gains while price swings, but can build an ever bigger losing position if price keeps running one way."],["The trap: buying more as it falls","Methods that buy more each time price falls lower the average entry price — but they also raise the amount at stake. If the fall continues, each further step down costs more than the one before. That is why such methods need a limit where they stop."],["See it yourself","Open the gold chart under «Tools» → «Market hours», pick the daily chart (1D) and look at the last 20 candles. Are the highs rising, falling, or roughly level? You only see the answer afterwards — the market does not announce when it changes."],["What this is not","Naming the market describes what has happened. It does not say what happens tomorrow, and it is not a signal to buy or sell."]]},quiz:{en:{q:"A method buys more gold every time the price falls $10. Which market is most dangerous for it?",a:["A market moving sideways","A fall that keeps going without turning","A calm uptrend"],right:1,why:"Each new buy puts more at stake. If price doesn't turn, the loss grows with every step — that is why such methods need a stop."}}}]},amplify:{items:{en:[["What Sonic is, and the choice that is yours","Sonic is the strategy your account copies: its trades run in your account by themselves. It only runs amplified, on Amplify — there is no smaller version to start with. So the choice that protects you is the amount.\n\nPut in less if any of these is true: losing all of it would change your month; you have never watched a trade go against you; this is your first trading account.\n\nStart with an amount you could lose completely, and watch it for a few weeks. If you add money later, know that an upgrade restarts the 30-day clock on your deposit."],["Amplify: you trade a multiple of your deposit","Amplify is a funded account: you trade a multiple of what you put in, and it is real money. The broker's standard multiple is 12×; with the Aimpire token it is 24×.\n\nIn our own test, $109 became a trading balance of $2,616. The multiple works on losses exactly as it does on gains."],["When the account closes, in the platform's own words","«If the manager loses more than 10% of starting balance, your account will be liquidated.»\n\nWith the token, the form adds: «By using a token code, your Amplify account draw down limit will change to 5% of your starting balance.»\n\nIn money: your $109 trades as $2,616. A fall of 1 ÷ 24 = 4.2 % in that balance equals your whole $109 — before the 5 % line is even reached. The line is a hard trigger: the account closes by itself, with no waiting for prices to come back. That is why the amount matters most."],["The Aimpire token: #Aitech, then 000000","The community token field is where Aimpire's token goes. Type #Aitech, press Verify, then enter 000000 in the Hash field that appears. Without a valid token the account opens at 12× with the 10 % line, instead of 24× with the 5 % line. Check that the tick shows before you press Copy Now."],["What the platform says about who is responsible","Before you can submit, you tick a box that says trades on CopyX are provided by traders unaffiliated with Tag Markets, and that Tag Markets bears no responsibility or liability for the trades or their outcomes. Read it before you tick it. It means the broker holding your money is not answerable for what the strategy does with it."],["What you keep when it makes money","The presentation gives the split as 70 / 5 / 25, marked «per trade»: 70 % of the profit to you, 5 % to the developers who run the system, 25 % to what it calls «the team» — «How the bonus model is drawn» shows that part. On the Sonic card it shows as a 30 % performance fee, with no management fee and no joining fee.\n\nSo $100 of profit is about $70 to you — less if the fee is taken on each winning trade rather than on the net result. The card says «Schedule 1 Week» but does not say whether the fee is worked out on each trade or on the week's net result. Ask your sponsor.\n\nPublished results, Myfxbook included, show the strategy's own account. The 30 % fee is charged to followers, so it is not taken out of those curves."],["The rules, from the broker's own help centre","You can withdraw profits at any time, any hour, any day; the broker says the payout then takes 1–3 working days.\n\nYour original deposit can only be taken out 30 days after your first trade — not 30 days after you paid in — and taking it out closes the account immediately. Upgrading the account starts that 30-day clock again.\n\nThere is no daily loss limit, only the 10 % line (5 % with the community token), and you may hold as many of these accounts as you want."],["Commission and leverage, measured on your own money","Commission on an amplified account is $10 per lot on forex and metals, charged when the trade closes. For indices and crypto the broker's own help articles give two different answers: one says $10 per lot on everything, another says $1 on indices and nothing on crypto.\n\nThe form shows leverage 1:30, but it applies to the multiplied balance. Measured against your own deposit, 24 × 30 = 720:1 — more than the 1:500 of a standard account, not less. At 12× it is 360:1."]]},compare:{cols:["12×","24×"],en:{title:"12× or 24× — the same $100",rows:[["Trades as","$1,200","$2,400"],["The account closes after a loss of","10 %","5 %"],["A fall that takes your whole $100","8.3 %","4.2 %"],["Leverage on forex and metals, measured on your own money","360:1","720:1"],["Token","None","#Aitech + 000000"]],note:"Gains are 12 or 24 times larger too. The record's deepest dip, 0.86 %, would have been about 10 % or 21 % of your deposit."}}},ib:{en:{lede:"This part is optional. You can open an account, let Sonic run, and never introduce a single person. Nothing on the platform requires it. It is here because people ask how it works, and because half-explained money is how communities go wrong.",blocks:[["What an IB actually is","The broker already charges a spread and a commission on every trade, whether you introduced anyone or not. An Introducing Broker gets a share of what the broker earns. That is the usual mechanism across the industry, and it is not a separate fee on the person you introduced. On Sonic there is one more thing to know: part of what the people above you earn comes from the member's own 30 % performance fee. The fee is the same either way, but it is the member who pays it."],["The lock nobody explains","The plan has ten generations. They start locked. Your IB Portal shows two lines that decide everything: «# of Directs with active Trading account» and «Generations unlocked». Generations open only when your directs — the people you introduced yourself — have active trading accounts. Until then, the level-based streams pay nothing on the locked levels. How they open, according to the Tag Markets presentation other teams use: you need at least $250 in trading yourself, which opens the first three levels. Levels four to ten open as up to ten people you introduced directly each have $250 in trading. The portal does not show the rate per level.","lock"],["Two programmes: international and Europe","AiTech's own presentation of 3 October 2026 shows two versions of the programme. The international one, for members outside Europe, pays on ten levels: 2.5 % of each trade's profit per level, and per lot $2.00, $1.50, $1.00, $1.00 and then $0.50 on levels five to ten — up to $8.50 per lot in all. The European one pays on one level only: 2.5 % that can rise to 22.5 % with volume, $2.00 per lot that can rise to $6.50, and a general bonus of $2.00 per lot plus a bonus payment. In the CopyX app that general bonus has steps at $10,000, $50,000, $200,000 and $500,000 of team volume.\n\nThe broker's own help centre documents a third table for its amplified accounts — $3.00, $1.20 and $0.60 on three levels. That table may belong to Tag Markets' own partner plan rather than AiTech's. The same help centre says a trade only counts for commission if it stays open for at least 3 minutes.","ladder"],["How the bonus model is drawn","The presentation draws it in five parts. First the split of every trade's profit: 70 % stays with the member, 5 % goes to the developers, and 25 % is shared ten levels down in the structure — the 2.5 % per level above. Then the per-lot commission, the leader pools with an ambassador rate of $2.00 per lot, «CPA» on the new money deposited in your network, and incentives.\n\nFor CPA and the pools the presentation and the portal show how much volume each step needs — see «The nine streams, by name». When each of the ten levels opens depends on your directs, as «The lock nobody explains» describes. Ask your sponsor to show you your own figures in the IB Portal before you count on any of it. The presentation marks the programme «subject to local restrictions» and «only available to professional Influencer»."],["A worked example with real sizes","Suppose twenty members each put in $100. At 24× each trades as $2,400. Copying the strategy's own volume — about 4.5 lots a month on about $130,000 — twenty such accounts trade about 1.7 lots a month between them. At $2.00 per lot on the first level, that is about $3.30 a month, and only once that level is open.\n\nThe volume comes from the strategy and from how much your members put in, not from anything you control. Run the number for your own team, not the one in someone's screenshot."],["The formula, so you can put your own numbers in","monthly rebate ≈ members × trades each × lots per trade × rate per lot. Every part after the ≈ sign is yours to check: the lot size depends on your leverage, and the rate depends on which programme your agreement is under. Put in your own numbers and the answer is yours, not someone else's claim."],["The nine streams, by name","So you recognise them in the portal rather than in a chat message: Lot Commissions, Profit Share, CPA Earnings, Leader Pool 1 and 2, Sonic Pool, Profit Pool, NeoFX Pool and Super Sonic Bonus. «CPA Earnings» is not paid per person. It is a monthly percentage of the new money your whole team deposits — from 1 % at $10,000 to 7.5 % at $100,000,000 — counted after a «50% rule», so no more than half may come from your strongest line, and paid as the difference to anyone below you who qualifies too. One overview slide in the presentation calls it a payment per qualified registration; the portal and the presentation's own table show it as a percentage of deposits. Leader Pool 1 starts at $500,000 of team volume, Leader Pool 2 at $1,000,000. Payouts are made in USDT."],["What is not promised","No income is guaranteed and it can be zero. Everything above depends on other people depositing and trading, which depends on them choosing to, which you do not control. Treat it as a share of activity that may happen, not as a plan."],["Your own link — before you register","Is this the right person? If you are the one inviting others, sign up from your own link instead — not from someone else's. Once your account is created, it cannot be moved.","ledere"]],unverified:"These are the programme's published rates, not what you will be paid. What you actually earn shows in your own IB Portal — check it there before you repeat a number to anyone.",lock_cap:"Ten generations. Zero open until directs with active accounts unlock them.",ladder_cap:"AiTech, international: $2.00 · $1.50 · $1.00 · $1.00, then $0.50 on levels 5–10 — up to $8.50 per lot"}},menu:{en:{lede:"Pick the part you need now — the rest stays here.",back:"All sections",items:[["earn","Sonic","The strategy that trades for you — record, calculator and withdrawals."],["start","Get set up","From link to account — ten short steps."],["tools","Tools","Market clock, risk, journal and apps."],["learn","Learn trading","Pips, lots and candles — made simple."],["chat","The group in Element X","Ask and learn together with the others."],["calc","Try your amount","What the history would have given you."],["faq","Questions & answers","What everyone asks — with search."],["ib","IB and bonuses","Optional: earn by sharing Aimpire."]],wotd:"Word of the day",wotd_more:"Read more",badge:"Academy complete — great work! 🏅",tabs:["Home","Start","Products","Learn","Tools"]}},share:{label:{en:"Recommend to a friend"},text:{en:"I'm learning trading with Aimpire — step by step, in your own language. Have a look: {LINK}\n(Open it in Chrome or Safari, not inside the app.)"},hint:{en:"Know someone who wants to learn trading? Share Aimpire — it takes ten seconds."}},search:{ph:{en:"Search the whole guide…"},none:{en:"Nothing found — try another word, or ask in ❓ Questions."},close:{en:"Close"},answer:{en:"Answer"},popular:{en:"What people ask"},more:{en:"Read it all"},related:{en:"Related"},didyou:{en:"Did you mean"},recent:{en:"Your recent searches"}},install:{title:{en:"Turn Aimpire into an app"},body:{en:"Add it to your home screen — then it opens with one tap, and you never need the link again."},button:{en:"Add to home screen"},how:{en:"How"},ios:{en:"iPhone: 1) Tap the Share icon ⎙ (bottom of Safari). 2) Choose «Add to Home Screen». Done — the icon is now on your phone."},android:{en:"Chrome: tap ⋮ at the top, then «Add to Home screen»."},inapp:{en:"Opened inside WhatsApp or Element? Tap ⋮ and choose «Open in Chrome» (or Safari) first."},open_chrome:{en:"Open in Chrome"},later:{en:"Not now"},inapp_bar:{en:"You opened Aimpire inside {APP}. Open it in your browser so it remembers your sponsor and your progress."},inapp_any:{en:"an app"},inapp_ios:{en:"Tap ⋯ or ••• at the top, then «Open in browser»."}},apps_page:{list:[{key:"mt5",name:"MetaTrader 5",android:"https://play.google.com/store/apps/details?id=net.metaquotes.metatrader5",ios:"https://apps.apple.com/app/metatrader-5/id413251709",icon:"assets/app-mt5.jpg"},{key:"element",name:"Element X",android:"https://play.google.com/store/apps/details?id=io.element.android.x",ios:"https://apps.apple.com/app/element-x/id1631335820",join:"https://matrix.to/#/%23aimpire:matrix.org",icon:"assets/app-element.jpg"}],en:{lede:"Two apps, both free. You can install them now — the guide tells you when you need each one.",mt5:"Shows your account and every trade Sonic opens for you. You log in with the details from step 9.",element:"The chat app the Aimpire group uses. Install it before you press the join link in step 10 — the link opens inside the app.",browser:"Tag Markets, CopyX and the IB Portal run in your browser. There is no app to install for them.",warn:"Install only from Google Play or the App Store, through these links. If anyone sends you an app file or a «Tag Markets app», do not install it — fake apps are a common way people lose their login and their money.",join_note:"Installed it? Then join:",join:"Join the Aimpire group"}},faq:{en:{lede:"Short answers to what people ask. Search, or tap a question.",search:"Search the questions",none:"No question matches that. Ask in the Aimpire group — someone has usually wondered the same.",items:[["Is this a scam?","It is a fair question, and you should ask it about anything involving money.\n\nWhat you can check yourself: your money sits with the broker, never with Aimpire or your sponsor; profit can be withdrawn whenever you ask; and the rules on this page are quoted from the broker's and the platform's own pages.\n\nSo put in only what you can afford to lose completely. Nobody can promise you that the strategy keeps making money."],["Is it halal?","That is for you to decide — scholars see trading differently. Here is how it works in practice:\n\n⏱️ A trade lasts about 4 hours on average — Sonic trades within the day.\n🚫 The strategy account shows $0 in interest (swap) on Myfxbook.\n🕌 The broker also has an Islamic account type, without swap.\n🧾 There are small fees, like commission per lot. Those are fees, not interest."],["Who holds my money?","The broker, Tag Markets — not Aimpire and not your sponsor. Never send money to a person, and only deposit from inside your own portal."],["How much do I need to start?","The minimum is $10, both for the deposit and for connecting Sonic. Start with an amount you could lose completely, and watch it for a few weeks before you decide on more. Note: $10 has to arrive after the fees, so send a little more."],["Is this allowed in my country?","Rules differ between countries and change, so check your own before you deposit — we cannot give legal advice. Two separate things matter.\n\nThe broker's own list: the broker publishes an up-to-date list on its own website of where it operates. That list can change, so read it at the source before you register — don't rely on anyone's summary, including ours.\n\nYour own country's rules: these are about you, not the broker. Check what your central bank or financial regulator says about sending money abroad for trading, and ask your bank if you are unsure. In Pakistan this is covered by the State Bank's EPD Circular Letter No. 08 of 2022 — read it before you deposit. The broker's list says nothing about that."],["Which apps do I need?","Two, both free: MetaTrader 5 to see your account, and Element X for the Aimpire group. Install them from the official stores only. Tag Markets, CopyX and the IB Portal run in your browser."],["How long does approval take?","The broker says verification «just takes a few minutes», with delays when demand is high or documents are incomplete. You need an ID document and a face scan. If it is rejected, the reason comes by email from SumSub. Use any waiting time for step 6, the apps."],["What does 24× mean for me?","With the Aimpire token your money trades 24 times larger: in our own test, $109 became a trading balance of $2,616. Gains and losses are both 24 times larger. A fall of 4.2 % in that balance is your whole deposit, and the account closes at 5 %."],["What does it cost?","The Sonic strategy takes a 30 % performance fee on profit, so you keep about 70 % of the profit — the Amplify section explains why it can be less. There is no management fee and no joining fee. On Amplify accounts the broker also charges $10 per lot in commission on forex and metals. Then there are the costs any trade has: the spread, swap on positions held overnight, and network fees when you deposit or withdraw crypto."],["Can I withdraw my money?","Profits: yes, you can withdraw them at any time, any day. Your deposit: only 30 days after your first trade, and taking it out closes the account immediately. An upgrade starts those 30 days again. The broker says payouts take 1–3 working days. The steps are under «Sonic» → «Withdrawals»."],["Can I reinvest my profit?","Yes. In CopyX open Follower Hub, then Strategies, press Reinvest on the strategy, enter the amount and press Upgrade. Know this first: the broker says an upgrade restarts the 30 days before your deposit can be taken out."],["Is there a daily loss limit?","No daily limit. There is one total limit: 10 % of the starting balance, or 5 % with the Aimpire token. Reach it and the account is closed automatically."],["Is the profit guaranteed?","No. Nothing here is guaranteed. Published results — Myfxbook included — are past results from the strategy's own account, without the fee you pay — not a forecast."],["How do I know the token worked?","Look at the balance in MetaTrader 5: with the token it is 24 times what you put in. If it is not, stop and ask your sponsor before you do anything else."],["Someone says I need eCredits, or must send crypto, to get 24×.","Not through Aimpire. Our token is #Aitech with the code 000000, and you send nothing for it. The platform also has an «#eCredits» route: there you send as many eCredits as you invest to a wallet address, so $100 means 100 eCredits on top of your deposit.\n\nIf anyone asks you to send money or crypto anywhere other than your own deposit page, stop and ask your sponsor."],["Can I have more than one account?","Yes. The broker says you may hold as many as you want, as long as each one follows the rules."],["My deposit has not arrived.","Check the transaction in your own wallet first — the portal cannot show money that never reached it. Your wallet's own estimate can say up to 24 hours. After that, send your sponsor the transaction ID, never a screenshot of your login."],["I chose the wrong network.","A wrong network can mean the money never arrives — wallets warn of «permanent loss of funds». Contact your wallet's own support with the transaction ID straight away. Nobody in Aimpire can reverse a crypto transfer."],["Someone says they are support and asks for my password.","Do not give it — not to support, not to a leader, not to anyone. Aimpire will never ask for it. If someone needs to see your results, give them the Investor Password: it can only look, not trade."],["I forgot my password.","The broker has its own guide for changing it, under «Get set up» → «Guides that already exist». Never ask anyone in a chat to reset it for you."],["Do I have to invite other people?","No. You can open an account, let Sonic run and never introduce anyone. Earning as an introducing broker is optional, and nothing on the platform requires it."],["How do I get a statement for my taxes?","The MetaTrader 5 terminal on a Windows computer can export it: open the History tab at the bottom, right-click, choose Export and save it as HTML, then print that to PDF. Keep the receipts for every deposit and withdrawal too. The rules depend on your country, and we cannot give tax advice."],["Where do I get help?","First this page. Then your sponsor — the person who invited you — for anything about your account. If money does not arrive or something seems wrong, your sponsor takes it further. And ask in the Aimpire group: someone has usually had the same question."],["When does the market move the most?","Around scheduled news. The economic calendar marks each release with an expected impact, and the strongest — like interest-rate decisions — are marked High. The minutes around a High release can move prices fast, in both directions, and spreads often widen. Many wait out about 15 minutes on each side of a High release before judging anything. Note: the calendar feed shows New York time, so convert it to your own clock. You find the calendar under Tools."],["I see an old version of the page","If a button at the top says a new version is ready, tap it. Otherwise close every Aimpire tab in your browser and open the link again from your sponsor's message. Still the old page? Reload it once — on a phone, pull the page down. As a last check you can open the link in a private window (Chrome: Incognito, Safari: Private), but a private window forgets your sponsor and your progress when you close it."]]}},withdraw:{en:{lede:"Profit can come out any time; the deposit only 30 days after your first trade, and taking it out closes the account. The path has three parts, and the middle one is only needed the first time. Do it once early, with a small amount, so you know it works before you rely on it.",parts:[["From Amplify to your Tag wallet","On the Dashboard, open AMPLIFY. Profit you can take out is shown under AVAILABLE. Press WITHDRAW, enter the amount, press WITHDRAW again, then CONTINUE. The back office reviews it, so it can take a while to appear in your Tag Markets Wallet — refresh the page."],["First time only: add your own wallet","Open TAG WALLET → YOUR CRYPTO WALLETS → ADD A CRYPTO WALLET. Fill in the owner's name, choose CRYPTO, add your billing details and the address of your own wallet, enter your dashboard password and press SUBMIT CRYPTO WALLET. It shows PENDING VALIDATION — usually 5 to 45 minutes, up to 24 hours."],["From your Tag wallet to your own wallet","TAG WALLET → WITHDRAWALS. Enter the amount and press SUBMIT REQUEST, tick the box, press «Your attention is required. Please click here», enter the wallet you verified, and choose CRYPTOCHILL — without it the withdrawal is not processed and you have to start again. Check the details and press WITHDRAW."]],facts:"The broker's minimum withdrawal is $10 on Ethereum (ETH), BNB (BSC) and Bitcoin (BTC), and $50 on Tron (TRX). A network fee is deducted, and it depends on the network — so what arrives is roughly the amount minus the network fee. The broker says Amplify payouts take 1–3 working days, and crypto withdrawals 2–24 hours for amounts up to $999, up to 48 hours for amounts up to $4,999, and up to 72 hours above that. Profit in CopyX can also be taken out from Follower Hub, Strategies, Withdraw; it then lands in your Tag Markets wallet. Withdrawals go back first to the method you deposited with, newest deposit first — if you deposited by card, the withdrawal goes to the card first."}},results:{source:"https://www.myfxbook.com/members/SonicExperts/sonic-ai/12076857",months:[["2024-11",1.12,.13],["2024-12",1.18,.15],["2025-01",1.23,.17],["2025-02",1.25,.1],["2025-03",1.06,.21],["2025-04",1.26,.81],["2025-05",1.78,.6],["2025-06",1.18,.71],["2025-07",1.45,.5],["2025-08",1.61,.42],["2025-09",1.63,.15],["2025-10",1.17,0],["2025-11",.91,.03],["2025-12",1.16,0],["2026-01",.61,0],["2026-02",.55,.03],["2026-03",.8,0],["2026-04",1.26,0],["2026-05",1.09,0],["2026-06",1.06,.01],["2026-07",1.17,.02],["2026-08",.88,0],["2026-09",1.04,0],["2026-10",.42,.01]],stats:["+30.58 %","+1.13 %","−0.86 %","634","82–83 %"],en:{lede:"From the strategy's own Myfxbook record — a standard Tag Markets account at 1:500 — from 3 November 2024 to 14 October 2026. Each bar is one month's gain; the mark below it is that month's largest dip. The 30 % fee you pay is not taken out of these figures. Past results, not a forecast.",stats:["In total","Average month","Largest dip","Trades","Win rate"],legend:["gain","largest dip"],notes:["No losing month in 24 — which also means this record has not yet been tested by one.","Losing days happen: 49 of the 427 daily readings. The worst, −0.64 % on 3 June 2025, is about −15 % of your deposit in one day at 24×; the deepest dip, −0.86 %, about −21 %.","The average loss ($134.97) is bigger than the average win ($93.37). The high win rate carries the result, so a run of losses costs more than a run of wins earns.","The account closes at 5 %. The record's deepest dip, 0.86 %, is about a sixth of that distance.","Dips here are measured on each day's closing balance; inside a day they can go deeper. The record has gaps — the longest is 20 August to 12 September 2025 — and each counts as a single reading.","The strategy card inside CopyX labels 0.26 % as «Max DD». A slide in AiTech's presentation calls 0.26 % the average drawdown and 0.86 % the deepest. Myfxbook's deepest is 0.86 %, and that is the one we use."],formula:"Effect on your deposit = the account's fall in % × 24.",link:"Check it yourself on Myfxbook",read:"Figures read on 15 October 2026.",table:"Show the numbers"}},calculator:{live:!0,multiple:24,wipe:4.2,worst_day:.64,periods:[6,12,23],en:{lede:"Enter an amount. This shows what the record would have left you, after all costs — the past applied to your money, not a forecast.",amount:"Amount you put in ($)",period:"Period",periods:["Last 6 months","Last 12 months","All 23 full months"],total:"What you would have kept, over the period",months:"Your best and worst month",risk:"The same 24× on the way down",risks:["A fall of 4.2 % in the trading balance takes all {A}; the account closes at 5 %.","The record's worst day (−0.64 %) would have cost {D} of your {A} in one day.","The record has no losing month, so this calculator cannot show you one. That is exactly why it is not a forecast."],method:"Method: each month = amount × 24 × (that month's gain − commission − fee). The commission is estimated from the lots Myfxbook shows, on a $130,000 account; if the strategy account already pays the same commission, the real cost is lower. Small amounts cannot copy exactly: at about 0.17 lot per trade on $130,000, a deposit below roughly $330 at 24× would need trades smaller than 0.01 lot, the usual minimum. How CopyX handles that is not published.",disclaimer:"Past results applied to your amount — not a guarantee, not advice. Only put in what you could lose completely.",rows:["Before costs","Commission, $10 per lot","Performance fee, 30 %","What you keep"],range:"Two numbers, because nobody publishes how the 30 % is settled. Taken weekly on the net result, you keep the higher one. Taken on every winning day, you keep the lower one. Per trade, it 00 of new deposits in a month for 1 % (from your direct level), then $50,000, $200,000 and $1,000,000, up to $100,000,000 for 7.5 %. Counted after the 50 % rule, and paid as the difference to anyone below you who qualifies too."],["Leader Pool 1","A share of a monthly pool. The presentation gives an ambassador rate of $2.00 per lot.","$500,000 of team volume in a month after the 50 % rule — no more than $250,000 of it from your strongest line."],["Leader Pool 2","A share of a second monthly pool.","$1,000,000 of team volume in a month after the 50 % rule — no more than $500,000 per share from your strongest line."],["General bonus (European programme)","$2.00 per lot plus a bonus payment.","Steps at $10,000, $50,000, $200,000 and $500,000 of team volume, after the 50 % rule. Shown in the CopyX app."],["October prize draw (Sonic Referral Challenge)","Prizes of $10,000 each, drawn from tickets.","One ticket for every 2 new people you introduce directly in October who each reach at least $250. No cap on tickets."],["Travel voucher","A $2,000 travel voucher or the same in USDT, once a year.","$50,000 of new monthly active balance in your whole network, three months in a row, not counting your directs' own deposits. The portal adds «50/50» without explaining it — most likely the same 50 % rule as above, so no more than half from your strongest line. Ask your sponsor to confirm."],["Watch award (Leader Pool 1)","A luxury watch worth up to $15,000.","Qualify for Leader Pool 1 two months in a row."],["Watch award (Leader Pool 2)","A luxury watch worth up to $25,000.","Qualify for Leader Pool 2 two months in a row."],["Home award (Leader Pool 2)","A home worth up to $1,200,000.","Qualify for Leader Pool 2 with at least three shares of $1,000,000 each, six months in a row."],["Sonic Pool, Profit Pool, NeoFX Pool, Super Sonic Bonus","Listed by name in the IB Portal.","Their conditions are not shown in the portal or the presentation. Ask your sponsor before you count on any of them."]],note:"Cash payouts are made in USDT, only to accounts that qualify, and the programme is marked «subject to local restrictions». The international programme applies outside Europe. None of this is income you can count on. Figures from AiTech's presentation of 3 October 2026, the IB Portal and the CopyX app, read on 15 October 2026; the rule for opening levels comes from a presentation other teams use."}},p2p:{video:"https://youtu.be/P3C9WztzEas"},jump:{en:{results:"Track record",calc:"Calculator",withdraw:"Withdrawals",ib:"IB & bonuses",sonic:"Sonic",hours:"Market hours",sizing:"Size & risk",journal:"Journal",toolkit:"Links & apps"}},ui_labels:{labels:["Sign Up","Register to CopyX","CopyX Registration","Login to CopyX","Deposit","Details","Connect","Verify","Submit","Copy Now","Continue","WITHDRAW","CONTINUE","SUBMIT REQUEST","Withdraw","Express","Paid","Community Token","Hash","MT5 Credentials","Master Password","Investor Password","Balance","Equity","Free Margin","AVAILABLE","TAG WALLET","WITHDRAWALS","Pending","Validate","Follower Hub","Strategies","Dashboard","Reinvest","YOUR CRYPTO WALLETS"],gloss:{}},alt_compare:{en:{title:"Bank, fund or Sonic — side by side",lede:"The same questions for three places to keep money. Sonic's record shows the highest return of the three and no losing month in its 24 months — but a record that short is no promise, and Sonic is the only one of the three where you can lose everything.",cols:["Bank savings","Index fund","Sonic"],rows:[["What you can lose","Nothing, up to the guarantee ¹","It fell 57 % in 2007–09 ²","All of it"],["Return so far","Follows the central bank rate ¹","9 % a year since 1987; 13.4 % over 10 years ²","About 14.7 % a year (+30.6 % in total) ³"],["Length of the record","Decades","38 years","Under 2 years"],["Getting money out","Any time","A few days","Profit in 1–3 working days; deposit 30 days after your first trade, and it closes the account"],["Costs","Usually none","A yearly fund fee","30 % of profit + $10 per lot + spread"],["Suits money you","need soon","can leave for years","could lose completely"]],notes:["¹ Bank deposits are guaranteed up to NOK 2 million per person per bank in Norway, and up to PKR 1,000,000 in Pakistan. Savings rates follow the central bank rate: 4.50 % in Norway (Norges Bank, 23 September 2026) and 11.5 % in Pakistan (State Bank of Pakistan, 14 September 2026).","² MSCI World index, in US dollars, before fund fees: 9.02 % a year from December 1987 to September 2026, and 13.37 % a year over the last 10 years. Its largest fall was 57.46 %, from October 2007 to March 2009.","³ The strategy's own Myfxbook account at 1:500, 3 November 2024 to 14 October 2026, before the 30 % fee and the $10-per-lot commission. Your own account is on Amplify, where gains and losses are 24 times larger — the calculator shows what that means for your amount."],disclaimer:"This compares published figures. It is not financial advice and not a recommendation, and past results are no guarantee of future results. Figures are in US dollars; exchange rates can raise or lower them in your currency. Tag Markets states that 80 % of retail investor accounts incur losses."}},leader_signup:{_readme:"Founders Google-skjema og publiserte liste over godkjente (B-016). Skjemaet tar imot soeknaden; arket «Aimpire – ledere (godkjenn her)» er der founder huker av «Approved». Tomt form-felt = lederverktoeyet faller tilbake til ledere.txt-linja.",form:"https://docs.google.com/forms/d/e/1FAIpQLSew3TQFfh54TazjiF2S5UHsNquzUuDvRSS3jK-IKRO8CNw25g/formResponse",name_field:"entry.1588080115",link_field:"entry.1299161573",approved_csv:"https://docs.google.com/spreadsheets/d/e/2PACX-1vQCUbvpu8cXdh-V-XkfvqAevZlabu876V-j8HNNd_qJGDOpPhbwVukJa--Vum5QWLuyQwEQM9Y5gMSc/pub?gid=2115650304&single=true&output=csv",mail_field:"entry.1642551334",lang_field:"entry.1056248770",sponsor_field:"entry.2086565291"},canonical:"https://aimpire.github.io/",analytics:{_readme:"Cloudflare Web Analytics: ingen cookies, ingen IP lagret. Lim inn token fra dash.cloudflare.com -> Web Analytics -> Add site. Tomt = ingen maaling, ingen skript lastes.",cf_token:""},sessions:{hours:[["sydney","Australia/Sydney",7,16,"#15D8C4"],["tokyo","Asia/Tokyo",9,18,"#C21FBF"],["london","Europe/London",8,17,"#1B4FD8"],["newyork","America/New_York",8,17,"#E3B505"]],en:{title:"Market hours in your time",lede:"The currency market runs in four big sessions. These are their usual hours, shown in your phone's own time.",open:"Open",closed:"Closed",closes_in:"closes in {T}",opens_in:"opens in {T}",hm:"{H} h {M} min",overlap:"London and New York overlap {A}–{B} your time — usually the most active hours of the day.",rollover:"A new trading day starts at 17:00 New York, which is {A} your time. Positions held past it pay or earn swap.",weekend:"The currency market is closed for the weekend. It opens again at 17:00 New York on Sunday — {A} your time.",note:"These hours are a convention, not a rule. Gold and other instruments can follow their own hours — check Specification in MT5.",cities:{sydney:"Sydney",tokyo:"Tokyo",london:"London",newyork:"New York"},asleep:"Asleep",now_open:"🟢 Open now: {L}",now_asleep:"😴 Asleep: {L}",now_none:"😴 All four sessions are asleep right now.",now_weekend:"😴 Weekend — all four sessions are asleep.",local:"{T} there",you:"Your time: {T} · {Z}",mk:"Markets now",news_t:"Next big news",news_in:"in {T}",news_none:"No more big news this week.",news_tip:"Prices can jump around news like this. Many traders take extra care 15 minutes before and after."}},possize:{inst:[["eurusd","EUR/USD",10,"pip"],["gbpusd","GBP/USD",10,"pip"],["audusd","AUD/USD",10,"pip"],["xauusd","XAU/USD",100,"usd"]],en:{title:"Position size calculator",lede:"How big a trade is when you decide in advance how much you are willing to lose. Arithmetic, not advice.",bal:"Account balance ($)",risk:"Risk per trade (%)",inst:"Instrument",stop_p:"Stop distance (pips)",stop_d:"Stop distance (gold price, $)",r_usd:"You risk",lots:"Size",floor:"Below the smallest size (0.01). Even 0.01 lot would risk {X} here — {P} of your account.",check:"Contract sizes differ between brokers. Check Specification in MT5 before you trade.",formula:"lots = risk in $ ÷ (stop × value of 1.00 lot), rounded down to 0.01",gold:"Gold"}},streaks:{en:{title:"Losing streaks — try it yourself",lede:"Even a sound method has long runs of losses. Pick the numbers and see 1,000 random runs of 100 trades each. This is a dice game, not a forecast.",win:"Win rate (%)",rr:"Win size compared with loss size (×)",risk:"Risk per trade (%)",run:"Run again",streak:"Longest losing streak (typical)",dd50:"Runs that fell 50 % below the start",end_below:"Runs that ended below the start",note:"Each trade here is a coin with your win rate — real trades are not that tidy. The point is the shape: losing streaks are normal, and the risk per trade decides whether you get through them.",median:"Middle line (median)"}},journal:{en:{title:"Trading journal",lede:"Write down each trade: what, why, and what happened. It is stored only on this phone — nobody else can see it.",inst:"Instrument",dir:"Direction",buy:"Buy",sell:"Sell",lots:"Size (lot)",res:"Result ($, minus for a loss)",note:"Why did you enter, and what did you learn?",add:"Save trade",empty:"No trades yet.",count:"{N} trades · {W} won · {L} lost",total:"Total result",export:"Download as CSV",clear:"Delete all",confirm:"Delete all trades on this phone?",warn:"Never write passwords or account numbers here. Download a copy now and then — the browser can clear what it stores.",del:"Delete",curve:"Your result over time"}},theme_ask:{en:{title:"Light or dark?",body:"Choose how Aimpire looks on your phone. You can switch any time with ◐ at the top.",light:"Light",dark:"Dark",close:"Close"}},update_ready:{en:"A new version of Aimpire is ready"},ibq:{en:{title:"How you earn, in short",lede:"You share your link. People who join through it trade. You get a small part: an amount per lot from the broker, and a share of the profit on their trades.",flow:[["You","share your link"],["Your friend","opens an account and trades"],["You","earn a little from their trades"]],flow_note:"Your friend pays no extra fees for this.",steps_t:"Get started in 3 steps",steps:[["Have $250 trading yourself","That opens the first three levels of your team."],["Share your own link","Everyone who joins through your link lands in your team."],["Follow it in the IB Portal","As up to ten people you invited directly reach $250, levels 4 to 10 open. Your numbers are always in the portal."]],portal:"Open the IB Portal",ladder_t:"The ten levels",ladder_cap:"What you get per lot on each level. Levels 1–3 open with your own $250, the rest as your team grows. The portal shows which levels are actually open for you.",open:"Open with $250",grow:"Opens as your team grows",ex_t:"Example",ex:[["Ali","has $250 trading"],["Sara","joins through Ali's link"]],ex_body:"Sara is on Ali's level 1, which is open. Every time Sara trades 1 lot, Ali gets $2.00. If Sara makes $100 on a trade, she keeps $70 and Ali gets $2.50.",honest:"These rates are from the international programme (outside Europe); Europe has its own programme. No income is guaranteed. What you actually get is shown in your IB Portal.",more:"All details, bonuses and sources",lv_t:"What do level 1, 2 and 3 mean?",lv:[["Level 1","The people you invite yourself"],["Level 2","The people they invite"],["Level 3","The next ones after that"]],lv_more:"… and so on down to level 10. You get a part from every level that is open.",un_t:"How you unlock more levels",un:[["You have $250 trading","Levels 1–3 open"],["People you invited directly reach $250","Levels 4–10 open step by step, with up to ten such people"]],un_note:"The IB Portal always shows how many levels are open for you.",st_t:"Bigger bonuses: the staircase",st_a:"New deposits in your team during one month",st_a_lbl:"CPA",cpa:[["$10,000","1%"],["$50,000","2%"],["$200,000","3.5%"],["$1
